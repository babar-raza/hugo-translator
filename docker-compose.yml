services:
  # Translation Orchestrator
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    image: hugo-translator-orchestrator:latest
    container_name: hugo-translator-orchestrator
    env_file:
      - .env.production
    environment:
      - MODE=auto
      - CONFIG_PATH=/app/config
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - USE_SHARED_ENGINES=true  # Phase 5.2: Enable SharedEngines
      - QUEUE_BACKEND=redis
    volumes:
      - ./config:/app/config:ro
      - D:/onedrive/Documents/GitHub/aspose.net/content:/content
      - tm_data:/data/tm
      - model_cache:/data/models
      - artifacts:/data/artifacts
      - logs:/data/logs
      - metadata_storage:/data/metadata
    networks:
      - hugo-translator-network
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; from pathlib import Path; sys.exit(0 if Path('/app/src').exists() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis - Job Queue Backend
  redis:
    image: redis:7-alpine
    container_name: hugo-translator-redis
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy allkeys-lru --loglevel notice
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - hugo-translator-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # CPU Worker (Phase 2: Dual-Run with docker_cpu mode)
  worker-cpu:
    build:
      context: .
      dockerfile: Dockerfile
    image: hugo-translator-worker:latest
    container_name: hugo-translator-worker-cpu
    command: ["python", "-m", "src.workers"]
    env_file:
      - .env.production
    environment:
      - EXECUTION_MODE=docker_cpu  # Phase 2: Enable dual-run execution layer
      - WORKER_ID=cpu-1
      - WORKER_MODE=processor
      - DEVICE=cpu  # Will be enforced by DevicePolicy
      - REDIS_HOST=hugo-translator-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - POLL_INTERVAL=3  # Faster polling for CPU workers (from mode config)
      - MAX_RETRIES=5  # More retries for CPU workers (from mode config)
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - USE_SHARED_ENGINES=true  # Phase 5.1: Enable SharedEngines
    volumes:
      - ./config:/app/config:ro
      - D:/onedrive/Documents/GitHub/aspose.net/content:/content
      - tm_data:/data/tm
      - model_cache:/data/models
      - logs:/data/logs
      - metadata_storage:/data/metadata
    networks:
      - hugo-translator-network
    depends_on:
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; from pathlib import Path; sys.exit(0 if Path('/app/src/workers').exists() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # GPU Worker (Phase 2: Dual-Run with docker_gpu mode)
  # Requires NVIDIA GPU and nvidia-docker
  worker-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    image: hugo-translator-worker-gpu:latest
    container_name: hugo-translator-worker-gpu
    command: ["python", "-m", "src.workers"]
    env_file:
      - .env.production
    environment:
      - EXECUTION_MODE=docker_gpu  # Phase 2: Enable dual-run execution layer
      - WORKER_ID=gpu-1
      - WORKER_MODE=processor
      - DEVICE=cuda  # GPU device from mode config
      - CUDA_VISIBLE_DEVICES=0  # GPU passthrough
      - REDIS_HOST=hugo-translator-redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - POLL_INTERVAL=5
      - MAX_RETRIES=3
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - USE_SHARED_ENGINES=true  # Phase 5.1: Enable SharedEngines
    volumes:
      - ./config:/app/config:ro
      - D:/onedrive/Documents/GitHub/aspose.net/content:/content
      - tm_data:/data/tm
      - model_cache:/data/models
      - logs:/data/logs
      - metadata_storage:/data/metadata
    networks:
      - hugo-translator-network
    depends_on:
      redis:
        condition: service_healthy
      orchestrator:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; from pathlib import Path; sys.exit(0 if Path('/app/src/workers').exists() else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - gpu

  # Prometheus - Metrics collection and alerting
  prometheus:
    image: prom/prometheus:latest
    container_name: hugo-translator-prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9190:9090"
    networks:
      - hugo-translator-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Pushgateway - For batch job metrics
  pushgateway:
    image: prom/pushgateway:latest
    container_name: hugo-translator-pushgateway
    ports:
      - "9191:9091"
    networks:
      - hugo-translator-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Grafana - Metrics visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: hugo-translator-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3100:3000"
    networks:
      - hugo-translator-network
    depends_on:
      - prometheus
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
    profiles:
      - monitoring

# Named volumes for data persistence
volumes:
  content_data:
    driver: local
  tm_data:
    driver: local
  model_cache:
    driver: local
  artifacts:
    driver: local
  logs:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  metadata_storage:
    driver: local

# Network for inter-container communication
networks:
  hugo-translator-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
