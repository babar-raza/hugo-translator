# scripts/MANIFEST.toml
#
# Machine-readable registry for scripts at the scripts/ ROOT ONLY.
# Scripts in subdirectories (ci/, ops/, tm/, bench/, etc.) are NOT listed here.
#
# RULES:
# 1. Every file directly in scripts/ MUST have an entry below.
# 2. ci_critical = true means this file is referenced BY PATH in a CI workflow or
#    CONTRIBUTING.md. Do NOT move or rename without a coordinated CI + docs update.
# 3. To add a new script to scripts/ root: add the entry here FIRST, then add the file.
#    CI (scripts/ci/check_manifest.py --strict) will reject unregistered root scripts.
# 4. To retire a script: set status = "deprecated", move the file to scripts/archived/,
#    and remove the entry here. See scripts/README.md for the full retirement policy.
#
# CI ENFORCEMENT:
#   Default mode  — verifies all ci_critical scripts exist; warns on unregistered files.
#   --strict mode — additionally fails if any root script is unregistered.
#                   The release gate runs in --strict mode.
#
# MIGRATION STATUS (as of 2026-06-11): COMPLETE.
# Root contains exactly 7 CI-critical scripts. All others live in subdirectories.

# ---------------------------------------------------------------------------
# CI-CRITICAL SCRIPTS (must stay at root; referenced by path in CI / docs)
# ---------------------------------------------------------------------------

