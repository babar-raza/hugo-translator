name: Telemetry Health Check

on:
  # Disabled automatic schedule - requires self-hosted runner with local telemetry paths
  # schedule:
  #   # Run daily at 9 AM UTC
  #   - cron: '0 9 * * *'
  workflow_dispatch:
    # Allow manual trigger (requires self-hosted runner)

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  health-check:
    runs-on: self-hosted  # Requires self-hosted runner with local-telemetry repo clone
    if: ${{ vars.HAS_SELF_HOSTED_RUNNER == 'true' }}
    timeout-minutes: 10

    # Required repository variables (Settings > Variables > Actions):
    #   TELEMETRY_REPO_PATH  - absolute path to local-telemetry repo clone
    #   HAS_SELF_HOSTED_RUNNER - set to 'true' to enable this workflow

    steps:
      - name: Checkout hugo-translator
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements/cpu.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/cpu.txt

      - name: Verify telemetry path
        run: |
          echo "Checking TELEMETRY_SRC_PATH..."
          if (Test-Path "$env:TELEMETRY_SRC_PATH") {
            Write-Host "Telemetry path exists: $env:TELEMETRY_SRC_PATH"
          } else {
            Write-Error "Telemetry path not found: $env:TELEMETRY_SRC_PATH"
            exit 1
          }
        env:
          TELEMETRY_SRC_PATH: ${{ vars.TELEMETRY_REPO_PATH }}\src
        shell: pwsh

      - name: Run PRAGMA settings diagnostic
        run: |
          cd "${{ vars.TELEMETRY_REPO_PATH }}"
          python scripts/diagnose_pragma_settings.py
        shell: pwsh

      - name: Check database integrity
        run: |
          cd "${{ vars.TELEMETRY_REPO_PATH }}"
          python scripts/check_db_integrity.py
        shell: pwsh

      - name: Validate installation
        run: |
          cd "${{ vars.TELEMETRY_REPO_PATH }}"
          python scripts/validate_installation.py
        shell: pwsh

      - name: Verify recent runs
        run: |
          python scripts/diag/verify_telemetry.py --latest
        shell: pwsh

      - name: Health check summary
        if: success()
        run: |
          Write-Host ""
          Write-Host ("=" * 60)
          Write-Host "TELEMETRY HEALTH CHECK: PASSED"
          Write-Host ("=" * 60)
          Write-Host "PRAGMA settings correct"
          Write-Host "Database integrity OK"
          Write-Host "Installation validated"
          Write-Host "Recent runs verified"
        shell: pwsh
