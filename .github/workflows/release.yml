name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Default to read-only; publish job overrides with write.
permissions:
  contents: read

jobs:
  validate:
    name: Release Validation
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements/base.txt
            requirements/cpu.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/cpu.txt
          pip install -r requirements/dev.txt
        shell: pwsh

      - name: Lint
        run: python -m ruff check src/ tests/ --output-format=concise
        shell: pwsh

      - name: Unit Tests
        run: python -m pytest tests/unit/translation_engine/ tests/unit/validation/ -v --tb=short --timeout=120
        shell: pwsh

      - name: Contract Tests
        run: |
          python -m pytest tests/contract/test_inv001_subprocess.py tests/contract/test_inv002_atomic_writes.py tests/contract/test_inv007_resume_skip.py -v --tb=short
        shell: pwsh

  publish:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release type
        id: release-type
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *"-alpha"* ]] || [[ "$TAG" == *"-beta"* ]] || [[ "$TAG" == *"-rc"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.release-type.outputs.prerelease }}" = "true" ]; then
            gh release create "${{ steps.release-type.outputs.tag }}" \
              --title "${{ steps.release-type.outputs.tag }}" \
              --generate-notes \
              --prerelease
          else
            gh release create "${{ steps.release-type.outputs.tag }}" \
              --title "${{ steps.release-type.outputs.tag }}" \
              --generate-notes
          fi
