name: Release Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'config/**'
      - 'requirements/**'
      - '.github/workflows/release_gate.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements/**'
  workflow_dispatch:
    # Allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements/base.txt
            requirements/cpu.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/cpu.txt
          pip install -r requirements/dev.txt
        shell: pwsh

      - name: Lint (ruff)
        run: python -m ruff check src/ tests/ --output-format=concise
        shell: pwsh

      - name: Translation Engine Unit Tests
        run: python -m pytest tests/unit/translation_engine/ -v --tb=short --timeout=120
        shell: pwsh

      - name: Validation Unit Tests
        run: python -m pytest tests/unit/validation/ -v --tb=short --timeout=120
        shell: pwsh

      - name: Run Contract Tests
        run: |
          python -m pytest tests/contract/test_inv001_subprocess.py tests/contract/test_inv002_atomic_writes.py tests/contract/test_inv007_resume_skip.py tests/contract/test_inv008_git_commit.py -v --tb=short
        shell: pwsh

      - name: Run Core Unit Tests
        run: |
          python -m pytest tests/unit/phase-0 tests/unit/phase-1 tests/unit/phase-3/test_l1_cache.py tests/unit/phase-3/test_l2_persistent.py tests/unit/phase-4/test_registry.py -v --tb=short
        shell: pwsh

  manifest-check:
    name: Scripts Manifest Check
    runs-on: windows-latest
    needs: unit-tests
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Validate scripts/MANIFEST.toml
        # Strict mode: fails if any unregistered script exists at scripts/ root.
        # Also fails if a ci_critical script is missing or has a stale MANIFEST entry.
        # To add a root script: add a [[script]] entry to scripts/MANIFEST.toml first.
        run: python scripts/ci/check_manifest.py --strict
        shell: pwsh

  regression-tests:
    name: Regression Tests
    runs-on: windows-latest
    needs: unit-tests
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements/base.txt
            requirements/cpu.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/cpu.txt
          pip install -r requirements/dev.txt
        shell: pwsh

      - name: Run Signature Preservation Tests
        run: |
          python -m pytest tests/regression/test_signature_preservation.py -v --tb=short
        shell: pwsh

      - name: Run Batch Recovery Tests
        run: |
          python -m pytest tests/regression/test_batch_size_recovery.py -v --tb=short
        shell: pwsh

      - name: Setup Hugo
        run: |
          $version = "0.154.5"
          $url = "https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_extended_${version}_windows-amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile hugo.zip
          Expand-Archive hugo.zip -DestinationPath "$env:RUNNER_TEMP\hugo"
          echo "$env:RUNNER_TEMP\hugo" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Hugo Build Validation
        run: |
          hugo version
          hugo build --source tests/fixtures/hugo_site/ 2>&1
          if ($LASTEXITCODE -ne 0) { exit 1 }
        shell: pwsh

  quality-gate:
    name: Quality Gate (CI Audit)
    runs-on: windows-latest
    needs: unit-tests
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements/base.txt
            requirements/cpu.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/cpu.txt
          pip install -r requirements/dev.txt
        shell: pwsh

      - name: Run Translation Quality Audit (CI fixtures only)
        run: |
          New-Item -ItemType Directory -Force -Path reports/audit | Out-Null
          python scripts/audit_translation_quality.py `
            --mode ci `
            --threshold 0.70 `
            --output reports/audit/audit-ci.json `
            --verbose
        shell: pwsh

      - name: Upload Audit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: reports/audit/audit-ci.json
          if-no-files-found: ignore

  security-scan:
    name: Security Scan
    runs-on: windows-latest
    needs: unit-tests
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            requirements/base.txt
            requirements/cpu.txt
            requirements/dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/cpu.txt
          pip install -r requirements/dev.txt
        shell: pwsh

      - name: Run Bandit SAST scan
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          python -m bandit -r src/ -f json -o reports/bandit.json --exit-zero
          Write-Host "Bandit scan complete (non-blocking)"
        shell: pwsh

      - name: Run pip-audit dependency scan
        run: |
          python -m pip_audit -r requirements/base.txt --format json -o reports/pip-audit.json
          Write-Host "pip-audit scan complete (non-blocking)"
        shell: pwsh
        continue-on-error: true  # advisory — vulnerabilities do not block the gate

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: reports/
          if-no-files-found: ignore

      - name: Security Summary (advisory)
        if: always()
        run: |
          Write-Host ""
          Write-Host ("=" * 60)
          Write-Host "SECURITY SCAN SUMMARY (advisory - non-blocking)"
          Write-Host ("=" * 60)
          if (Test-Path reports/bandit.json) {
            $bandit = Get-Content reports/bandit.json | ConvertFrom-Json
            $count = $bandit.results.Count
            $high   = ($bandit.results | Where-Object { $_.issue_severity -eq "HIGH" }).Count
            $medium = ($bandit.results | Where-Object { $_.issue_severity -eq "MEDIUM" }).Count
            $low    = ($bandit.results | Where-Object { $_.issue_severity -eq "LOW" }).Count
            Write-Host "Bandit SAST: $count findings (HIGH=$high MEDIUM=$medium LOW=$low)"
            foreach ($r in ($bandit.results | Where-Object { $_.issue_severity -in @("HIGH","MEDIUM") })) {
              Write-Host "  [$($r.issue_severity)] $($r.issue_text) @ $($r.filename):$($r.line_number)"
            }
          } else {
            Write-Host "Bandit: report not found"
          }
          if (Test-Path reports/pip-audit.json) {
            $audit = Get-Content reports/pip-audit.json | ConvertFrom-Json
            if ($audit.PSObject.Properties.Name -contains "dependencies") {
              $vulns = ($audit.dependencies | Where-Object { $_.vulns.Count -gt 0 })
              Write-Host "pip-audit: $($vulns.Count) vulnerable package(s)"
              foreach ($v in $vulns) {
                Write-Host "  $($v.name)==$($v.version): $($v.vulns.Count) vuln(s)"
              }
            } else {
              Write-Host "pip-audit: no vulnerable packages"
            }
          } else {
            Write-Host "pip-audit: report not found"
          }
          Write-Host ("=" * 60)
          Write-Host "NOTE: Security issues are advisory. Review reports/bandit.json and reports/pip-audit.json."
        shell: pwsh

  summary:
    name: Gate Summary
    runs-on: windows-latest
    needs: [unit-tests, manifest-check, regression-tests, quality-gate, security-scan]
    if: always()

    steps:
      - name: Report Status
        run: |
          Write-Host ""
          Write-Host ("=" * 60)
          Write-Host "RELEASE GATE SUMMARY"
          Write-Host ("=" * 60)
          Write-Host "Unit Tests:       ${{ needs.unit-tests.result }}"
          Write-Host "Manifest Check:   ${{ needs.manifest-check.result }}"
          Write-Host "Regression Tests: ${{ needs.regression-tests.result }}"
          Write-Host "Quality Gate:     ${{ needs.quality-gate.result }}"
          Write-Host "Security Scan:    ${{ needs.security-scan.result }} (advisory)"
          Write-Host ("=" * 60)

          if ("${{ needs.unit-tests.result }}" -ne "success" -or
              "${{ needs.manifest-check.result }}" -ne "success" -or
              "${{ needs.regression-tests.result }}" -ne "success" -or
              "${{ needs.quality-gate.result }}" -ne "success") {
            Write-Host "RELEASE GATE: FAIL"
            Write-Host "  Unit Tests:       ${{ needs.unit-tests.result }}"
            Write-Host "  Manifest Check:   ${{ needs.manifest-check.result }}"
            Write-Host "  Regression Tests: ${{ needs.regression-tests.result }}"
            Write-Host "  Quality Gate:     ${{ needs.quality-gate.result }}"
            exit 1
          }

          Write-Host "RELEASE GATE: PASS"
        shell: pwsh
