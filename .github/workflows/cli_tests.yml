name: CLI Tests

on:
  push:
    branches: [main]
    paths:
      - 'src/cli.py'
      - 'src/benchmarking/cli.py'
      - 'scripts/analyze_cli_imports.py'
      - 'scripts/test_cli_execution.py'
      - 'scripts/test_cli_runtime.py'
  pull_request:
    branches: [main]
    paths:
      - 'src/cli.py'
      - 'src/benchmarking/cli.py'
  workflow_dispatch:
    # Allow manual trigger

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cli-static-analysis:
    name: Static Analysis
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Analyze src/cli.py
        run: python scripts/analyze_cli_imports.py src/cli.py
        shell: pwsh

      - name: Analyze src/benchmarking/cli.py
        run: python scripts/analyze_cli_imports.py src/benchmarking/cli.py
        shell: pwsh

  cli-execution-tests:
    name: Execution Tests
    runs-on: windows-latest
    needs: cli-static-analysis
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements/cpu.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/cpu.txt
        shell: pwsh

      - name: Run CLI execution tests
        run: python scripts/test_cli_execution.py
        shell: pwsh

      - name: Upload execution test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-execution-report
          path: reports/cli_execution_test_report.md

  cli-runtime-tests:
    name: Runtime Tests
    runs-on: windows-latest
    needs: cli-execution-tests
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements/cpu.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/cpu.txt
        shell: pwsh

      - name: Run CLI runtime tests (quick)
        run: python scripts/test_cli_runtime.py --quick
        shell: pwsh

      - name: Upload runtime test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-runtime-report
          path: reports/cli_runtime_test_report.md

  cli-full-matrix:
    name: Full Option Matrix (manual only)
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements/cpu.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/cpu.txt
        shell: pwsh

      - name: Run full CLI option matrix
        run: python scripts/test_cli_runtime.py --full
        shell: pwsh

      - name: Upload full test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-full-matrix-report
          path: reports/cli_runtime_test_report.md

  summary:
    name: Test Summary
    runs-on: windows-latest
    needs: [cli-static-analysis, cli-execution-tests, cli-runtime-tests]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Report Status
        run: |
          Write-Host ""
          Write-Host ("=" * 60)
          Write-Host "CLI TESTS SUMMARY"
          Write-Host ("=" * 60)
          Write-Host "Static Analysis: ${{ needs.cli-static-analysis.result }}"
          Write-Host "Execution Tests: ${{ needs.cli-execution-tests.result }}"
          Write-Host "Runtime Tests:   ${{ needs.cli-runtime-tests.result }}"
          Write-Host ("=" * 60)

          if ("${{ needs.cli-static-analysis.result }}" -ne "success" -or
              "${{ needs.cli-execution-tests.result }}" -ne "success" -or
              "${{ needs.cli-runtime-tests.result }}" -ne "success") {
            Write-Host "CLI TESTS: FAIL"
            Write-Host "  Static Analysis: ${{ needs.cli-static-analysis.result }}"
            Write-Host "  Execution Tests: ${{ needs.cli-execution-tests.result }}"
            Write-Host "  Runtime Tests:   ${{ needs.cli-runtime-tests.result }}"
            exit 1
          }

          Write-Host "CLI TESTS: PASS"
        shell: pwsh
