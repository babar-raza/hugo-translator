repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.13
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        args: [--check]

  - repo: local
    hooks:
      - id: no-hardcoded-paths
        name: Check for hardcoded user paths
        entry: 'D:\\onedrive|D:/onedrive|C:\\Users\\prora|C:/Users/prora'
        language: pygrep
        types_or: [yaml, python, shell, batch]
        exclude: |
          (?x)^(
            \.env|
            \.pre-commit-config\.yaml|
            tests/integration/test_parallel_mode\.py|
            tests/integration/test_roundrobin_mode\.py|
            tests/regression/test_single_file_translation\.py|
            tests/unit/test_telemetry_path_config\.py
          )$
