# Benchmark corpus configuration (BM-05)
# Defines tiered sampling strategies for different benchmark scenarios

# Corpus tiers for adaptive sampling
tiers:
  # Calibration tier: Quick initial benchmark for fresh setups
  calibration:
    target_samples: 10
    target_duration_seconds: 300  # ~5 minutes
    min_samples_per_category: 1

  # Standard tier: Regular benchmarking
  standard:
    target_samples: 50
    target_duration_seconds: 1800  # ~30 minutes
    min_samples_per_category: 3

  # Comprehensive tier: Thorough analysis
  comprehensive:
    target_samples: 200
    target_duration_seconds: 7200  # ~2 hours
    min_samples_per_category: 10

# Content categories for stratified sampling
categories:
  - technical_docs
  - marketing
  - legal
  - general
  - conversation
  - creative

# Expansion strategy
expansion:
  # Confidence threshold for triggering expansion
  confidence_threshold: 0.8  # 0-1 scale

  # Factor to multiply samples by when expanding
  expansion_factor: 1.5

  # Maximum number of expansion iterations
  max_expansions: 3
