# Global Configuration Defaults for Hugo Translation System

system:
  name: "Hugo Translation System"
  version: "1.0.0"
  environment: "production"  # development, staging, production

# Default TM preferences (overridable per site)
tm_defaults:
  use_semantic_tm: true
  semantic_threshold: 0.80
  fallback_exact_only: false
  l1_cache_size: 10000
  l2_max_size_mb: 1024
  l3_embedding_model: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
  l3_index_type: "IVFFlat"  # Flat, IVFFlat, HNSW

# Default model preferences
model_defaults:
  fallback_model: "m2m100_418m"
  device: "auto"  # auto, cpu, cuda, mps
  batch_size: 8  # Reduced from 32 to avoid CUDA OOM errors
  cache_models: true
  max_cached_models: 2

# Hardware/GPU configuration
hardware:
  enable_gpu: true  # Enable GPU acceleration if available
  max_gpu_memory_mb: 4096  # Reduced from 6144 to 4GB to leave headroom for OS
  gpu_device_id: -1  # -1 = auto-select best GPU, 0+ = specific device
  allow_cpu_fallback: true  # Fall back to CPU if GPU fails
  clear_cache_after_batch: true  # Clear GPU cache after each batch
  clear_cache_frequency: 5  # Clear cache every N batches (new)

# Orchestrator defaults
orchestrator:
  mode: "auto"  # auto, manual
  max_workers: 4
  job_queue_backend: "memory"  # memory, redis
  sweep_interval_hours: 24
  file_watcher_debounce_seconds: 2.0
  enable_file_watcher: true
  enable_sweep_scheduler: true

# Performance settings
performance:
  parallel_translation: true
  max_parallel_files: 8
  model_cache_size: 2
  enable_batch_optimization: true

# Observability defaults
observability:
  # Logging configuration
  logging:
    enabled: true  # Enable structured logging
    log_level: "DEBUG"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
    console_output: true  # Enable colored console output
    file_output: true  # Enable NDJSON file output
    log_file: "./data/logs/hugo-translator.ndjson"  # Path to log file
    max_file_size_mb: 100  # Max size before rotation (MB)
    backup_count: 10  # Number of rotated files to keep

    # Component-specific logging levels (optional overrides)
    components:
      orchestrator: "INFO"  # Job queue, scheduling
      translation_engine: "INFO"  # Segment extraction, translation
      tm: "DEBUG"  # TM lookups, writes, cache stats
      model_runtime: "INFO"  # Model loading, inference
      validation: "INFO"  # Validation checks
      worker: "INFO"  # Worker operations

    # Enable correlation IDs for cross-component tracing
    enable_correlation_ids: true

  # Flow artifacts for debugging
  flow_artifact_detail: "summary"  # none, summary, sampled, full
  flow_artifact_sample_rate: 0.05  # 5% when sampled

  # Metrics collection
  metrics_enabled: true
  metrics_port: 9090
  metrics_pushgateway: ""  # URL of Prometheus Pushgateway (optional)

# Telemetry settings
telemetry:
  validation_metrics: true  # Track validation metrics (decisions, retries, rejection rates)

# Output Layout (defaults for all sites)
default_output_layout:
  per_language_folders: true
  pattern: "{lang}/{path}"

# Paths (can be overridden by environment variables)
paths:
  config_dir: "./config"
  content_root: "./content"
  output_dir: "./output"
  model_cache_dir: "./data/models"
  tm_data_dir: "./data/tm"
  l3_index_dir: "l3_faiss"  # Relative to tm_data_dir; can override with L3_INDEX_PATH env var
  artifacts_dir: "./data/artifacts"
  logs_dir: "./data/logs"
  backup_dir: "./backups"

# Validation settings (top-level kill switch and config reference)
validation:
  enabled: true  # Global kill switch for validation pipeline
  config_file: "config/validation.yaml"  # Path to detailed validation configuration
  mode: "normal"  # Default validation mode: strict, normal, lenient (can be overridden per site)
  rules:
    - placeholder_integrity
    - yaml_validity
    - structure_preservation
    - link_validity
  strict_mode: false  # Fail translation on validation errors

# Terminology settings (top-level configuration reference)
terminology:
  enabled: true  # Global kill switch for terminology preservation
  config_file: "config/terminology.yaml"  # Path to terminology configuration
  preserve_mode: "BOTH"  # Default preservation mode: PROTECT, VALIDATE, BOTH, NONE (can be overridden per term)

# Security settings
security:
  enable_input_validation: true
  max_file_size_mb: 10
  allowed_extensions:
    - ".md"
    - ".markdown"
  sanitize_output: true

# Feature flags
features:
  enable_parallel_processing: true
  enable_semantic_tm: true
  enable_model_benchmarking: false
  enable_auto_model_selection: true
  enable_quality_scoring: false
  enable_content_hash_tracking: true  # Content-based change detection (recommended for production)

# Content hash tracking (file-level change detection)
content_hash_tracking:
  # Master toggle (redundant with features.enable_content_hash_tracking, but explicit)
  enabled: false

  # Hash algorithm: md5 (fast) or sha256 (secure but slower)
  hash_algorithm: "md5"

  # Metadata file location (relative to output_dir)
  metadata_file: ".translation_metadata.json"

  # Metadata directory (for Docker deployments with dedicated volume)
  # If set, overrides output_dir for metadata storage location
  # Leave empty to store metadata alongside output files
  metadata_dir: ""  # Example: "/data/metadata" for Docker volume

  # Redis distributed locking (multi-worker coordination)
  # Timeout in seconds for acquiring Redis lock on metadata writes
  # Only used when TranslationEngine is initialized with redis_client
  redis_lock_timeout: 30

  # Automatic cleanup of stale metadata (CHH-05)
  auto_cleanup:
    enabled: true  # Enable automatic cleanup
    max_age_days: 30  # Remove entries not seen in 30 days
    cleanup_on_load: true  # Run cleanup when loading metadata
    cleanup_on_save: false  # Run cleanup when saving metadata (more aggressive)

  # Performance: In-memory cache of file hashes (LRU)
  in_memory_cache_size: 1000

  # Behavior: Update metadata even when skipping translation
  update_metadata_on_skip: true

  # Output validation: Detect manual edits to translated files
  validate_output_integrity: false

  # Fallback: Use mtime if metadata corrupted/missing
  fallback_to_mtime: true

  # Performance: Only compute hash if mtime changed (fast-path)
  fast_path_mtime_check: true

# L4 LLM-based adaptation (Optional)
l4_llm:
  enabled: false  # Set to true to enable LLM-based fuzzy match adaptation
  provider: "ollama"  # ollama, openai, anthropic
  model: "llama2"  # Model name
  api_key: null  # API key for cloud providers (optional)
  base_url: "http://localhost:11434"  # Base URL for Ollama
  min_similarity: 0.75  # Only adapt matches above this threshold
  max_similarity: 0.95  # Don't adapt matches above this (already good)
  timeout_seconds: 30
  max_latency_ms: 500  # Maximum acceptable latency for adaptation
  cache_adaptations: true  # Cache LLM adaptations in L2

# Validation defaults
validation_defaults:
  mode: "normal"  # Validation mode: strict, normal, lenient

  # Decision rules for validation pipeline
  decision_rules:
    reject_on_error_count: 3
    max_retry_attempts: 2
    accept_warnings: true

  # Post-write validation configuration
  post_write:
    enabled: true  # Enable post-write file validation
    delete_on_failure: false  # Delete invalid files on validation failure
    halt_on_failure: false  # Stop processing on validation failure

  # Validator enablement and configuration
  validators:
    completeness:
      enabled: true
    language_consistency:
      enabled: true
      confidence_threshold: 0.85
    shortcode_preservation:
      enabled: true
    frontmatter_protection:
      enabled: true
    terminology_preservation:
      enabled: true
    file_placement:
      enabled: true
