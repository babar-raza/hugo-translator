# Global Configuration Defaults for Hugo Translation System

system:
  name: "Hugo Translation System"
  version: "1.0.0"
  environment: "production"  # development, staging, production

# Execution modes for dual-run deployment (Phase 2: Autonomous Workers Unification)
# Supports three deployment modes: windows_cuda, docker_cpu, docker_gpu
execution:
  # Default execution mode (overridden by EXECUTION_MODE env var)
  default_mode: "windows_cuda"

  # Mode-specific configuration overrides
  modes:
    # Windows native with CUDA GPU support
    windows_cuda:
      device: "cuda"  # Require CUDA GPU
      enable_gpu: true
      max_gpu_memory_percent: 50  # Balanced - target batch_size ~8-10 with max_new_tokens=256
      max_gpu_memory_mb: null  # Optional explicit override
      poll_interval: 5.0
      max_retries: 3
      worker_id_prefix: "windows-gpu"
      queue_backend: "memory"  # Use memory backend (redis requires external service)

    # Docker containerized with CPU-only enforcement
    docker_cpu:
      device: "cpu"  # Force CPU-only (enforced by DevicePolicy)
      enable_gpu: false  # Disable GPU support
      max_gpu_memory_mb: 0  # No GPU memory allocation
      poll_interval: 3.0  # Faster polling for CPU workers
      max_retries: 5  # More retries for CPU (slower, more resilient)
      worker_id_prefix: "docker-cpu"
      queue_backend: "memory"  # Use memory backend (redis requires external service)

    # Docker containerized with GPU passthrough (nvidia-docker)
    docker_gpu:
      device: "cuda"  # Use CUDA GPU
      enable_gpu: true
      max_gpu_memory_percent: 60  # Use 60% of VRAM (safe default)
      max_gpu_memory_mb: null  # Optional explicit override (e.g., 6144 for dedicated containers)
      poll_interval: 5.0
      max_retries: 3
      worker_id_prefix: "docker-gpu"
      queue_backend: "memory"  # Use memory backend (redis requires external service)

# Default TM preferences (overridable per site)
tm_defaults:
  use_semantic_tm: true
  semantic_threshold: 0.80
  fallback_exact_only: false
  l1_cache_size: 10000
  l2_max_size_mb: 1536  # 2026-04-17: 696K entries @ 878 MB used; 1536 MiB = 658 MiB headroom. Run scripts/compact_l2_lmdb.py with workers stopped to reclaim 2 GB pre-alloc.
  l3_embedding_model: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
  l3_index_type: "IVFFlat"  # Flat, IVFFlat, HNSW

  # TC-M3-LITE: L3 context gate (default disabled — enable after testing in staging)
  # When enabled, L3 hits whose stored context has cosine similarity < threshold with
  # the current segment context are rejected. Graceful fallback: if either context is
  # empty, the hit is accepted regardless.
  l3_context_gate_enabled: false
  l3_context_similarity_threshold: 0.50

# Default model preferences
model_defaults:
  fallback_model: "m2m100_418m"
  device: "cuda"  # Require CUDA GPU
  batch_size: 4  # Conservative default to prevent CUDA OOM (GPU optimizer will calculate optimal)
  cache_models: true
  max_cached_models: 2
  allow_model_download: false  # Prevent automatic model downloads in production (default: false)

# Asset synchronization for Hugo page bundles (per_language_folders sites only)
# Copies non-markdown assets (images, PDFs) from source to target language folders.
asset_sync:
  enabled: false
  extensions: [".png", ".jpg", ".jpeg", ".svg", ".gif", ".webp", ".pdf", ".zip"]
  skip_if_exists: true

# TC-05: File-level review cache — skip re-validation when source+translation
# content pair was already validated and ACCEPTED in a previous run.
review_cache:
  enabled: false   # TC-M1B safety: disabled until config fingerprint added to cache key (ethereal-sauteeing-brook)
  max_entries: 10000
  max_age_days: 14

# TC-06: Correction pass — when validation rejects a translation, send the
# failed output + validation issues to an LLM for targeted fixes before
# final rejection. Only attempted once per file+lang per run.
correction_pass:
  enabled: false   # TC-C5B safety: disabled until issue-type allowlist added (ethereal-sauteeing-brook)
  model: professionalize_llm
  # NOTE: purity failures bypass correction pass by architecture — they occur after the
  # correction+revalidation cycle completes. Correction only handles validation-suite rejections.

# Translation generation defaults
translation:
  generation:
    speed_mode: true  # true = minimal constraints for throughput

# Hardware/GPU configuration
hardware:
  enable_gpu: true  # Enable GPU acceleration if available
  max_gpu_memory_percent: 60  # Maximum GPU memory as percentage of total VRAM (default: 60% for safety)
  max_gpu_memory_mb: null  # Optional explicit MB limit (overrides percent if set)
  gpu_device_id: -1  # -1 = auto-select best GPU, 0+ = specific device
  allow_cpu_fallback: true  # Fall back to CPU if GPU fails
  clear_cache_after_batch: true  # Clear GPU cache after each batch
  clear_cache_frequency: 10  # Clear cache every N files (used by GPUCacheManager)

  # Aggressive GPU cache management (prevents VRAM fragmentation over long runs)
  aggressive_cache_clearing:
    enabled: true  # Enable aggressive cache management
    clear_every_n_files: 10  # Perform aggressive clear every 10 files
    fragmentation_threshold: 0.50  # Trigger clear at 50% fragmentation
    use_double_clear: true  # Call empty_cache() twice for stubborn fragments
    synchronize_before_clear: true  # Wait for GPU operations to complete

# Queue configuration (Phase 3: Backend Production Switching)
# Supports dynamic backend selection with automatic failover
queue:
  # Primary backend type (redis | memory)
  # Can be overridden by QUEUE_BACKEND environment variable
  backend: "memory"  # Changed from redis to memory for production hardening

  # Fallback backend when primary is unavailable
  fallback_backend: "memory"

  # Redis backend configuration
  redis:
    host: "localhost"
    port: 6379
    db: 0
    password: null  # Set if Redis requires authentication
    max_retries: 3  # Connection retry attempts
    retry_delay: 1.0  # Delay between retries (seconds)
    health_check_interval: 60  # Health check interval (seconds)

  # Memory backend configuration
  memory:
    max_queue_size: 1000  # Maximum items in queue (0 = unlimited)

# Orchestrator defaults
orchestrator:
  mode: "auto"  # auto, manual
  max_workers: 4
  job_queue_backend: "memory"  # DEPRECATED: Use queue.backend instead
  sweep_interval_hours: 24
  file_watcher_debounce_seconds: 2.0
  enable_file_watcher: true
  enable_sweep_scheduler: true

# Performance settings
performance:
  parallel_translation: true
  max_parallel_files: 8
  model_cache_size: 2
  enable_batch_optimization: true

# Observability defaults
observability:
  # Logging configuration
  logging:
    enabled: true  # Enable structured logging
    log_level: "DEBUG"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
    console_output: true  # Enable colored console output
    file_output: true  # Enable NDJSON file output
    log_file: "./data/logs/hugo-translator.ndjson"  # Path to log file
    max_file_size_mb: 100  # Max size before rotation (MB)
    backup_count: 10  # Number of rotated files to keep

    # Component-specific logging levels (optional overrides)
    components:
      orchestrator: "INFO"  # Job queue, scheduling
      translation_engine: "INFO"  # Segment extraction, translation
      tm: "DEBUG"  # TM lookups, writes, cache stats
      model_runtime: "INFO"  # Model loading, inference
      validation: "INFO"  # Validation checks
      worker: "INFO"  # Worker operations

    # Enable correlation IDs for cross-component tracing
    enable_correlation_ids: true

  # Flow artifacts for debugging
  flow_artifact_detail: "summary"  # none, summary, sampled, full
  flow_artifact_sample_rate: 0.05  # 5% when sampled

  # Metrics collection
  metrics_enabled: true
  metrics_port: 9090
  metrics_pushgateway: ""  # URL of Prometheus Pushgateway (optional)

# Telemetry settings
telemetry:
  validation_metrics: true  # Track validation metrics (decisions, retries, rejection rates)
  # T3-D: Local validation metrics log — append one JSONL record per file decision to
  # data/logs/validation_metrics.jsonl. Fields: ts, file, lang, decision, retry_count,
  # error_count, warning_count, validator_results.
  local_validation_log: true

# Git commit automation
git_commit:
  enabled: true  # Enable automatic git commits after successful translation
  auto_push: true  # USER PREFERENCE: Fully automated workflow (push to remote)
  commit_template: "chore: translate {file_count} files to {languages}"
  co_author_name: "Hugo Translator"
  co_author_email: "noreply@aspose.com"
  timeout_seconds: 60  # Maximum time for git operations
  block_signals: true  # Block SIGINT/SIGTERM during commit to prevent partial commits
  files_per_commit: 25  # Commit every N files for incremental batching (0 = commit all at end)

# Output Layout (defaults for all sites)
default_output_layout:
  per_language_folders: true
  pattern: "{lang}/{path}"

# Paths (can be overridden by environment variables)
paths:
  config_dir: "./config"
  content_root: "./content"
  output_dir: "./output"
  model_cache_dir: "./data/models"
  tm_data_dir: "./data/tm"
  l3_index_dir: "l3_faiss"  # Relative to tm_data_dir; can override with L3_INDEX_PATH env var
  artifacts_dir: "./data/artifacts"
  logs_dir: "./data/logs"
  backup_dir: "./backups"

# Validation settings (top-level kill switch and config reference)
validation:
  enabled: true  # Global kill switch for validation pipeline
  config_file: "config/validation.yaml"  # Path to detailed validation configuration
  mode: "normal"  # Default validation mode: strict, normal, lenient (can be overridden per site)
  rules:
    - placeholder_integrity
    - yaml_validity
    - structure_preservation
    - link_validity
  strict_mode: false  # Fail translation on validation errors

# Terminology settings (top-level configuration reference)
terminology:
  enabled: true  # Global kill switch for terminology preservation
  config_file: "config/terminology.yaml"  # Path to terminology configuration
  preserve_mode: "BOTH"  # Default preservation mode: PROTECT, VALIDATE, BOTH, NONE (can be overridden per term)

# Security settings
security:
  enable_input_validation: true
  max_file_size_mb: 10
  allowed_extensions:
    - ".md"
    - ".markdown"
  sanitize_output: true

# Feature flags
features:
  enable_parallel_processing: true
  enable_semantic_tm: true
  enable_model_benchmarking: false
  enable_auto_model_selection: true
  enable_quality_scoring: false
  enable_content_hash_tracking: true  # Content-based change detection (recommended for production)

  # WS-COMP-6: Quality-aware completion filter.
  # When enabled, files that the mtime-based filter would skip ("all outputs current") are
  # additionally checked via fasttext language sampling to detect wrong-language outputs.
  # Results are cached per-file for quality_aware_filter_ttl_days days to keep overhead low.
  # Default: off. Enable in off-peak windows; monitor with scan_wrong_language_outputs.py.
  enable_quality_aware_completion_filter: false  # TC-C2B safety: disabled until smoke proof written (ethereal-sauteeing-brook)
  quality_aware_filter_ttl_days: 7      # Re-validate each "complete" file every N days
  quality_aware_filter_confidence: 0.80  # fasttext confidence threshold for flagging
  quality_aware_filter_paragraphs: 2     # Max body paragraphs to sample per output file

# Language Detection Configuration
# FastText-based detection with adaptive similarity learning
language_detection:
  provider: "fasttext"  # fasttext, langdetect (fallback)

  fasttext:
    model_url: "https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.bin"
    model_cache_dir: "./data/models/fasttext"
    model_filename: "lid.176.bin"
    min_confidence: 0.70  # Minimum confidence threshold for detection

    # Download behavior
    auto_download: true
    download_timeout_seconds: 300
    download_retries: 3

    # Fallback if FastText fails
    fallback_to_langdetect: true

  # Script-based validation (tertiary fallback)
  script_validation:
    enabled: true
    thresholds:
      latin: 0.90      # Romance languages (90% Latin characters required)
      cyrillic: 0.90   # Slavic languages (90% Cyrillic required)
      arabic: 0.85     # Arabic script (85% required)
      devanagari: 0.85 # Indic languages (85% required)
      cjk: 0.80        # Chinese/Japanese/Korean (80% required)

  # Adaptive similarity learning
  adaptive_similarity:
    enabled: true
    stats_file: ".translation_progress/language_similarities.json"
    failure_rate_threshold: 0.30  # Add pair when failure_rate > 30%
    min_samples: 50  # Require at least 50 samples before adapting
    rolling_window_size: 50  # Track last 50 samples per pair

    # Conservative baseline similarity groups
    baseline_groups:
      romance: ["ca", "es", "pt", "fr", "it", "ro", "gl"]
      cyrillic: ["bg", "ru", "mk", "uk", "sr", "be"]
      arabic: ["ar", "fa", "ur", "ps"]
      devanagari: ["hi", "mr", "ne", "sa"]
      nordic: ["da", "no", "sv", "is"]
      chinese: ["zh-CN", "zh-TW", "zh-HK"]
      south_slavic: ["hr", "sr", "bs", "sl", "sh"]   # Croatian/Serbian/Bosnian/Slovenian/Serbo-Croatian
      malay_indonesian: ["ms", "id"]                   # Malay/Indonesian (mutually intelligible)
      west_slavic: ["cs", "sk"]                        # Czech/Slovak

    log_adaptations: true  # Log when new pairs are learned
    log_level: "INFO"

# Adaptive Batch Translation (Reactive System)
# Automatically adjusts batch size based on language-specific failure rates
# Persists learning across translation sessions to reduce fallback rates
adaptive_batching:
  enabled: true  # Master toggle for adaptive batch sizing

  # Fallback detection threshold (EMA-based)
  fallback_rate_threshold: 0.05  # 5% - trigger adaptation if EMA exceeds this

  # Adaptation parameters
  reduction_factor: 0.80  # Reduce batch size by 20% when fallback rate high
  increase_factor: 1.10   # Increase batch size by 10% after sustained success
  min_batches_before_increase: 5  # Require 5 consecutive successes before increasing

  # Per-language overrides (languages with known translation challenges)
  language_overrides:
    # Cyrillic languages (script confusion between bg, ru, mk, uk, sr)
    bg:  # Bulgarian
      initial_batch_size: 8
      min_batch_size: 4
      max_batch_size: 20
      fallback_rate_threshold: 0.30  # More tolerant threshold for Bulgarian
    ru:  # Russian
      initial_batch_size: 8
      min_batch_size: 4
      max_batch_size: 25
    mk:  # Macedonian
      initial_batch_size: 8
      min_batch_size: 4
      max_batch_size: 20
    uk:  # Ukrainian
      initial_batch_size: 8
      min_batch_size: 4
      max_batch_size: 25
    sr:  # Serbian
      initial_batch_size: 8
      min_batch_size: 4
      max_batch_size: 25
    be:  # Belarusian
      initial_batch_size: 8
      min_batch_size: 4
      max_batch_size: 20

    # Arabic script languages (script confusion between ar, fa, ur)
    ar:  # Arabic
      initial_batch_size: 10
      min_batch_size: 4
      max_batch_size: 20
    fa:  # Persian/Farsi
      initial_batch_size: 10
      min_batch_size: 4
      max_batch_size: 20
    ur:  # Urdu
      initial_batch_size: 10
      min_batch_size: 4
      max_batch_size: 20

    # South Slavic / Malay-Indonesian / West Slavic (high false-positive rate from FastText)
    hr:  # Croatian (confused with Serbian/Bosnian/Serbo-Croatian)
      initial_batch_size: 8
      min_batch_size: 4
      max_batch_size: 20
      fallback_rate_threshold: 0.30
    ms:  # Malay (confused with Indonesian)
      initial_batch_size: 8
      min_batch_size: 4
      max_batch_size: 20
      fallback_rate_threshold: 0.30
    id:  # Indonesian (confused with Malay)
      initial_batch_size: 8
      min_batch_size: 4
      max_batch_size: 20
      fallback_rate_threshold: 0.30
    cs:  # Czech (confused with Slovak)
      initial_batch_size: 8
      min_batch_size: 4
      max_batch_size: 20
      fallback_rate_threshold: 0.30
    sk:  # Slovak (confused with Czech)
      initial_batch_size: 8
      min_batch_size: 4
      max_batch_size: 20
      fallback_rate_threshold: 0.30

  # Persistence
  stats_file: ".translation_progress/batch_stats.json"
  stats_retention_days: 30  # Auto-cleanup entries older than 30 days
  rolling_window_size: 50   # Track statistics for last 50 batches per language

  # Logging
  log_adaptations: true  # Log batch size changes to help with debugging
  log_level: "INFO"      # DEBUG for detailed adaptation logs

# Autonomous Recovery (OOM Retry Handler)
# Automatically retries file translation with reduced batch size on CUDA OOM errors
# Enables autonomous multi-language translation with continue-on-failure
autonomous_recovery:
  # File-level OOM retry
  oom_retry:
    enabled: true  # Enable OOM retry handler
    max_retries: 3  # Maximum retry attempts per file
    batch_reduction_factor: 0.5  # Reduce batch size by 50% on each retry
    min_batch_size: 1  # Minimum batch size (final fallback)

  # Continue processing on language failure
  continue_on_failure:
    enabled: true  # Continue to next language if one fails
    save_failure_reports: true  # Save detailed failure reports
    failure_reports_dir: "./data/failures"  # Directory for failure reports
    max_language_timeout_seconds: 3600  # 1 hour timeout per language

  # Per-language incremental commits
  incremental_commits:
    enabled: true  # Create commit after each language completes
    commit_after_each_language: true  # Commit immediately after success
    push_after_each_language: false  # Require manual push for safety

  # Resumption support
  resumption:
    enabled: true  # Allow resuming from failures
    allow_resume_from_failures: true  # Resume from failure reports

# Content hash tracking (file-level change detection)
content_hash_tracking:
  # Activation controlled by features.enable_content_hash_tracking
  # Settings below configure behavior when enabled

  # Hash algorithm: md5 (fast) or sha256 (secure but slower)
  hash_algorithm: "md5"

  # Metadata file location (relative to output_dir)
  metadata_file: ".translation_metadata.json"

  # Metadata directory (for Docker deployments with dedicated volume)
  # If set, overrides output_dir for metadata storage location
  # Leave empty to store metadata alongside output files
  metadata_dir: ""  # Example: "/data/metadata" for Docker volume

  # Redis distributed locking (multi-worker coordination)
  # Timeout in seconds for acquiring Redis lock on metadata writes
  # Only used when TranslationEngine is initialized with redis_client
  redis_lock_timeout: 30

  # Automatic cleanup of stale metadata (CHH-05)
  auto_cleanup:
    enabled: true  # Enable automatic cleanup
    max_age_days: 30  # Remove entries not seen in 30 days
    cleanup_on_load: true  # Run cleanup when loading metadata
    cleanup_on_save: false  # Run cleanup when saving metadata (more aggressive)

  # Performance: In-memory cache of file hashes (LRU)
  in_memory_cache_size: 1000

  # Behavior: Update metadata even when skipping translation
  update_metadata_on_skip: true

  # Output validation: Detect manual edits to translated files
  validate_output_integrity: false

  # Fallback: Use mtime if metadata corrupted/missing
  fallback_to_mtime: true

  # Performance: Only compute hash if mtime changed (fast-path)
  fast_path_mtime_check: true

# L4 LLM-based adaptation (Optional)
l4_llm:
  enabled: false  # Set to true to enable LLM-based fuzzy match adaptation
  provider: "ollama"  # ollama, openai, anthropic
  model: "llama2"  # Model name
  api_key: null  # API key for cloud providers (optional)
  base_url: "http://localhost:11434"  # Base URL for Ollama
  min_similarity: 0.75  # Only adapt matches above this threshold
  max_similarity: 0.95  # Don't adapt matches above this (already good)
  timeout_seconds: 30
  max_latency_ms: 500  # Maximum acceptable latency for adaptation
  cache_adaptations: true  # Cache LLM adaptations in L2

# Autonomous Content Translation Worker Configuration
# Scheduled translation of Hugo content directories
autonomous_content_translation:
  # Master toggle for content translation worker
  enabled: true

  # Scheduling configuration (4+ runs/day with CUDA support)
  schedule:
    runs_per_day: 4  # Number of translation runs per day (minimum 4 as requested)
    window_start: "08:00"  # Start of daily window (America/Los_Angeles)
    window_end: "23:00"  # End of daily window (America/Los_Angeles)
    timezone: "America/Los_Angeles"
    jitter_minutes: 15  # Random jitter to avoid exact timing patterns

  # Execution configuration
  execution:
    device: "cuda"  # Force CUDA usage for translation
    max_gpu_memory_percent: 50  # Maximum GPU memory usage (50% budget for safety)
    max_sites_per_run: null  # Process all sites (null = no limit)
    # Per-site run time limit overrides (override global --max-seconds-per-run for specific sites).
    # Useful for sites with very large or very small files.
    per_site_limits: {}

  # Git commit configuration (uses global git_commit settings)
  # Auto-commits are enabled via git_commit.enabled and git_commit.auto_push

# TM Improvement Worker Configuration
# Autonomous worker that uses LLM to improve TM entries during off-peak hours
tm_improvement:
  # Master toggle for TM improvement worker
  enabled: true

  # T3-A: Consistency check — scan L2 after each improvement run for source phrases
  # that have been translated differently across sites. Divergences are logged to
  # data/logs/consistency_divergences.jsonl for operator review. Non-blocking.
  consistency_check_enabled: true

  # Scheduling configuration (4+ runs/day with CUDA support)
  schedule:
    runs_per_day: 12  # Number of improvement runs per day
    window_start: "07:00"  # Start of daily window (Asia/Karachi)
    window_end: "23:00"  # End of daily window (Asia/Karachi)
    timezone: "Asia/Karachi"
    jitter_minutes: 15  # Random jitter to avoid exact timing patterns

  # Improvement batch configuration
  batch:
    candidates_per_run: 500  # Max candidates to process per run
    max_llm_calls_per_run: 1000  # Max LLM calls per run (safety limit)
    max_seconds_per_run: 3600  # Max runtime per run (60 minutes)

  # LLM configuration for improvements
  llm:
    provider: "openai_compatible"
    model: "recommended"
    base_url: "https://llm.professionalize.com/v1"
    api_key: null
    api_key_env: "litellm_key"
    timeout_seconds: 300
    temperature: 0.0
    fallback_provider: null  # Optional fallback provider if primary fails

  # Improvement queue configuration
  queue:
    enabled: true  # Enable queue-based candidate tracking
    path: "data/tm/improvement_queue.jsonl"  # Path to queue file
    append_on_store: true  # Append candidates when storing new TM entries
    quality_threshold: 0.80  # Only queue entries below this similarity score

  # VRAM management (for Ollama using GPU)
  resources:
    device: "cuda"  # Force CUDA usage for workers
    max_gpu_memory_percent: 50  # Maximum GPU memory usage (50% budget for safety)
    preflight_check: true  # Check GPU usage before starting run
    abort_on_high_usage: true  # Abort run if GPU already >=50% at start

# Validation defaults
validation_defaults:
  mode: "normal"  # Validation mode: strict, normal, lenient

  # Decision rules for validation pipeline
  decision_rules:
    reject_on_error_count: 3
    max_retry_attempts: 2
    accept_warnings: true

  # Post-write validation configuration
  post_write:
    enabled: true  # Enable post-write file validation
    delete_on_failure: false  # Never enable — use scan_language_contamination.py --repair --confirm for cleanup
    halt_on_failure: false  # Stop processing on validation failure

  # Validator enablement and configuration
  validators:
    completeness:
      enabled: true
    language_consistency:
      enabled: true
      confidence_threshold: 0.85
    shortcode_preservation:
      enabled: true
    frontmatter_protection:
      enabled: true
    terminology_preservation:
      enabled: true
    file_placement:
      enabled: true

# Translation Engine Quality Gates
# Mandatory validation settings to prevent corrupted/wrong-language translations in production
# WARNING: Disabling these settings in production will result in quality degradation
translation_engine:
  # Quality gates (mandatory for production)
  enable_validation: true  # NEVER set to false in production - enables all quality checks

  require_language_detector: true  # Fail translation if language detector unavailable (prevents blind translation)

  max_batch_purity_failure_rate: 0.10  # Block write if >10% of batches fail language purity checks

  # Languages where batch-level purity checks are skipped (document-level check still enforced).
  # Arabic frequently embeds English technical terms — batch purity splitting wastes API calls.
  # TC-13 2026-04-20: Removed non-Latin-script languages that have low FP rates for
  # English product names (their scripts are visually distinct from Latin, so FastText
  # reliably distinguishes them). Re-enabled: bg, da, fi, hi, hr, lv, no, sr, sv, th, vi.
  # Kept skipped: Latin-script and ambiguous-script languages where English product names
  # cause ~27-30% FastText false positives (would trigger exit_code=1 failures).
  # PREREQUISITE: verify no exit_code=1 failures for re-enabled langs in staging first.
  #
  # TC-H3 DEFERRAL RECORD (2026-05-01):
  # Narrowing this skip list (e.g. removing es/it/cs) is DEFERRED until:
  #   fp_rate_for_lang = (
  #       segments_flagged_wrong_lang_in_correct_translation
  #       / total_segments_translated_for_lang
  #   )
  # Source: data/logs/validation_metrics.jsonl (requires log enhancement to record per-segment
  # lang-detection results — this field does NOT currently exist in the log).
  # Gate: fp_rate(es) < 5% AND fp_rate(it) < 5% AND fp_rate(cs) < 5% over >= 500 segments each.
  # Script: scripts/measure_batch_purity_fp.py (must be created before this gate can be evaluated).
  # COMPENSATING CONTROL: validation.yaml per_language_overrides enforce es=98%/it=98%/cs=97%
  # file-level purity via LanguageConsistencyValidator. Tests: test_batch_purity_skip_compensation.py.
  # MANDATORY REVIEW: 2026-07-01. If measurement script does not exist by then, deferral expires.
  batch_purity_skip_langs: [ar, ca, cs, de, el, es, fa, fr, ga, he, hu, id, it, ja, ko, lt, lv, ms, nl, pl, pt, ro, ru, sk, sr, tr, uk, zh]

  min_file_purity_percentage: 0.95  # Require 95% of segments match target language (5% tolerance for mixed content)

  allow_quality_downgrades: false  # Never overwrite existing good translations with lower quality output

  # Thresholds for language detection and quality assessment
  language_detection_confidence_threshold: 0.80  # Minimum confidence to flag wrong-language segments (raised from 0.70 — technical docs with product names score ~74% English even when correctly translated)

  existing_file_confidence_delta: 0.05  # Quality improvement required to overwrite existing file (5% minimum gain)

  # Per-language purity threshold overrides (default: 0.06 = 6%)
  # Only add languages with observed FP rate >= 15% in production logs.
  purity_threshold_overrides:
    lt: 0.15  # Lithuanian: reduced from 0.30 — 30% allowed catastrophic contamination through; 15% still generous for English product name FPs
    bg: 0.15  # Bulgarian: reduced 0.50→0.15 (TC-C1 2026-05-01) — barcode ASCII strip now excludes "Codabar: 0-9,A-D" from FastText; 0.15 matches lt tolerance for remaining English product names

  # TC-03 (plan: validated-mixing-biscuit): Language purity circuit breaker.
  # Aborts the language run when run-level purity failure rate exceeds threshold after min_batches.
  # Threshold 50% catches both lv (83.1%) and sr (67.7%) without false-firing for normal langs.
  # Run-level: counts accumulate across files (class-level in TextUnitExtractor per subprocess).
  # To disable without code change: set enabled: false here.
  # NOTE: TextUnitExtractor reads _circuit_breaker_enabled class var, not this config section,
  # in the current implementation. This section documents the intent and values used.
  circuit_breaker:
    enabled: true
    min_batches: 50
    purity_threshold: 0.50  # Review after lv/sr routing fixed (Step 6)

  # WS-COMP-7: Per-language model routing overrides.
  # Routes specific target languages to a different model instead of the global fallback.
  # Only add languages with confirmed systematic failures (>30% coverage gap after 1+ weeks of data
  # from WS-COMP-1: python scripts/analysis/measure_completeness.py).
  # Commented out by default — enable after baseline shows consistent language-specific failures.
  # TC-06 (plan: validated-mixing-biscuit): lv/sr enabled after LLM quality verification.
  # lv: 3/3 FastText PASS (0.87-1.00 confidence). sr: LLM produces Latin Serbian (hr-detected),
  # accepted via SCRIPT_SIMILAR_LANGUAGES sr→{hr,bs} (Serbian Latin ≈ Croatian at text level).
  language_routing_overrides:
    lv: "professionalize_llm"   # Latvian: M2M100 produces Hungarian (83.1% purity failures). LLM verified 3/3 lv-detected.
    sr: "professionalize_llm"   # Serbian: M2M100 produces mixed-language (67.7% failures). LLM produces Latin Serbian (hr-detected → accepted via script_similar_languages).
  #   fa: "professionalize_llm"   # Persian: RTL + systematic M2M100 failures (not yet verified)
  #   he: "professionalize_llm"   # Hebrew: RTL + systematic M2M100 failures (not yet verified)

  # LLM escalation for CASE 4 stuck files (both translations wrong, max MT retries exceeded).
  # When enabled, files in the retranslate queue with retry_count >= llm_escalation_after_retries
  # are translated using the LLM backend instead of M2M100, breaking the MT failure loop.
  # TC-MLD-05: Enabled — retranslate queue has 87 entries (4 at retry>=2 immediately eligible).
  # With TC-FIX-01 removing lenient-mode accept_after_max_retries, more files will enter the
  # queue. LLM escalation is the recovery path for stuck CASE 4 files.
  llm_escalation_enabled: true
  llm_escalation_after_retries: 2  # Escalate after this many MT failures (see retranslate_queue.py)
  llm_escalation_model: "professionalize_llm"  # Model ID to use for escalated files

  # TC-14: Post-run contamination scan — runs scan_language_contamination.py after each
  # translation run and queues contaminated files for retranslation. Set to false to disable.
  auto_scan_contamination: true

  # TC-CW-02: Per-file timeout in parallel translation (seconds).
  # Prevents a single stalled file (e.g. 36-lang run) from blocking the entire batch.
  # When a future exceeds this budget it is cancelled and counted as a failed file;
  # remaining files continue. Hard total-run timeout (run_deadline) remains as backstop.
  per_file_timeout_s: 600  # float > 0; 10 min per file

  # TC-AST-01: AST fallback node tolerance (0.0–1.0).
  # 0.0 = reject any file where even 1 node lacked a translation unit (zero tolerance).
  # PRODUCTION NOTE: Set to 0.5 because _missing_node_count includes false-positive
  # STRONG sub-nodes of full-sentence PARAGRAPH units (parent in unit_map, child counted
  # as gap because _has_descendant_in_unit_map only walks descendants not ancestors).
  # TC-AST-03 (2026-04-18): ancestor-aware missing-node counting implemented in
  # _apply_to_node(). STRONG/EMPHASIS nodes inside a Path A full-sentence PARAGRAPH
  # are no longer counted as gaps. False-positive rate drops from 39.3% → 0%.
  # Tolerance reset to 0.0 (intended strict production setting).
  ast_fallback_node_tolerance: 0.0  # float in [0.0, 1.0]

  # TC-SAS-01: Same-as-source detection — reject files where MT model returned source text
  # unchanged for translatable units (source-language leakage without structural mismatch).
  # Ratio = (same-as-source units) / (total translatable units). 0.0 = zero tolerance.
  # Raised from 0.0 to 0.03: technical KB content has API names/identifiers that M2M100
  # legitimately leaves unchanged (up to ~3 units per 100). Zero tolerance caused false
  # rejections for no/hr/cs and other languages on technical articles.
  same_as_source_tolerance: 0.03
  # Minimum source character length to count a unit toward TC-SAS-01 (avoids flagging
  # short symbols/punctuation/codes that are legitimately identical across languages).
  same_as_source_min_length: 10

  # T2-D: Terminology protection for M2M100 MT backend.
  # When true, TerminologyManager.protect()/restore() wraps each segment before/after
  # M2M100 translation to preserve Aspose product names, file format identifiers, etc.
  # Disabled by default — M2M100 may drop OOV placeholder tokens. Enable after
  # smoke-testing translate() output with --validation-mode strict on a small batch.
  mt_terminology_protection: true

  # TC-AST-02: LLM hallucination cap. Segments whose output exceeds this multiple
  # of their input length are truncated. Production observed: 11.4× (Hindi barcode).
  max_llm_output_to_input_ratio: 4.0  # float > 0

  # TC-H2: Per-language LLM output ratio overrides.
  # Use when a language's natural expansion rate exceeds the global cap.
  # Evidence required before adding: production logs showing legitimate expansion.
  llm_output_ratio_overrides:
    hi: 3.0   # Hindi: natural expansion ~2-2.5×; 11× observed was hallucination
    pl: 5.0   # Polish: morphological expansion ~1.5-2×; 4× too tight for complex sentences
    cs: 5.0   # Czech: similar morphological pattern to Polish

  # TC-AST-02: Purity backpressure threshold.
  # After this many consecutive language-purity failures for the same language,
  # the adaptive batch tracker reduces current_batch_size by 1 (minimum 1).
  purity_failure_backpressure_threshold: 3  # integer >= 1

  # File selection priority strategy for _translate_directory_locked().
  # Controls sort order of incomplete files AFTER the completion filter.
  # Options:
  #   "missing_first" (default): Files with ANY missing output come before stale files.
  #                               Ensures never-translated files are reached before
  #                               re-translating already-translated-but-stale files.
  #   "alphabetical": Legacy behaviour — pure alphabetical order within each batch.
  file_priority_strategy: "missing_first"

# TC-15/TC-16: Per-run quality metrics.
# Writes a JSON summary to data/metrics/ after each worker run so quality trends
# can be tracked over time.  Requires MetricsCollector to be wired into the worker.
metrics:
  enabled: true
  output_dir: "data/metrics"
  write_per_run_summary: true     # data/metrics/run_<timestamp>.json
  write_per_language_summary: true
  format: "json"

# Agent Metrics API — posts per-run metrics to Google Sheets endpoint.
# Endpoint URL and auth token come from environment variables only (never in config).
# dry_run=true by default: payloads are logged but NOT posted.
agent_metrics:
  enabled: false                    # Master switch; default off — enable explicitly per run
  dry_run: true                     # Log payload but don't POST; default on
  endpoint_env: "AGENT_METRICS_ENDPOINT"
  token_env: "AGENT_METRICS_TOKEN"
  post_timeout_seconds: 15
  evidence_dir: "data/metrics/agent_evidence"
  ledger_file: "data/metrics/agent_evidence/metrics_ledger.jsonl"

  test_job_type: "Test"
  max_test_rows_per_sprint: 3

  # Profiles with these prefixes are excluded from metrics posting
  excluded_site_id_prefixes:
    - "blog-test"
    - "products-test"
    - "golden-test"
    - "e2e-reference"
    - "stage-b-canary"
    - "ws5-test"
    - "nested-list-test"
    - "realworld"
    - "example"
    - "tm_improvement"  # TC-ENABLE-02: suppress TM posting until TC-METRICS-15 fixes scope

  # Website: source domain passes through as-is (no cross-TLD normalization)
  metrics_website_mapping: {}

  # Platform mapping: source domain -> platform (for domains where platform is NOT in path hierarchy)
  # aspose.org platforms ARE in path hierarchy (e.g. /net/, /python/) — path-scan handles those
  # aspose.net content is always .NET and has no platform segment in paths
  metrics_domain_platform_mapping:
    "aspose.net": "net"

  # Section normalization: subsystem/display_name -> section label
  metrics_section_mapping:
    "docs": "Docs"
    "kb": "KB"
    "blog": "Blog"
    "products": "Product Pages"
    "reference": "API Reference"
    "websites": "Product Pages"
    "www": "Product Pages"
    "about": "About"
    "Documentation": "Docs"
    "Landing Pages": "Product Pages"
    "blog posts": "Blog"
    "knowledge base articles": "KB"
    "API References": "API Reference"
    "files": "Product Pages"

  # Brand mapping: source domain -> brand name (covers .com, .net, .org variants)
  metrics_brand_mapping:
    "aspose.com": "Aspose"
    "aspose.net": "Aspose"
    "aspose.org": "Aspose"
    "groupdocs.com": "GroupDocs"
    "groupdocs.net": "GroupDocs"
    "groupdocs.org": "GroupDocs"
    "conholdate.com": "Conholdate"
    "conholdate.net": "Conholdate"
    "conholdate.org": "Conholdate"

  # Known product families and platforms (for validation)
  known_product_families:
    - words
    - cells
    - pdf
    - slides
    - email
    - barcode
    - diagram
    - tasks
    - ocr
    - note
    - cad
    - 3d
    - html
    - zip
    - tex
    - svg
    - finance
    - drawing
    - font
    - page
    - psd
    - imaging
    - omr
    - pub
    - gis
    - total

  known_platforms:
    - net
    - java
    - python
    - cpp
    - nodejs
    - php
    - android
    - go
    - jasperreports
    - reportingservices
    - sharepoint

# --- Agentic Architecture Modules ---
# These modules provide autonomous runtime capabilities (signal emission,
# state tracking, supervision, classification). All disabled by default.
# Enable per-module after verifying integration tests pass.

run_signal_emitter:
  enabled: false
  # Set to true to emit run-signal JSON after each translation run

continuation_state:
  enabled: true
  # Set to true to track cross-session run state

supervisor_loop:
  enabled: true

task_queue:
  enabled: true

blocker_classifier:
  enabled: false
  dry_run: true

contradiction_detector:
  enabled: false
  dry_run: true

run_summarizer:
  enabled: false
  dry_run: true

model_selector:
  enabled: false
  min_history_runs: 5
  default_model: m2m100

# TC-SYS-02: Worker log rotation.
# Workers use RotatingFileHandler with these limits so log files never grow unbounded.
logging:
  max_log_size_mb: 50     # Each log file rotates at this size (MB)
  max_log_backups: 3      # Number of rotated backups kept (.log.1, .log.2, .log.3)

# TC-REEXEC-06: Scheduler safety — campaign mode must not be restored until all
# scheduler safety gates (TC-SCHED-01..06) pass. Setting campaign_mode_enabled=true
# without passing those gates will allow daemon mode to run unsafely.
scheduler:
  campaign_mode_enabled: false  # Set true ONLY after TC-SCHED-01..06 pass all gates
  max_queue_files_per_run: 2000 # TC-SCHED-06: cap per-run queue processing

# Local model discovery configuration
# Discovers models from HF cache, Ollama, custom directories, and multiple drives.
# Read-only scanning -- never copies, moves, or modifies model files.
local_discovery:
  enabled: true
  registry_output: "config/model_registry.discovered.yaml"
  report_dir: "data/discovery"
  auto_discover_on_startup: false
  discovery_cache_ttl_hours: 24
  follow_symlinks: false
  enable_full_drive_scan: false
  max_depth_default: 4
  enabled_formats:
    - transformers
    - ctranslate2
    - gguf
    - ollama
    - sentencepiece
  scan_roots:
    - path: "~/.cache/huggingface/hub"
      label: "hf_cache"
      enabled: true
      max_depth: 4
    - path: "~/.ollama/models"
      label: "ollama"
      enabled: true
      max_depth: 4
    # Uncomment to add custom model directories:
    # - path: "D:/models"
    #   label: "custom_d_drive"
    #   enabled: true
    #   max_depth: 4
  drive_scan:
    enabled: false
    drives: []    # e.g., ["D:", "E:"]
    max_depth: 4
  skip_patterns:
    - "$RECYCLE.BIN"
    - "System Volume Information"
    - "Windows"
    - "Program Files"
    - "Program Files (x86)"
    - ".git"
    - "node_modules"
    - "__pycache__"
    - ".venv"
    - "venv"

# Run History — cross-run outcome tracking for regression detection and adaptive learning.
run_history:
  enabled: true
  db_path: "data/metrics/run_history.db"
  regression_threshold: 0.15
  regression_window: 5

# Adaptive Thresholds — adjusts validation thresholds based on run history.
# OFF by default. Opt-in after confidence in run history data quality.
adaptive_thresholds:
  enabled: false
  min_history_runs: 5
  max_delta: 1

# Post-Sprint Autonomy Loop — Sprint governance loop controller and quality scorer.
# Disabled by default. Enable only for active sprint governance sessions.
# Rubric: config/sprint_quality_rubric.yaml
# Scripts: scripts/ops/sprint_loop_controller.py, scripts/ops/sprint_quality_scorer.py
# Prompts: docs/governance/prompts/
sprint_loop:
  enabled: false
  dry_run: true
  run_dir: "data/sprint-loop"
  quality:
    overall_minimum: 4.0
    dimension_minimum: 3.0
  evidence:
    root: ".local/evidences"
    require_bundle: true
