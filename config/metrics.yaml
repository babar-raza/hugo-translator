# Metrics Configuration
#
# Controls timing metrics collection, storage limits, and statistics calculation
# across the translation system.

metrics:
  # Bounded storage limits for timing metrics
  # Higher limits provide better statistical accuracy but use more memory
  storage:
    translation_engine:
      # Number of retry metrics to keep in memory (SR-12)
      retry_metrics_maxlen: 1000

    l3_semantic:
      # Number of timing samples to keep for L3 semantic operations (TM-07)
      # Higher value recommended due to high operation frequency
      timing_metrics_maxlen: 10000

    batch_optimizer:
      # Number of timing samples for batch processing operations (OPT-05)
      timing_metrics_maxlen: 5000

  # Statistics configuration
  statistics:
    # Percentiles to calculate (0.0-1.0 range)
    # Common values: [0.50, 0.95, 0.99] for p50/p95/p99
    percentiles: [0.50, 0.95, 0.99]

    # Minimum number of samples required before calculating high percentiles
    # p95 requires at least this many samples to be meaningful
    min_samples_for_p95: 20

    # Minimum number of samples required for p99
    min_samples_for_p99: 100

  # Performance thresholds (milliseconds)
  # Used for alerting and performance monitoring
  thresholds:
    # L3 semantic search operations
    l3_search_timeout_ms: 100
    l3_search_warning_ms: 50

    # Retry operations
    retry_max_duration_ms: 30000
    retry_warning_duration_ms: 10000

    # Batch processing
    batch_prepare_warning_ms: 1000
    batch_process_warning_ms: 5000

    # OOM recovery
    oom_recovery_max_ms: 5000

# Environment variable overrides (optional)
# Set these to override config values at runtime:
#
# METRICS_ENGINE_MAXLEN - Override retry_metrics_maxlen
# METRICS_L3_MAXLEN - Override l3 timing_metrics_maxlen
# METRICS_BATCH_MAXLEN - Override batch timing_metrics_maxlen
# METRICS_PERCENTILES - Override percentiles (comma-separated, e.g., "0.5,0.95,0.99")
