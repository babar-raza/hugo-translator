# Review rubric (TC-APT-059, runbook v10.3 §4.2): every review verdict cites
# rule IDs from this file. A judgment call not covered here requires adding a
# rule (a commit) before the verdict stands. Seeded 2026-09-05 with the rule
# needed by the first post-v10.3 verdict; TC-APT-059 extends it from the full
# heal-queue corpus.
version: 1
rules:
  - id: RB-001
    name: untranslated-section-heading
    verdict: REJECT
    scope: body_heading
    statement: >-
      A section heading left byte-identical to its English source in a
      non-English output is a defect UNLESS the identical form is a
      reviewed cognate for that locale (_REVIEWED_IDENTICAL_TRANSLATIONS,
      e.g. fr "Annotations"/"Introduction") or a protected brand/API term
      (config/terminology.yaml, e.g. "API Reference"). Deterministic
      recurrence across every language of a page indicates a
      do_not_translate false positive (producer bug), not model variance:
      fix the producer (i18n registry kind-scoped override is the
      established mechanism, TC-APT-049) and retrigger; never hand-edit
      the output.
    evidence: TC-APT-053-gate5-pdf-foss-cpp "Encryption" 20/20 languages, 2026-09-05
  - id: RB-003
    name: minor-imperfection-approve-bar
    verdict: APPROVE
    scope: any
    statement: >-
      Meaning-preserving single-word defects — inflection/gender/article
      errors, typos, over-literal word choices — and English technical
      fragments of <=3 words adjacent to protected API identifiers (e.g.
      "device classes") do NOT block an otherwise complete, accurate
      translation. Record them as quality notes on the APPROVE verdict.
      Rationale: the review bar rejects producer bugs and meaning damage,
      not baseline MT imperfection; rejecting every inflection slip ships
      nothing (mission history 2026-09-04).
    evidence: gate5-pdf-foss-cpp-r2 ar/cs/de/hu approvals, 2026-09-05
  - id: RB-004
    name: garbled-or-meaning-damage-reject-bar
    verdict: REJECT
    scope: any
    statement: >-
      REJECT regardless of overall quality when any of: a garbled or
      nonsense word (not a real word of the target language) in prose; a
      meaning-changing or relationship-inverting rendering (including a
      scrambled protected product-name phrase); a mechanical punctuation
      artifact (e.g. Devanagari danda+period "|."); an untranslated prose
      phrase in one frontmatter field whose sibling field translates the
      same source phrase (asymmetric residual). These indicate producer
      bugs or unacceptable meaning damage, not baseline MT imperfection.
    evidence: gate5-pdf-foss-cpp-r2 el/hi rejects + he override, 2026-09-05
  - id: RB-002
    name: brand-navigation-label-exception
    verdict: APPROVE
    scope: link_text
    statement: >-
      Link text matching the brand-navigation-label convention
      (_link_text_is_brand_navigation_label: "Aspose.X KB",
      "Aspose.X — Enterprise Product Family/Blog") and the protected
      "API Reference" phrase stay in English by curated portfolio-wide
      convention. Never flag these alone as defects.
    evidence: field notes 2026-09-04 (introducing-cells-foss-go false positives)
