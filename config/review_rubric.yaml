# Review rubric (TC-APT-059, runbook v10.3 §4.2): every review verdict cites
# rule IDs from this file. A judgment call not covered here requires adding a
# rule (a commit) before the verdict stands. Seeded 2026-09-05 with the rule
# needed by the first post-v10.3 verdict; TC-APT-059 extends it from the full
# heal-queue corpus.
version: 1
rules:
  - id: RB-001
    name: untranslated-section-heading
    verdict: REJECT
    scope: body_heading
    statement: >-
      A section heading left byte-identical to its English source in a
      non-English output is a defect UNLESS the identical form is a
      reviewed cognate for that locale (_REVIEWED_IDENTICAL_TRANSLATIONS,
      e.g. fr "Annotations"/"Introduction") or a protected brand/API term
      (config/terminology.yaml, e.g. "API Reference"). Deterministic
      recurrence across every language of a page indicates a
      do_not_translate false positive (producer bug), not model variance:
      fix the producer (i18n registry kind-scoped override is the
      established mechanism, TC-APT-049) and retrigger; never hand-edit
      the output.
    evidence: TC-APT-053-gate5-pdf-foss-cpp "Encryption" 20/20 languages, 2026-09-05
  - id: RB-003
    name: minor-imperfection-approve-bar
    verdict: APPROVE
    scope: any
    statement: >-
      Meaning-preserving single-word defects — inflection/gender/article
      errors, typos, over-literal word choices — and English technical
      fragments of <=3 words adjacent to protected API identifiers (e.g.
      "device classes") do NOT block an otherwise complete, accurate
      translation. Record them as quality notes on the APPROVE verdict.
      Rationale: the review bar rejects producer bugs and meaning damage,
      not baseline MT imperfection; rejecting every inflection slip ships
      nothing (mission history 2026-09-04).
    evidence: gate5-pdf-foss-cpp-r2 ar/cs/de/hu approvals, 2026-09-05
  - id: RB-004
    name: garbled-or-meaning-damage-reject-bar
    verdict: REJECT
    scope: any
    statement: >-
      REJECT regardless of overall quality when any of: a garbled or
      nonsense word (not a real word of the target language) in prose; a
      meaning-changing or relationship-inverting rendering (including a
      scrambled protected product-name phrase); a mechanical punctuation
      artifact (e.g. Devanagari danda+period "|." or CJK "。."); an
      untranslated prose phrase in one frontmatter field whose sibling
      field translates the same source phrase (asymmetric residual). These
      indicate producer bugs or unacceptable meaning damage, not baseline
      MT imperfection. CARVE-OUT: an established technical loanword of the
      target language (e.g. vi "runtime"/"render", id "rendering raster")
      is NOT an untranslated fragment even when the sibling field uses the
      native calque — that asymmetry is RB-003-grade terminology
      inconsistency, not a defect (vi adjudication 2026-09-05).
    evidence: gate5-pdf-foss-cpp-r2 el/hi/nl/ja/ko rejects + he/vi overrides, 2026-09-05
  - id: RB-002
    name: brand-navigation-label-exception
    verdict: APPROVE
    scope: link_text
    statement: >-
      Link text matching the brand-navigation-label convention
      (_link_text_is_brand_navigation_label: "Aspose.X KB",
      "Aspose.X — Enterprise Product Family/Blog") and the protected
      "API Reference" phrase stay in English by curated portfolio-wide
      convention. Never flag these alone as defects.
    evidence: field notes 2026-09-04 (introducing-cells-foss-go false positives)
  - id: RB-005
    name: confirmed-producer-bug-overrides-approve-bar
    verdict: REJECT
    scope: any
    statement: >-
      A defect whose mechanism has been traced to a confirmed producer-side bug
      is a REJECT even when, taken alone, it would qualify as a
      meaning-preserving imperfection under RB-003. RB-003 exists to stop the
      review bar rejecting baseline MT variance; it is not a licence to ship a
      known machine artifact. Test: if the same defect recurs at the same
      structural position across multiple locales of a page, it is not variance.
      Reject, fix the producer, retrigger -- never approve a cell that carries a
      defect a pending fix will change.
    evidence: >-
      cells/go/introducing-cells-foss-go, 2026-09-05: 3 independent reviewers
      returned 5 APPROVE under RB-003, but all 5 carried the soft-wrap sentence
      split at line 261 ("No hay uso restricciones" / "aucune restriction
      d'utilisation restrictions" / "Nu exista utilizare restrictii"), the same
      producer bug that rejected the other 11.
      See data/summaries/fp-softwrap-sentence-splitting-20260905.json
  - id: RB-006
    name: governed-term-preservation-failure
    verdict: REJECT
    scope: any
    statement: >-
      A term the portfolio has GOVERNED as preserve-in-source-language --
      one carried in the site profile's preserve_patterns or
      config/terminology.yaml -- that comes back translated instead of
      preserved is a producer-side protection failure, not a terminology
      preference, and is a REJECT. The mask either did not reach that
      extraction path or was applied after the value was already
      translated; either way a pending producer fix will change the
      output, so RB-005's reasoning applies and the cell must not ship.
      Fix the producer (extend the protection to the field/path that
      missed it) and retrigger -- never hand-edit the output. This rule
      is the inverse of RB-001/RB-002, which cover a protected term
      wrongly left in the source language; neither reaches this case.
      CARVE-OUT: a term that is merely conventional or undecided for this
      portfolio is NOT governed, and translating it is ordinary
      terminology variation under RB-003. Only a term with an actual
      recorded decision behind it qualifies.
      DIAGNOSTIC VALUE: when the same governed term is preserved in some
      positions of one file and translated in others, the split localises
      the gap in the protection path -- record which fields/node kinds
      fall on each side, because that is the fix's actual scope.
    evidence: >-
      words-document-net fa, 2026-09-05 (gate5-words-doc-r3, the first run
      ever to carry the TC-APT-069 'Document Object Model' mask): of the
      source's 4 occurrences, the body H2 and the frontmatter summary were
      correctly preserved in English while frontmatter title and seoTitle
      came back translated. The split shows the mask reaches the body and
      summary paths but not title/seoTitle.
      See data/summaries/review-words-doc-r3-fa-20260905.json
  - id: RB-007
    name: broken-internal-cross-reference
    verdict: REJECT
    scope: body
    statement: >-
      Body prose that points the reader at a section by its SOURCE-language
      heading text, where that heading was translated in the same document,
      is a broken reference: the target page contains no section under the
      name the reader is given. This is a document-internal consistency
      failure, not a terminology preference, and it is visible to any
      reader who tries to follow it.
      CARVE-OUT: if the heading legitimately retains its source form -- a
      protected brand/API term (RB-002) or a reviewed cognate (RB-001) --
      then the reference still resolves and is NOT a defect. The test is
      whether the named section can be found, not whether English appears.
      DIAGNOSTIC: cross-reference divergence that recurs across locales is
      producer-side, because the reference and the heading are separate
      text units translated in different contexts, so RB-005 applies
      alongside this rule and the fix is a producer fix, never a hand edit.
    evidence: >-
      words-document-net, gate5-words-doc-r3, 2026-09-05: the body's
      "see Quick Start below" keeps the English section name in ALL NINE
      regenerated locales (ar, el, fa, fr, he, hi, nl, ro, sv) while the
      "## Quick Start" heading is translated in all nine. Raised
      independently as UNCOVERED by three separate reviewers (fa, nl, fr)
      before the rule existed.
      See data/summaries/review-words-doc-r3-fr-20260905.json
  - id: RB-008
    name: mixed-link-text-localization
    verdict: RECORD_ONLY_PENDING_ADJUDICATION
    scope: body
    statement: >-
      Non-brand link TEXT left in the source language while sibling links in
      the same list/paragraph are translated is a deterministic producer-side
      split, not model variance: single-word link texts equal to their URL
      slug are deliberately excluded from translation by
      _link_text_matches_url_slug (text_unit_extractor.py), while multi-word
      link texts translate normally. Until the producer-level design question
      (is slug-identical link text an identifier or prose?) is adjudicated
      and either the exclusion is removed or the rubric blesses it, reviewers
      RECORD occurrences with this rule id but do NOT charge the cell a
      REJECT for this class alone. A REJECT verdict may still rest on other
      rules in the same cell.
      MECHANISM VARIANT (2026-09-11): the same RECORD-only treatment covers
      multi-word, NON slug-identical link text left in the source language in
      a MINORITY of a page's locales while the majority translate it -- the
      extractor demonstrably emits the unit (most locales translate it) and
      the model echoed it unchanged, so the reader-visible class is identical
      even though _link_text_matches_url_slug is not the mechanism. Same
      scope, same pending adjudication, same representative-ticket handling.
      ESCALATION: when the SAME link text comes back untranslated in EVERY
      locale of a page, the split is deterministic, RB-005 applies, and the
      cell is a REJECT pending a producer fix -- minority recurrence is not
      that case.
    evidence: >-
      cells-rust quickstart, glueretrigger-20260911r2 audit, 2026-09-11:
      "[Installation]"/"[License]" English in ar/es/fa/nl/uk/pt while
      sibling multi-word links translated; raised independently as UNCOVERED
      by all three reviewers. Representative heal ticket opened (es);
      Track-B design decision pending.
      MECHANISM VARIANT evidence: blog.aspose.org/pdf/typescript/
      pdf-core-api-typescript, wave-pdftypescript-coreapi-20260911,
      2026-09-11: body link text "introductory post" (slug
      introducing-pdf-foss-typescript, not slug-identical) untranslated in
      6 of 16 locales (de, el, fa, ja, ko, pl) while ar, cs, es, he, hi, hu,
      id, it, nl, pt translate it.
  - id: RB-009
    name: digit-script-consistency
    verdict: REJECT
    scope: body
    statement: >-
      Ordinal markers in sibling headings/list items of one document must use
      one digit script: mixing localized digits with Latin digits across
      parallel ordinals (e.g. Persian "### 3." rendered with Eastern-Arabic
      numeral while "### 1."/"### 2." keep Latin digits) is a reader-visible
      inconsistency. DIAGNOSTIC: recurrence at the same structural position
      across locales is producer-side per RB-005's reasoning (fix producer,
      retrigger, never hand-edit); an isolated single-locale occurrence is
      model variance and REJECTs only the affected cell.
    evidence: >-
      cells-rust quickstart, glueretrigger-20260911r2 audit, 2026-09-11: fa
      "### 3. اجرا کنید" with Eastern-Arabic numeral vs Latin "### 1." /
      "### 2." siblings; raised as UNCOVERED by the fa reviewer with this
      rule proposed.
  - id: RB-010
    name: protected-identifier-restatement-on-sentence-split
    verdict: APPROVE
    scope: body
    statement: >-
      A protected identifier (code span, API name) occurring MORE times in the
      target than in the source is NOT a defect when the extra occurrence is a
      grammatically integrated restatement created by splitting one source
      sentence into two -- the pattern a target language needs when it cannot
      carry an English relative clause ("...with `X()`, which builds...") in a
      single sentence. Code-span COUNT parity is therefore not a rejection
      criterion on its own; the criteria are that every source identifier is
      present, spelled identically, and that no meaning is added or lost.
      DIAGNOSTIC (RB-005): a duplicated span that is NOT grammatically
      integrated -- bare, adjacent, or repeated at the same structural position
      across several locales -- is a producer-side protected-span
      re-injection bug instead, and REJECTs.
    evidence: >-
      blog.aspose.org/pdf/typescript/pdf-core-api-typescript ja,
      wave-pdftypescript-coreapi-20260911, 2026-09-11: 39 code spans vs the
      source's 38; the extra is `Document.Merge()` opening the second sentence
      with the topic particle wa, where English used ", which builds...". One
      locale of 23, grammatically integrated, meaning intact -> APPROVE.
  - id: RB-011
    name: heading-content-mismatch
    verdict: REJECT
    scope: body_heading
    statement: >-
      A translated section heading that does not describe the content beneath
      it -- typically because it was rendered as the (correctly-translated)
      title of a DIFFERENT section of the same document -- is a reader-visible
      defect distinct from RB-001 (untranslated heading) and RB-007 (stale
      cross-reference): the heading text itself is valid target-language
      prose, but it misidentifies its own section, breaking TOC navigation
      and reader expectation. Test: does the heading match what the section
      body actually covers, not whether it is grammatical or translated.
      DIAGNOSTIC: recurrence at the same structural position across locales
      of one page is producer-side per RB-005 (fix producer, retrigger,
      never hand-edit); a single-locale occurrence is model variance and
      REJECTs only that cell -- retry on the other model before ticketing.
    evidence: >-
      blog.aspose.org/pdf/python/pdf-generated-in-python de,
      wave-pdfgeneratedpython-20260911, 2026-09-11: source H3 "### Packaging
      Unsigned Content" (body covers UnsignedContentAbsorber/UnsignedContent)
      came back as "### Schnellstart" (= Quick Start) in German -- the
      correct German Quick Start heading "## Kurzanleitung" also appears,
      correctly, at its own H2 section further down. Checked all other
      committed German outputs in blog.aspose.org for the same
      "### Schnellstart" string: no other occurrence found, so isolated to
      this one cell, not a recurring producer pattern.
  - id: RB-012
    name: markdown-syntax-in-plaintext-frontmatter-field
    verdict: REJECT
    scope: frontmatter
    statement: >-
      Markdown emphasis syntax (`**bold**`, `_italic_`, etc.) injected into a
      frontmatter field whose source value carries none is a defect: fields
      like `description`/`seoTitle` are consumed as plain text (HTML meta
      tags, RSS feeds, search snippets), which do not render markdown -- the
      literal asterisks/underscores show up as garbage characters to a reader
      or search engine, not as formatting. This is independent of whether the
      emphasized term is otherwise correct; the meaning can be perfect and
      this still REJECTs, the same way RB-004's mechanical-punctuation-
      artifact bar does not require meaning damage elsewhere in the sentence.
      Test: does the source frontmatter value contain markdown syntax at the
      same position -- if not, any that appears in the translation is
      hallucinated formatting, not translated content.
      DIAGNOSTIC: recurrence at the same structural position across locales
      of one page is producer-side per RB-005 (fix producer, retrigger,
      never hand-edit); a single-locale occurrence is model variance and
      REJECTs only that cell -- retry on the other model before ticketing.
    evidence: >-
      blog.aspose.org/pdf/python/pdf-generated-in-python nl,
      pdfgeneratedpython-retrigger-20260911, 2026-09-11: frontmatter
      `description` came back as "...subpackage **aspose_pdf.generated** met
      een tweede **Document**-implementatie, losstaande **form-content**- en
      **PDF/A**-helperklassen..." -- four bold-wrapped spans, none present in
      the English source's plain-prose description. Checked all 12 other
      already-committed locales of the same page's description field: zero
      contain any "**" -- isolated to this one cell. No existing gate checks
      frontmatter string fields for injected markdown syntax (the 44-gate
      battery treats markdown syntax as expected/valid in BODY text, where it
      legitimately occurs, and does not separately check frontmatter values).
