# Canonical registry of closed-vocabulary "template strings" (API-doc section
# headings, table column headers, table enum values) that get a deterministic
# i18n lookup instead of a per-occurrence MT call.
#
# Mission: heading-i18n-governance-20260723 (successor to HT-QUALITY-GATES-001).
# See C:\Users\prora\.claude\plans\glittery-waddling-moth.md §1/§5/§7 for the
# root-cause analysis and taskcard (TC-HT-I18N-001..003) that produced this file.
#
# Schema:
#   id                  stable identifier, never the raw English text (text can
#                       be re-cased/renamed without breaking locale-file keys)
#   en                  the exact English source string this entry matches
#   category            section_heading | table_header | enum_value
#   status              approved   -> live in the classifier, must have full
#                                     locale coverage (see completeness lint)
#                        pending    -> seeded here, translations not yet
#                                     agentically reviewed (TC-HT-I18N-003)
#                        deprecated -> no longer matched, kept for history
#   first_seen_incident traceability back to the investigation that surfaced it
#   evidence_count      occurrence count from the audit_phase7_recon.jsonl /
#                       live-corpus scan that justified adding this entry;
#                       0 means "known term from the pre-existing
#                       _API_HEADING_TERMS/_SECTION_HEADING_TERMS/
#                       _TABLE_ACCESS_VALUES lists, not independently
#                       recounted in this pass"
