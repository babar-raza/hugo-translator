# Evidence-Based Claims Configuration
#
# This file defines all numerical and verifiable claims about the project.
# Each claim is validated against evidence from various sources.

version: "1.0"

claims:
  # File-related claims
  - id: "total_files_created"
    description: "Total number of files created in the project"
    expected_value: 88
    tolerance: "greater_than_or_equal"
    evidence_source: "file_inventory"
    evidence_key: "stats.total_files"
    category: "files"

  - id: "python_files_count"
    description: "Number of Python source files"
    expected_value: 50
    tolerance: "greater_than_or_equal"
    evidence_source: "file_inventory"
    evidence_key: "files[?category=='src' || category=='scripts'].length"
    category: "files"

  # Test-related claims
  - id: "total_test_count"
    description: "Total number of tests (305+ tests)"
    expected_value: 305
    tolerance: "greater_than_or_equal"
    evidence_source: "test_collection"
    evidence_key: "total_tests"
    category: "tests"

  - id: "test_files_count"
    description: "Number of test files"
    expected_value: 30
    tolerance: "greater_than_or_equal"
    evidence_source: "file_inventory"
    evidence_key: "stats.files_by_category.tests"
    category: "tests"

  # GPU-related claims
  - id: "gpu_detection_available"
    description: "GPU detection functionality exists"
    expected_value: true
    tolerance: "equals"
    evidence_source: "gpu_detection"
    evidence_key: "module_verification[?module_name=='src.hardware.gpu_manager'].importable"
    category: "hardware"

  - id: "gpu_module_importable"
    description: "GPU manager module can be imported"
    expected_value: true
    tolerance: "equals"
    evidence_source: "gpu_detection"
    evidence_key: "module_verification[0].importable"
    category: "hardware"

  # Import-related claims
  - id: "all_imports_working"
    description: "All project imports work without errors"
    expected_value: 0
    tolerance: "equals"
    evidence_source: "import_health"
    evidence_key: "failed_imports"
    category: "dependencies"

  - id: "no_circular_imports"
    description: "No circular import dependencies"
    expected_value: 0
    tolerance: "less_than_or_equal"
    evidence_source: "import_health"
    evidence_key: "circular_imports.length"
    category: "dependencies"

  # Code quality claims
  - id: "total_lines_of_code"
    description: "Total lines of code in the project"
    expected_value: 10000
    tolerance: "greater_than_or_equal"
    evidence_source: "file_inventory"
    evidence_key: "stats.total_code_lines"
    category: "code_quality"

  - id: "code_to_comment_ratio"
    description: "Ratio of code to comments is reasonable"
    expected_value: 3
    tolerance: "greater_than"
    evidence_source: "file_inventory"
    evidence_key: "stats.total_code_lines / stats.total_comment_lines"
    category: "code_quality"

  # Documentation claims
  - id: "documentation_files_exist"
    description: "Documentation files exist"
    expected_value: 5
    tolerance: "greater_than_or_equal"
    evidence_source: "file_inventory"
    evidence_key: "stats.files_by_category.docs"
    category: "documentation"

  # Configuration claims
  - id: "requirements_files_exist"
    description: "Requirements files exist"
    expected_value: 1
    tolerance: "greater_than_or_equal"
    evidence_source: "file_inventory"
    evidence_key: "stats.files_by_category.requirements"
    category: "configuration"

# Evidence source configurations
evidence_sources:
  file_inventory:
    type: "json_file"
    path: "data/file_inventory.json"
    description: "File inventory generated by inventory_files.py"

  test_collection:
    type: "pytest_collection"
    command: "pytest --collect-only -q"
    description: "Test collection via pytest"

  gpu_detection:
    type: "json_file"
    path: "reports/gpu_evidence.json"
    description: "GPU evidence collected by collect_gpu_evidence.py"

  import_health:
    type: "json_file"
    path: "reports/import_health.json"
    description: "Import health report from validate_imports.py"
