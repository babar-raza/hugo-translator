site_id: websites.aspose.org
content_roots:
- ${ASPOSE_ORG_CONTENT}/websites.aspose.org
default_source_lang: en
target_langs:
  - ar
  - cs
  - de
  - el
  - es
  - fa
  - fr
  - he
  - hi
  - hu
  - id
  - it
  - ja
  - ko
  - nl
  - pl
  - pt
  - ro
  - ru
  - sv
  - th
  - tr
  - uk
  - vi
  - zh
strict_locale_allowlist: true

frontmatter:
  title:
    mode: translate
    strategy: null
  description:
    mode: translate
    strategy: null
  corporate_header:
    mode: translate
    strategy: null
  sections.description:
    mode: translate
    strategy: null
  sections.links.text:
    mode: translate
    strategy: null
  draft:
    mode: passthrough
    strategy: null
  date:
    mode: passthrough
    strategy: null
  type:
    mode: passthrough
    strategy: null
  layout:
    mode: passthrough
    strategy: null
  url:
    mode: passthrough
    strategy: null
  slug:
    mode: passthrough
    strategy: null
body:
  translate_markdown: true
  preserve_blocks: []
  preserve_patterns:
  - \bAspose\b  # Protect standalone Aspose brand name
  placeholder_syntax:
  - \{\{<.*?>\}\}
  - \{\{%.*?%\}\}
  use_ast_body_reconstruction: true
  ast_segmentation_strategy: adaptive
  ast_batch_size: 50
output_layout:
  per_language_folders: true
  pattern: '{lang}/{path}'
tm_prefs:
  use_semantic_tm: true
  fallback_exact_only: false
  min_similarity_score: 0.8
max_parallel_files: 2
