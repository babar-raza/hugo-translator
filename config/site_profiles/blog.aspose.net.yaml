site_id: blog.aspose.net
content_roots:
- /content/blog
default_source_lang: en
target_langs:
- ar
- bg
- cs
- da
- de
- el
- es
- et
- fa
- fi
- fr
- he
- hi
- hr
- hu
- id
- it
- ja
- ko
- lt
- lv
- nb
- nl
- pl
- pt
- pt-BR
- ro
- ru
- sk
- sl
- sr
- sv
- th
- tr
- uk
- vi
- zh
- zh-TW
frontmatter:
  title:
    mode: translate
    strategy: null
  seoTitle:
    mode: translate
    strategy: null
  description:
    mode: translate
    strategy: null
  summary:
    mode: translate
    strategy: null
  draft:
    mode: passthrough
    strategy: null
  date:
    mode: passthrough
    strategy: null
  type:
    mode: passthrough
    strategy: null
  layout:
    mode: passthrough
    strategy: null
  url:
    mode: passthrough
    strategy: null
  slug:
    mode: passthrough
    strategy: null
body:
  translate_markdown: true
  preserve_blocks:
  - block_code
  - codespan
  preserve_patterns:
  - ^\{\{<.*>\}\}
  placeholder_syntax:
  - \{\{<.*?>\}\}
  - \{\{%.*?%\}\}
output_layout:
  per_language_folders: false
  pattern: '{filename}.{lang}{ext}'
model:
  default: m2m100_1.2b
tm_prefs:
  use_semantic_tm: true
  fallback_exact_only: false
  min_similarity_score: 0.8
validation:
  enabled: true
  validation_mode: lenient
  validators:
    completeness:
      enabled: true
    language_consistency:
      enabled: true
      confidence_threshold: 0.8
    shortcode_preservation:
      enabled: true
    frontmatter_protection:
      enabled: true
    terminology_preservation:
      enabled: true
      validation_mode: normal
    file_placement:
      enabled: true
  post_write_validation: true
terminology:
  enabled: true
  preserve_mode: BOTH
  inherit_global: true
  custom_terms:
  - term: Blog Post
    category: content_type
    case_sensitive: false
    preserve_mode: validate
    severity: info
  - term: Tutorial
    category: content_type
    case_sensitive: false
    preserve_mode: validate
    severity: info
