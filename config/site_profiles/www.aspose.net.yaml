site_id: www.aspose.net
content_roots:
- /content/www
default_source_lang: en
target_langs:
- de
- es
- fr
- ja
- ko
- ru
- zh
- ar
- it
- pt
frontmatter:
  title:
    mode: translate
    strategy: null
  description:
    mode: translate
    strategy: null
  header.image.alt_text:
    mode: translate
    strategy: null
  header.title:
    mode: translate
    strategy: null
  header.subtitle:
    mode: translate
    strategy: null
  header.link.text:
    mode: translate
    strategy: null
  products.items.app.subtitle:
    mode: translate
    strategy: null
  products.items.app.description:
    mode: translate
    strategy: null
  popular_features.heading:
    mode: translate
    strategy: null
  popular_features.features.heading:
    mode: translate
    strategy: null
  popular_features.features.text:
    mode: translate
    strategy: null
  popular_features.all_features_link.text:
    mode: translate
    strategy: null
  success_stories.subtitle:
    mode: translate
    strategy: null
  success_stories.title:
    mode: translate
    strategy: null
  success_stories.stories.description:
    mode: translate
    strategy: null
  testimonials.title:
    mode: translate
    strategy: null
  testimonials.subtitle:
    mode: translate
    strategy: null
  testimonials.items.text:
    mode: translate
    strategy: null
  why_choose.heading:
    mode: translate
    strategy: null
  why_choose.total_link.text:
    mode: translate
    strategy: null
  why_choose.reasons.title:
    mode: translate
    strategy: null
  why_choose.reasons.points:
    mode: translate_list
    strategy: null
  draft:
    mode: passthrough
    strategy: null
  date:
    mode: passthrough
    strategy: null
  type:
    mode: passthrough
    strategy: null
  layout:
    mode: passthrough
    strategy: null
  url:
    mode: passthrough
    strategy: null
  slug:
    mode: passthrough
    strategy: null
body:
  translate_markdown: true
  preserve_blocks: []
  preserve_patterns: []
  placeholder_syntax:
  - \{\{<.*?>\}\}
  - \{\{%.*?%\}\}
output_layout:
  per_language_folders: true
  pattern: '{lang}/{path}'
tm_prefs:
  use_semantic_tm: true
  fallback_exact_only: false
  min_similarity_score: 0.8
