# WS5 Integration Test Site Profile

site_id: "ws5-test"

# Content directory
content_roots:
  - "tests/fixtures/ws5/content"

# Source and target languages
default_source_lang: "en"
target_langs:
  - "es"

# Simple frontmatter rules
frontmatter:
  title:
    mode: "translate"
  description:
    mode: "translate"
  date:
    mode: "passthrough"

# Body translation
body:
  translate_markdown: true
  preserve_blocks:
    - "block_code"
    - "codespan"
  translate_image_alt: false
  translate_link_titles: false
  use_ast_body_reconstruction: true  # G-L4-2 fix: prevents code fence loss in legacy reconstructor

# Output configuration
output_layout:
  per_language_folders: false  # CI-2 fix: fixtures are at root, not in en/ subdir
  # Fixed alongside the durable-fix plan: this pattern previously read
  # "/{lang}/{relative_path}" (a per_language_folders=true-shaped directory
  # template), inconsistent with per_language_folders=false above -- stale
  # drift from before the boolean was flipped. Corrected to the real
  # file-suffix convention (matches blog.aspose.org/www.aspose.org etc.).
  pattern: "{filename}.{lang}{ext}"
  preserve_structure: true

# TM preferences (minimal for testing)
tm_preferences:
  semantic_threshold: 0.80
  use_semantic: false  # Disable for faster testing
  use_context: false

# Model selection
model:
  default: "m2m100_418m"

# Validation (minimal)
validation:
  check_placeholders: false
  check_links: false
  check_yaml_structure: true
  fail_on_error: false

# Performance settings
performance:
  batch_size: 20  # Will be overridden by --batch-size CLI flag
  enable_cache: false  # Disable caching for testing

# Logging
logging:
  level: "INFO"
  flow_artifacts: false

# Metadata
metadata:
  add_translation_info: false
autonomous_enabled: false  # excluded from autonomous worker
