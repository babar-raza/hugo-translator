site_id: docs.aspose.net
content_roots:
- /content/docs
default_source_lang: en
target_langs:
- ar
- bg
- cs
- da
- de
- el
- es
- et
- fa
- fi
- fr
- he
- hi
- hr
- hu
- id
- it
- ja
- ko
- lt
- lv
- nb
- nl
- pl
- pt
- ro
- ru
- sk
- sl
- sr
- sv
- th
- tr
- uk
- vi
- zh
frontmatter:
  title:
    mode: translate
    strategy: null
  description:
    mode: translate
    strategy: null
  draft:
    mode: passthrough
    strategy: null
  date:
    mode: passthrough
    strategy: null
  type:
    mode: passthrough
    strategy: null
  layout:
    mode: passthrough
    strategy: null
  url:
    mode: passthrough
    strategy: null
  slug:
    mode: passthrough
    strategy: null
body:
  translate_markdown: true
  preserve_blocks:
  - block_code
  - codespan
  preserve_patterns:
  - ^\{\{<.*>\}\}
  - ^\{\{%.*?%\}\}
  placeholder_syntax:
  - \{\{<.*?>\}\}
  - \{\{%.*?%\}\}
output_layout:
  per_language_folders: true
  pattern: '{lang}/{path}'
tm_prefs:
  use_semantic_tm: true
  fallback_exact_only: false
  min_similarity_score: 0.8
validation:
  enabled: true
  validation_mode: normal
  validators:
    completeness:
      enabled: true
    language_consistency:
      enabled: true
      confidence_threshold: 0.85
    shortcode_preservation:
      enabled: true
    frontmatter_protection:
      enabled: true
    terminology_preservation:
      enabled: true
      validation_mode: strict
    file_placement:
      enabled: true
  post_write_validation: true
terminology:
  enabled: true
  preserve_mode: BOTH
  inherit_global: true
  custom_terms:
  - term: Getting Started
    category: content_type
    case_sensitive: false
    preserve_mode: validate
    severity: warning
  - term: API
    category: technical_term
    case_sensitive: true
    preserve_mode: both
    severity: error
  - term: SDK
    category: technical_term
    case_sensitive: true
    preserve_mode: both
    severity: error
