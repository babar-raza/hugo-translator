site_id: reference.aspose.org
display_name: API References
# Multi-family: API reference docs organized by product family under en/{family}/
family_scope: multi
content_roots:
- ${ASPOSE_ORG_CONTENT}/reference.aspose.org
default_source_lang: en
target_langs:
  - ar
  - bg
  - ca
  - cs
  - da
  - de
  - el
  - es
  - fa
  - fi
  - fr
  - he
  - hi
  - hr
  - hu
  - id
  - it
  - ja
  - ko
  - lt
  - lv
  - ms
  - nl
  - "no"
  - pl
  - pt
  - ro
  - ru
  - sk
  - sr
  - sv
  - th
  - tr
  - uk
  - vi
  - zh

frontmatter:
  title:
    mode: passthrough   # API object name — never translate
    strategy: null
  linkTitle:
    mode: passthrough   # API object name — never translate
    strategy: null
  description:
    mode: translate
    strategy: null
  summary:
    mode: translate
    strategy: null
  draft:
    mode: passthrough
    strategy: null
  date:
    mode: passthrough
    strategy: null
  type:
    mode: passthrough
    strategy: null
  layout:
    mode: passthrough
    strategy: null
  url:
    mode: passthrough
    strategy: null
  slug:
    mode: passthrough
    strategy: null
body:
  translate_markdown: true
  preserve_blocks:
  - block_code
  - codespan
  - link
  preserve_patterns:
  - ^\{\{<.*>\}\}
  # Aspose product names: Aspose.3D, Aspose.Words, Aspose.Cells.Python via .NET, etc.
  # plus bare standalone "Aspose" (the dot-required version alone never
  # matched this, consistent with the same gap found+fixed on kb.aspose.org).
  - \bAspose\.\S+
  - \bAspose\b
  # Dotted API identifier: ClassName.METHOD, Enum.CONSTANT, Class.Class (constructor refs)
  - \b[A-Z][A-Za-z0-9_]*(?:\.[A-Z][A-Za-z0-9_]+)+\b
  # Interface names: ISerializable, IIndexedVertexElement (I + PascalCase, 2+ chars after I)
  - \bI[A-Z][a-zA-Z0-9]{2,}\b
  - \b[A-Z][a-z0-9]+(?:[A-Z][a-z0-9]+)+\b
  - ^[A-Z]{2,}$
  - ^<.*>
  - <[A-Z][a-zA-Z0-9]+>
  - ^[A-Z][A-Za-z0-9_]*\s*\(.*\)$
  # Inline code spans — API identifiers inside backticks must not be translated
  - "`[^`]+`"
  # TC-AUDIT-001 (RC-B): Mixed-case dotted identifiers — PascalCase.snake_case and
  # PascalCase.camelCase — e.g. FileNode.file_node_id, VertexElement.getType.
  # Protects these as placeholders so description sentences can be translated around them.
  - \b[A-Z][A-Za-z0-9_]+\.[a-z][A-Za-z0-9_.]*\b
  # TC-HDG-TRANS-019: Heading terms removed from preserve_patterns.
  # Gate 9 in write_gate.py validates translated headings and restores English on corruption.
  # - ^(?:Name|Type|Description|Returns|Parameters|Properties|Methods|Fields|Constructors|Events|Exceptions|Remarks|Examples|See Also|Inheritance|Implements|Namespace|Assembly|Syntax|Value)$
  placeholder_syntax:
  - \{\{<.*?>\}\}
  - \{\{%.*?%\}\}
  use_ast_body_reconstruction: true
  ast_segmentation_strategy: adaptive
  ast_batch_size: 50
output_layout:
  per_language_folders: true
  pattern: '{lang}/{path}'
tm_prefs:
  use_semantic_tm: true
  fallback_exact_only: false
  min_similarity_score: 0.8
validation:
  enabled: true
  validation_mode: strict
  validators:
    completeness:
      enabled: true
    language_consistency:
      enabled: true
      confidence_threshold: 0.9
    shortcode_preservation:
      enabled: true
    frontmatter_protection:
      enabled: true
    terminology_preservation:
      enabled: true
      validation_mode: strict
    file_placement:
      enabled: true
  post_write_validation: true
terminology:
  enabled: true
  preserve_mode: BOTH
  inherit_global: true
  custom_terms:
  - term: API
    category: technical_term
    case_sensitive: true
    preserve_mode: both
    severity: error
  - term: Method
    category: api_term
    case_sensitive: false
    preserve_mode: validate
    severity: warning
  - term: Property
    category: api_term
    case_sensitive: false
    preserve_mode: validate
    severity: warning
  - term: Namespace
    category: api_term
    case_sensitive: false
    preserve_mode: validate
    severity: warning
  - term: Class
    category: api_term
    case_sensitive: false
    preserve_mode: validate
    severity: warning
  - term: Exception
    category: api_term
    case_sensitive: false
    preserve_mode: validate
    severity: warning
  - term: Interface
    category: api_term
    case_sensitive: false
    preserve_mode: validate
    severity: warning
  - term: Enum
    category: api_term
    case_sensitive: false
    preserve_mode: validate
    severity: warning
  - term: Struct
    category: api_term
    case_sensitive: false
    preserve_mode: validate
    severity: warning
  patterns:
  - pattern: \b[A-Z][a-z]+(?:[A-Z][a-z]+)+\b
    category: pascal_case_identifier
    description: PascalCase API identifiers (class/method names)
    preserve_mode: protect
    severity: error
  - pattern: \b[A-Z_]+\b
    category: constant_name
    description: UPPER_CASE constants
    preserve_mode: protect
    severity: warning
  - pattern: \b[A-Z][a-zA-Z0-9]*\.[A-Z][a-zA-Z0-9.]*\b
    category: namespace_identifier
    description: Dotted namespace identifiers (System.Exception, Aspose.BarCode)
    preserve_mode: protect
    severity: error
  - pattern: \bI[A-Z][a-zA-Z0-9]+\b
    category: interface_name
    description: Interface names starting with I (ISerializable, IDisposable)
    preserve_mode: protect
    severity: error
  - pattern: ^\*\*Q\d+[.:]\s
    category: faq_marker
    description: FAQ question markers (Q1., Q2:, etc.)
    preserve_mode: protect
    severity: warning
  - pattern: \b[A-Z][a-z]+Exception\b
    category: exception_class
    description: Exception class names (BarCodeException, InvalidCodeException)
    preserve_mode: protect
    severity: error
translation_engine:
  # TC-TBL-012 / Layer 1: API reference pages are short (5-30 units); even one model
  # failure on a cell breaches the 3% global tolerance and triggers legacy fallback → table
  # corruption. Raise to 10% so up to ~3 units per 30-unit file can come back unchanged
  # before fallback is considered.
  same_as_source_tolerance: 0.10
  # Raise minimum length: very short cell texts (e.g. "String", "int") should not count
  # toward the SAS ratio even if the model echoes them unchanged.
  same_as_source_min_length: 15
max_parallel_files: 2
