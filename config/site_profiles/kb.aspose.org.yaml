site_id: kb.aspose.org
display_name: knowledge base articles
# Multi-family: content is partitioned by product family under en/{family}/
family_scope: multi
content_roots:
- ${ASPOSE_ORG_CONTENT}/kb.aspose.org
default_source_lang: en
target_langs:
  - ar
  - bg
  - ca
  - cs
  - da
  - de
  - el
  - es
  - fa
  - fi
  - fr
  - he
  - hi
  - hr
  - hu
  - id
  - it
  - ja
  - ko
  - lt
  - lv
  - ms
  - nl
  - "no"
  - pl
  - pt
  - ro
  - ru
  - sk
  - sr
  - sv
  - th
  - tr
  - uk
  - vi
  - zh


frontmatter:
  title:
    mode: translate
    strategy: null
  description:
    mode: translate
    strategy: null
  summary:
    mode: translate
    strategy: null
  subtitle:
    mode: translate
    strategy: null
  step1:
    mode: translate
    strategy: null
  step2:
    mode: translate
    strategy: null
  step3:
    mode: translate
    strategy: null
  step4:
    mode: translate
    strategy: null
  step5:
    mode: translate
    strategy: null
  step6:
    mode: translate
    strategy: null
  step7:
    mode: translate
    strategy: null
  step8:
    mode: translate
    strategy: null
  step9:
    mode: translate
    strategy: null
  step10:
    mode: translate
    strategy: null
  keywords:
    mode: passthrough
    strategy: null
  draft:
    mode: passthrough
    strategy: null
  date:
    mode: passthrough
    strategy: null
  type:
    mode: passthrough
    strategy: null
  layout:
    mode: passthrough
    strategy: null
  url:
    mode: passthrough
    strategy: null
  slug:
    mode: passthrough
    strategy: null
body:
  translate_markdown: true
  preserve_blocks:
  - block_code
  - codespan
  preserve_patterns:
  - ^\{\{<.*?>\}\}
  - ^\{\{%.*?%\}\}
  # Protect Aspose product names (Aspose.Email, Aspose.3D, Aspose.Cells, etc.)
  - \bAspose\.[A-Za-z][A-Za-z0-9.]*\b
  # Protect C++ scope resolution (mapi_message::from_stream, MapiMessage::FromStream)
  - \b\w+::\w+(?:\s*\([^)]*\))?\b
  # Protect email file format abbreviations (MSG, EML, PST, ICS, MIME, mbox)
  - \b(?:MSG|EML|PST|ICS|mbox|MIME|MAPI|SMTP|IMAP|POP3|RFC)\b
  placeholder_syntax:
  - \{\{<.*?>\}\}
  - \{\{%.*?%\}\}
  use_ast_body_reconstruction: true
  ast_segmentation_strategy: sentence_only
  ast_batch_size: 8
  ast_translation_max_units_per_batch: 8
  ast_translation_max_tokens_per_batch: 512
  ast_translation_token_safety_margin: 0.5
output_layout:
  per_language_folders: true
  pattern: '{lang}/{path}'
tm_prefs:
  use_semantic_tm: true
  fallback_exact_only: false
  min_similarity_score: 0.8
validation:
  enabled: true
  validation_mode: normal
  validators:
    completeness:
      enabled: true
    language_consistency:
      enabled: true
      confidence_threshold: 0.85
    shortcode_preservation:
      enabled: true
    frontmatter_protection:
      enabled: true
    terminology_preservation:
      enabled: true
      validation_mode: normal
    file_placement:
      enabled: true
  post_write_validation: true
terminology:
  enabled: true
  preserve_mode: BOTH
  inherit_global: true
  custom_terms:
  - term: Knowledge Base
    category: content_type
    case_sensitive: false
    preserve_mode: validate
    severity: warning
  - term: FAQ
    category: content_type
    case_sensitive: true
    preserve_mode: both
    severity: warning
frontmatter_translation:
  enabled: true
  translatable_fields:
  - title
  - description
  - step1
  - step2
  - step3
  - step4
  - step5
  protected_fields:
  - slug
  - productname
  - productkey
  - platformkey
  - productplatform
  - date
  - lastmod
  - weight
  - draft
  - type
max_parallel_files: 2
translation_engine:
  # TC-TBL-012 / Layer 1: kb articles are short with many technical terms (function names,
  # parameter types) that models leave unchanged. Raise tolerance so TC-SAS-01 doesn't
  # trigger legacy fallback → table destruction on short API stubs.
  same_as_source_tolerance: 0.10
  same_as_source_min_length: 15
