site_id: kb.aspose.org
display_name: knowledge base articles
# Multi-family: content is partitioned by product family under en/{family}/
family_scope: multi
content_roots:
- ${ASPOSE_ORG_CONTENT}/kb.aspose.org
default_source_lang: en
target_langs:
  - ar
  - cs
  - de
  - el
  - es
  - fa
  - fr
  - he
  - hi
  - hu
  - id
  - it
  - ja
  - ko
  - nl
  - pl
  - pt
  - ro
  - ru
  - sv
  - th
  - tr
  - uk
  - vi
  - zh
strict_locale_allowlist: true


frontmatter:
  title:
    mode: translate
    strategy: null
  description:
    mode: translate
    strategy: null
  summary:
    mode: translate
    strategy: null
  subtitle:
    mode: translate
    strategy: null
  step1:
    mode: translate
    strategy: null
  step2:
    mode: translate
    strategy: null
  step3:
    mode: translate
    strategy: null
  step4:
    mode: translate
    strategy: null
  step5:
    mode: translate
    strategy: null
  step6:
    mode: translate
    strategy: null
  step7:
    mode: translate
    strategy: null
  step8:
    mode: translate
    strategy: null
  step9:
    mode: translate
    strategy: null
  step10:
    mode: translate
    strategy: null
  keywords:
    mode: passthrough
    strategy: null
  draft:
    mode: passthrough
    strategy: null
  date:
    mode: passthrough
    strategy: null
  type:
    mode: passthrough
    strategy: null
  layout:
    mode: passthrough
    strategy: null
  url:
    mode: ignore
    strategy: null
  aliases:
    mode: ignore
    strategy: null
  slug:
    mode: passthrough
    strategy: null
body:
  translate_markdown: true
  preserve_blocks:
  - block_code
  - codespan
  preserve_patterns:
  - ^\{\{<.*?>\}\}
  - ^\{\{%.*?%\}\}
  # HT-QUALITY-GATES-001 Part 22 (plan 5.3, closes 2.1.C's cited gap): this
  # site had NO markdown-link preserve_pattern at all (exposure specifically
  # in the legacy/non-AST reconstruction fallback path). Placed here, ahead
  # of every other content pattern below (backtick spans, brand names,
  # acronyms), so it claims the WHOLE [text](url) span atomically -- the
  # exact ordering lesson from Part 1.1's brace-leak root cause: if a
  # later-running pattern partially matches content INSIDE the link's text
  # or URL before this one runs, the result is a placeholder nested inside
  # another placeholder's stored value, which restore()'s single sequential
  # pass cannot unwind correctly. Placed first, that nesting can never occur.
  - '\[([^\]]+)\]\(([^)]+)\)'
  # HT-INLINE-CODE-001 TC-ICR-003: the inline-code backtick pattern
  # previously staged here only is retired in favor of the shared
  # config/global.yaml body.preserve_patterns baseline (TC-ICR-002),
  # tightened there to exclude newlines -- see that file's comment for why
  # a per-site-only copy of this exact pattern was the root cause of 4 of
  # 5 sites missing it entirely.
  # Protect Aspose product names (Aspose.Email, Aspose.3D, Aspose.Cells, etc.)
  # and bare standalone "Aspose" (e.g. "Aspose FOSS Knowledge Base" titles --
  # the dot-required version above never matched these, so they still got
  # translated/corrupted despite this preserve_pattern existing).
  - \bAspose(?:\.[A-Za-z0-9][A-Za-z0-9.]*)?\b
  # Protect C++ scope resolution (mapi_message::from_stream, MapiMessage::FromStream)
  - \b\w+::\w+(?:\s*\([^)]*\))?\b
  # Protect email file format abbreviations (MSG, EML, PST, ICS, MIME, mbox)
  - \b(?:MSG|EML|PST|ICS|mbox|MIME|MAPI|SMTP|IMAP|POP3|RFC)\b
  # HT-QUALITY-GATES-001 Part 22 (plan 5.3, incremental scope): protect
  # hyphenated/slashed format & standard codes (UPC-E, EAN-13, PDF/A,
  # ISO-8859-1, UTF-8, AES-256) embedded in prose -- confirmed real
  # corruption: "UPC-E" became "U PC-E" mid-sentence because nothing
  # protected it before MT. Requiring a hyphen/slash suffix (not just bare
  # ALL-CAPS) keeps this from matching stylistic ALL-CAPS emphasis words.
  - \b[A-Z]{2,}(?:[-/][A-Z0-9]+)+\b
  placeholder_syntax:
  - \{\{<.*?>\}\}
  - \{\{%.*?%\}\}
  use_ast_body_reconstruction: true
  ast_segmentation_strategy: sentence_only
  ast_batch_size: 8
  ast_translation_max_units_per_batch: 8
  ast_translation_max_tokens_per_batch: 512
  ast_translation_token_safety_margin: 0.5
output_layout:
  per_language_folders: true
  pattern: '{lang}/{path}'
tm_prefs:
  use_semantic_tm: true
  fallback_exact_only: false
  min_similarity_score: 0.8
validation:
  enabled: true
  validation_mode: normal
  validators:
    completeness:
      enabled: true
    language_consistency:
      enabled: true
      confidence_threshold: 0.85
    shortcode_preservation:
      enabled: true
    frontmatter_protection:
      enabled: true
    terminology_preservation:
      enabled: true
      validation_mode: normal
    file_placement:
      enabled: true
  post_write_validation: true
terminology:
  enabled: true
  preserve_mode: BOTH
  inherit_global: true
  custom_terms:
  - term: Knowledge Base
    category: content_type
    case_sensitive: false
    preserve_mode: validate
    severity: warning
  - term: FAQ
    category: content_type
    case_sensitive: true
    preserve_mode: both
    severity: warning
frontmatter_translation:
  enabled: true
  translatable_fields:
  - title
  - description
  - step1
  - step2
  - step3
  - step4
  - step5
  protected_fields:
  - slug
  - productname
  - productkey
  - platformkey
  - productplatform
  - date
  - lastmod
  - weight
  - draft
  - type
max_parallel_files: 2
translation_engine:
  # TC-TBL-012 / Layer 1: kb articles are short with many technical terms (function names,
  # parameter types) that models leave unchanged. Raise tolerance so TC-SAS-01 doesn't
  # trigger legacy fallback → table destruction on short API stubs.
  same_as_source_tolerance: 0.10
  same_as_source_min_length: 15
