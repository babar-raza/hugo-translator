# Blog Aspose.org Site Profile
# This site uses file-based localization: index.md → index.es.md, index.de.md, etc.
# IMPORTANT: The system will ONLY translate source files (e.g., index.md, _index.md)
#            and will automatically SKIP already-translated files (e.g., index.es.md)
#            to prevent creating double-language files like index.es.da.md
#
# Confirmed on-disk structure (content root: ${ASPOSE_ORG_CONTENT}/blog.aspose.org):
# there is NO top-level `en/` directory anywhere on this site -- unlike docs/kb/
# products/reference.aspose.org, which use `en/{family}/{platform}/`. Content sits
# directly under `{family}/{platform}/{slug}/index.md` (Hugo leaf bundles) with
# `index.{lang}.md` siblings in the SAME directory, plus flat root utility pages
# (`archive.md`/`archive.{lang}.md`, `search.md`/`search.{lang}.md`). Section
# `{family}/{platform}/_index.md` pages currently have zero translated variants.
# blog.aspose.net uses the identical convention (structurally the same site).

site_id: blog.aspose.org
display_name: blog posts
# Multi-family: blog posts are organized by product family under {family}/{platform}/
# (NOT en/{family}/ -- see the on-disk structure note above; this site has no en/ prefix).
family_scope: multi
content_roots:
- ${ASPOSE_ORG_CONTENT}/blog.aspose.org
default_source_lang: en
target_langs:
- ar
- cs
- de
- el
- es
- fa
- fr
- he
- hi
- hu
- id
- it
- ja
- ko
- nl
- pl
- pt
- ro
- ru
- sv
- th
- tr
- uk
- vi
- zh
strict_locale_allowlist: true
frontmatter:
  title:
    mode: translate
    strategy: null
  seoTitle:
    mode: translate
    strategy: null
  description:
    mode: translate
    strategy: null
  summary:
    mode: translate
    strategy: null
  draft:
    mode: passthrough
    strategy: null
  date:
    mode: passthrough
    strategy: null
  type:
    mode: passthrough
    strategy: null
  layout:
    mode: passthrough
    strategy: null
  url:
    mode: ignore
    strategy: null
  aliases:
    mode: ignore
    strategy: null
  slug:
    mode: passthrough
    strategy: null
body:
  translate_markdown: true
  preserve_blocks:
  - block_code
  - codespan
  preserve_patterns:
  - ^\{\{<.*>\}\}
  # HT-QUALITY-GATES-001 Part 22 (plan 5.3, closes 2.1.C's cited gap): this
  # site had NO markdown-link preserve_pattern at all (exposure specifically
  # in the legacy/non-AST reconstruction fallback path). Placed here, ahead
  # of the brand-name pattern below, so it claims its span before anything
  # else can partially match content inside it (the exact ordering lesson
  # from Part 1.1's brace-leak root cause -- a pattern matching inside an
  # already-protected span creates a nested placeholder that restore()'s
  # single sequential pass can't unwind).
  #
  # TC-APT-036 (2026-09-05): narrowed from the WHOLE '[text](url)' span to the
  # ']( url )' TAIL only, because LINK is no longer leaf-forcing in the AST path
  # (text_unit_extractor._has_inline_formatting). Protecting the whole span there
  # would mask the link TEXT too, so it would never be translated -- measured:
  # the sentence came out as '...in the {PLACEHOLDER_0}.' Tail-only keeps the URL
  # and the markdown punctuation safe while leaving the link text inside the
  # translatable sentence, which is what lets the model order a trailing head
  # noun correctly and inflect the preceding article. Narrower than the previous
  # pattern, so it cannot create the nested-placeholder case warned about above.
  # See data/summaries/design-tc-apt-036-link-placeholder-scheme-20260905.json
  - '\]\(([^)]+)\)'
  # TC-APT-040 title-template class: FOSS edition compound names must mask as
  # ONE span, and must be listed BEFORE the generic brand pattern below
  # (patterns are consumed in order). Protected separately, SOV/postpositional
  # languages (hi/ja/ko/zh) interleave title text between the family name and
  # FOSS ("Aspose.PDF C++ 的 FOSS") -- confirmed on introducing-pdf-foss-cpp
  # titles/seoTitles in 4 languages. The AST path reads THIS list, not
  # config/terminology.yaml.
  - \bAspose(?:\.[A-Za-z0-9][A-Za-z0-9.]*)? FOSS\b
  # TC-APT-069 (2026-09-05): governed terminology, not a gate workaround. The
  # portfolio's own published translations keep this term in English in ar, nl
  # and de (docs/kb/reference.aspose.org), with no counter-example across 3771
  # tracked localized files. Masking it here stops the model being asked to
  # translate a term the portfolio has already decided stays English -- which
  # is what produced fully-English seoTitle output on words-document-net.
  # Evidence: data/summaries/decision-dom-terminology-20260905.json
  - '\bDocument Object Model\b'
  # Protect Aspose brand/product names as one cohesive unit (Aspose.Cells,
  # Aspose.3D, bare "Aspose", etc.) -- the previous bare-word-only pattern
  # only protected "Aspose" itself, leaving ".Cells"/".3D" etc. adjacent
  # and unprotected, which could still get mistranslated/detached.
  - \bAspose(?:\.[A-Za-z0-9][A-Za-z0-9.]*)?\b
  # HT-QUALITY-GATES-001 Part 22 (plan 5.3, incremental scope): protect
  # hyphenated/slashed format & standard codes (UPC-E, EAN-13, PDF/A,
  # ISO-8859-1, UTF-8, AES-256) embedded in prose -- confirmed real
  # corruption: "UPC-E" became "U PC-E" mid-sentence because nothing
  # protected it before MT. Requiring a hyphen/slash suffix (not just bare
  # ALL-CAPS) keeps this from matching stylistic ALL-CAPS emphasis words.
  - \b[A-Z]{2,}(?:[-/][A-Z0-9]+)+\b
  placeholder_syntax:
  - \{\{<.*?>\}\}
  - \{\{%.*?%\}\}
  use_ast_body_reconstruction: true
  ast_segmentation_strategy: adaptive
  ast_batch_size: 50

# File-based localization settings
output_layout:
  per_language_folders: false
  pattern: '{filename}.{lang}{ext}'
model:
  # The governed Aspose batch skill pins the 418M model for blog runs.
  # The 1.2B model has reproduced Windows OOM/native crashes on this host.
  default: m2m100_418m
tm_prefs:
  use_semantic_tm: true
  fallback_exact_only: false
  min_similarity_score: 0.8
validation:
  enabled: true
  validation_mode: lenient
  validators:
    completeness:
      enabled: true
    language_consistency:
      enabled: true
      confidence_threshold: 0.8
    shortcode_preservation:
      enabled: true
    frontmatter_protection:
      enabled: true
    terminology_preservation:
      enabled: true
      validation_mode: normal
    file_placement:
      enabled: true
  post_write_validation: true
terminology:
  enabled: true
  preserve_mode: BOTH
  inherit_global: true
  custom_terms:
  - term: Blog Post
    category: content_type
    case_sensitive: false
    preserve_mode: validate
    severity: info
  - term: Tutorial
    category: content_type
    case_sensitive: false
    preserve_mode: validate
    severity: info
max_parallel_files: 2
