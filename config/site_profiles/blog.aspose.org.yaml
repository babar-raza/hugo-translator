# Blog Aspose.org Site Profile
# This site uses file-based localization: index.md → index.es.md, index.de.md, etc.
# IMPORTANT: The system will ONLY translate source files (e.g., index.md, _index.md)
#            and will automatically SKIP already-translated files (e.g., index.es.md)
#            to prevent creating double-language files like index.es.da.md

site_id: blog.aspose.org
display_name: blog posts
content_roots:
- ${ASPOSE_ORG_CONTENT}/blog.aspose.org
default_source_lang: en
target_langs:
- ar
- bg
- ca
- cs
- da
- de
- el
- es
- fa
- fi
- fr
- he
- hi
- hr
- hu
- id
- it
- ja
- ko
- lt
- lv
- ms
- nl
- "no"
- pl
- pt
- ro
- ru
- sk
- sr
- sv
- th
- tr
- uk
- vi
- zh
frontmatter:
  title:
    mode: translate
    strategy: null
  seoTitle:
    mode: translate
    strategy: null
  description:
    mode: translate
    strategy: null
  summary:
    mode: translate
    strategy: null
  draft:
    mode: passthrough
    strategy: null
  date:
    mode: passthrough
    strategy: null
  type:
    mode: passthrough
    strategy: null
  layout:
    mode: passthrough
    strategy: null
  url:
    mode: passthrough
    strategy: null
  slug:
    mode: passthrough
    strategy: null
body:
  translate_markdown: true
  preserve_blocks:
  - block_code
  - codespan
  preserve_patterns:
  - ^\{\{<.*>\}\}
  - \bAspose\b  # Protect standalone Aspose brand name
  placeholder_syntax:
  - \{\{<.*?>\}\}
  - \{\{%.*?%\}\}
  use_ast_body_reconstruction: true
  ast_segmentation_strategy: adaptive
  ast_batch_size: 50

# File-based localization settings
output_layout:
  per_language_folders: false
  pattern: '{filename}.{lang}{ext}'
model:
  default: m2m100_1.2b
tm_prefs:
  use_semantic_tm: true
  fallback_exact_only: false
  min_similarity_score: 0.8
validation:
  enabled: true
  validation_mode: lenient
  validators:
    completeness:
      enabled: true
    language_consistency:
      enabled: true
      confidence_threshold: 0.8
    shortcode_preservation:
      enabled: true
    frontmatter_protection:
      enabled: true
    terminology_preservation:
      enabled: true
      validation_mode: normal
    file_placement:
      enabled: true
  post_write_validation: true
terminology:
  enabled: true
  preserve_mode: BOTH
  inherit_global: true
  custom_terms:
  - term: Blog Post
    category: content_type
    case_sensitive: false
    preserve_mode: validate
    severity: info
  - term: Tutorial
    category: content_type
    case_sensitive: false
    preserve_mode: validate
    severity: info
max_parallel_files: 2
