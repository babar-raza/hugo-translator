# Blog Aspose.org Site Profile
# This site uses file-based localization: index.md → index.es.md, index.de.md, etc.
# IMPORTANT: The system will ONLY translate source files (e.g., index.md, _index.md)
#            and will automatically SKIP already-translated files (e.g., index.es.md)
#            to prevent creating double-language files like index.es.da.md
#
# Confirmed on-disk structure (content root: ${ASPOSE_ORG_CONTENT}/blog.aspose.org):
# there is NO top-level `en/` directory anywhere on this site -- unlike docs/kb/
# products/reference.aspose.org, which use `en/{family}/{platform}/`. Content sits
# directly under `{family}/{platform}/{slug}/index.md` (Hugo leaf bundles) with
# `index.{lang}.md` siblings in the SAME directory, plus flat root utility pages
# (`archive.md`/`archive.{lang}.md`, `search.md`/`search.{lang}.md`). Section
# `{family}/{platform}/_index.md` pages currently have zero translated variants.
# blog.aspose.net uses the identical convention (structurally the same site).

site_id: blog.aspose.org
display_name: blog posts
# Multi-family: blog posts are organized by product family under {family}/{platform}/
# (NOT en/{family}/ -- see the on-disk structure note above; this site has no en/ prefix).
family_scope: multi
content_roots:
- ${ASPOSE_ORG_CONTENT}/blog.aspose.org
default_source_lang: en
target_langs:
- ar
- cs
- de
- el
- es
- fa
- fr
- he
- hi
- hu
- id
- it
- ja
- ko
- nl
- pl
- pt
- ro
- ru
- sv
- th
- tr
- uk
- vi
- zh
strict_locale_allowlist: true
frontmatter:
  title:
    mode: translate
    strategy: null
  seoTitle:
    mode: translate
    strategy: null
  description:
    mode: translate
    strategy: null
  summary:
    mode: translate
    strategy: null
  draft:
    mode: passthrough
    strategy: null
  date:
    mode: passthrough
    strategy: null
  type:
    mode: passthrough
    strategy: null
  layout:
    mode: passthrough
    strategy: null
  url:
    mode: ignore
    strategy: null
  aliases:
    mode: ignore
    strategy: null
  slug:
    mode: passthrough
    strategy: null
body:
  translate_markdown: true
  preserve_blocks:
  - block_code
  - codespan
  preserve_patterns:
  - ^\{\{<.*>\}\}
  # HT-QUALITY-GATES-001 Part 22 (plan 5.3, closes 2.1.C's cited gap): this
  # site had NO markdown-link preserve_pattern at all (exposure specifically
  # in the legacy/non-AST reconstruction fallback path). Placed here, ahead
  # of the brand-name pattern below, so it claims its span before anything
  # else can partially match content inside it (the exact ordering lesson
  # from Part 1.1's brace-leak root cause -- a pattern matching inside an
  # already-protected span creates a nested placeholder that restore()'s
  # single sequential pass can't unwind).
  #
  # TC-APT-036 (2026-09-05): narrowed from the WHOLE '[text](url)' span to the
  # ']( url )' TAIL only, because LINK is no longer leaf-forcing in the AST path
  # (text_unit_extractor._has_inline_formatting). Protecting the whole span there
  # would mask the link TEXT too, so it would never be translated -- measured:
  # the sentence came out as '...in the {PLACEHOLDER_0}.' Tail-only keeps the URL
  # and the markdown punctuation safe while leaving the link text inside the
  # translatable sentence, which is what lets the model order a trailing head
  # noun correctly and inflect the preceding article. Narrower than the previous
  # pattern, so it cannot create the nested-placeholder case warned about above.
  # See data/summaries/design-tc-apt-036-link-placeholder-scheme-20260905.json
  # TC-APT-084: mask a link's OPENING bracket too, so the model never receives an
  # unbalanced '['. The tail-only pattern below leaves '[Anchor{PLACEHOLDER}',
  # and models close that bracket themselves: measured on
  # introducing-cells-foss-go, de/el/id/he emitted a trailing ']' at L277 and
  # pl/pt/ro emitted '[API Reference{](url)]' at L272 -- that orphan '{' is a
  # BROKEN placeholder token, which is what proves the unbalanced-bracket
  # handoff rather than leaving it inferred.
  #
  # TC-APT-100 (2026-09-06): mask a brand-navigation-label LINK as ONE whole
  # span, not three adjacent ones. Live extraction probe on
  # cells-spreadsheet-management-go (professionalize_llm, pl) showed the
  # bracket/label/tail patterns below each claim their own slice of
  # "[Aspose.Cells -- Enterprise Product Family](url)" independently, so the
  # unit text becomes "the {PLACEHOLDER_0}{PLACEHOLDER_2}{PLACEHOLDER_1} is a
  # separate..." -- three back-to-back opaque tokens with NO visible word
  # between "the" and the next real prose. Confirmed as the root cause of a
  # defect recurring in 14/16 reviewed locales at this exact structural
  # position (bare "the", wrong demonstrative, or lost V2 inversion) --
  # data/summaries/review-gate5-cells-mgmt-retry2-20260906.json. The model has
  # no gender/number/category cue left to inflect or even translate the
  # determiner against. This pattern claims the WHOLE "[label](url)" as one
  # placeholder instead, giving the model a single clean substitution token
  # ("the {PLACEHOLDER} is a separate...") -- the ordinary, well-handled
  # placeholder shape, rather than three concatenated ones. Must be listed
  # BEFORE the generic bracket-lookahead/tail patterns immediately below
  # (patterns are consumed in order) so it claims the span first.
  - '\[Aspose(?:\.[A-Za-z0-9][A-Za-z0-9.]*)?\s+(?:—|--|-)\s+Enterprise(?:\s[A-Z][A-Za-z]*){1,3}\]\([^)]+\)'
  # Lookahead-scoped to '[' that actually opens a link, so brackets in prose and
  # code spans are untouched. Placed BEFORE the tail pattern so it claims its
  # own single character first and cannot nest inside the tail's span.
  - '\[(?=[^\]]*\]\()'
  - '\]\(([^)]+)\)'
  # TC-APT-040 title-template class: FOSS edition compound names must mask as
  # ONE span, and must be listed BEFORE the generic brand pattern below
  # (patterns are consumed in order). Protected separately, SOV/postpositional
  # languages (hi/ja/ko/zh) interleave title text between the family name and
  # FOSS ("Aspose.PDF C++ 的 FOSS") -- confirmed on introducing-pdf-foss-cpp
  # titles/seoTitles in 4 languages. The AST path reads THIS list, not
  # config/terminology.yaml.
  - \bAspose(?:\.[A-Za-z0-9][A-Za-z0-9.]*)? FOSS\b
  # TC-APT-069 (2026-09-05): governed terminology, not a gate workaround. The
  # portfolio's own published translations keep this term in English in ar, nl
  # and de (docs/kb/reference.aspose.org), with no counter-example across 3771
  # tracked localized files. Masking it here stops the model being asked to
  # translate a term the portfolio has already decided stays English -- which
  # is what produced fully-English seoTitle output on words-document-net.
  # Evidence: data/summaries/decision-dom-terminology-20260905.json
  - '\bDocument Object Model\b'
  # TC-APT-087 (2026-09-06): governed site-navigation labels of the shape
  # "Aspose.X -- Enterprise Y" (e.g. "Aspose.Cells -- Enterprise Product
  # Family", "Aspose.Cells -- Enterprise Blog") are a fixed convention
  # _link_text_is_brand_navigation_label already recognizes on the LINK_TEXT
  # and whole-node-link extraction paths (TC-APT-085) -- but a paragraph that
  # embeds this link alongside OTHER prose ("...the [Aspose.Cells --
  # Enterprise Product Family](url) is a...") extracts as one full-sentence
  # unit (TC-APT-036/078's link-in-sentence path), where only the bare
  # "Aspose.Cells" brand token is masked (the generic pattern below) and "--
  # Enterprise Product Family" is left as ordinary translatable prose.
  # Confirmed LIVE, not inferred: instrumented segment_translator.py and ran
  # engine.translate_file(force=True) on the real page with
  # professionalize_llm -- the unit at body.paragraph[14] carries source text
  # "...the {PLACEHOLDER_0}{PLACEHOLDER_2} -- Enterprise Product
  # Family{PLACEHOLDER_1} is a..." (brand token and URL tail masked, label
  # suffix exposed) and the model duly translates it into Arabic on every
  # attempt (2 different Arabic renderings across 2 live runs). A synthetic
  # unit test using a hand-built TextUnitExtractor without this exact
  # constructor's preserve_patterns/mt_model kwargs produced a MISLEADING
  # leaf-split result and briefly looked like a false alarm -- only the live,
  # fully-configured engine call reproduces the real segmentation. Must be
  # listed BEFORE the generic brand pattern below so it claims the WHOLE
  # label as one span (patterns are consumed in order) -- same ordering rule
  # as the FOSS-edition pattern above. Evidence: 0 pages on any other
  # in-scope site use this "Enterprise" shape (docs/kb/reference/products/
  # websites.aspose.org all searched, zero hits), so scoped to this profile
  # rather than the global baseline.
  - \bAspose(?:\.[A-Za-z0-9][A-Za-z0-9.]*)?\s+(?:—|--|-)\s+Enterprise(?:\s[A-Z][A-Za-z]*){1,3}\b
  # Protect Aspose brand/product names as one cohesive unit (Aspose.Cells,
  # Aspose.3D, bare "Aspose", etc.) -- the previous bare-word-only pattern
  # only protected "Aspose" itself, leaving ".Cells"/".3D" etc. adjacent
  # and unprotected, which could still get mistranslated/detached.
  - \bAspose(?:\.[A-Za-z0-9][A-Za-z0-9.]*)?\b
  # TC-APT-099 wave3/wave4 (2026-09-06): m2m100_418m deterministically mistranslates
  # the bare platform name "TypeScript" into Romanian as "tipografe" ("printing
  # houses") -- a real Romanian word but a meaning-changing substitution (RB-004),
  # not baseline MT variance. Reproduced identically on two independent, unrelated
  # source pages (3d/typescript/_index.md and cells/typescript/_index.md), same
  # position ("... FOSS pentru {platform}"), same wrong word, confirming a
  # deterministic model behavior rather than sampling noise. No other bare platform
  # name used across this same title template (Java, .NET, Python, C++, Go, Rust)
  # has ever shown an analogous failure across dozens of language pairs, so this is
  # scoped narrowly to the one proper noun with confirmed evidence rather than
  # guessed broadly. See data/summaries/review-wave3-3d-20260906.json and the
  # wave4-m2m recurrence.
  - \bTypeScript\b
  # HT-QUALITY-GATES-001 Part 22 (plan 5.3, incremental scope): protect
  # hyphenated/slashed format & standard codes (UPC-E, EAN-13, PDF/A,
  # ISO-8859-1, UTF-8, AES-256) embedded in prose -- confirmed real
  # corruption: "UPC-E" became "U PC-E" mid-sentence because nothing
  # protected it before MT. Requiring a hyphen/slash suffix (not just bare
  # ALL-CAPS) keeps this from matching stylistic ALL-CAPS emphasis words.
  - \b[A-Z]{2,}(?:[-/][A-Z0-9]+)+\b
  placeholder_syntax:
  - \{\{<.*?>\}\}
  - \{\{%.*?%\}\}
  use_ast_body_reconstruction: true
  ast_segmentation_strategy: adaptive
  ast_batch_size: 50

# File-based localization settings
output_layout:
  per_language_folders: false
  pattern: '{filename}.{lang}{ext}'
model:
  # The governed Aspose batch skill pins the 418M model for blog runs.
  # The 1.2B model has reproduced Windows OOM/native crashes on this host.
  default: m2m100_418m
tm_prefs:
  use_semantic_tm: true
  fallback_exact_only: false
  min_similarity_score: 0.8
validation:
  enabled: true
  validation_mode: lenient
  validators:
    completeness:
      enabled: true
    language_consistency:
      enabled: true
      confidence_threshold: 0.8
    shortcode_preservation:
      enabled: true
    frontmatter_protection:
      enabled: true
    terminology_preservation:
      enabled: true
      validation_mode: normal
    file_placement:
      enabled: true
  post_write_validation: true
terminology:
  enabled: true
  preserve_mode: BOTH
  inherit_global: true
  custom_terms:
  - term: Blog Post
    category: content_type
    case_sensitive: false
    preserve_mode: validate
    severity: info
  - term: Tutorial
    category: content_type
    case_sensitive: false
    preserve_mode: validate
    severity: info
max_parallel_files: 2
