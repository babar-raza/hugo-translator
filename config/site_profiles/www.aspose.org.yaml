# www.aspose.org Site Profile
# Uses file-based localization: _index.md → _index.ar.md, _index.bg.md, etc.
# (flat file naming, NOT per-language folders — different from www.aspose.net)

site_id: www.aspose.org
display_name: files
content_roots:
- ${ASPOSE_ORG_CONTENT}/www.aspose.org
default_source_lang: en
target_langs:
- ar
- bg
- ca
- cs
- da
- de
- el
- es
- fa
- fi
- fr
- he
- hi
- hr
- hu
- id
- it
- ja
- ko
- lt
- lv
- ms
- nl
- "no"
- pl
- pt
- ro
- ru
- sk
- sr
- sv
- th
- tr
- uk
- vi
- zh

frontmatter:
  title:
    mode: translate
    strategy: null
  description:
    mode: translate
    strategy: null
  header.image.alt_text:
    mode: translate
    strategy: null
  header.title:
    mode: translate
    strategy: null
  header.subtitle:
    mode: translate
    strategy: null
  header.link.text:
    mode: translate
    strategy: null
  products.items.app.subtitle:
    mode: translate
    strategy: null
  products.items.app.description:
    mode: translate
    strategy: null
  popular_features.heading:
    mode: translate
    strategy: null
  popular_features.features.heading:
    mode: translate
    strategy: null
  popular_features.features.text:
    mode: translate
    strategy: null
  popular_features.all_features_link.text:
    mode: translate
    strategy: null
  success_stories.subtitle:
    mode: translate
    strategy: null
  success_stories.title:
    mode: translate
    strategy: null
  success_stories.stories.description:
    mode: translate
    strategy: null
  testimonials.title:
    mode: translate
    strategy: null
  testimonials.subtitle:
    mode: translate
    strategy: null
  testimonials.items.text:
    mode: translate
    strategy: null
  why_choose.heading:
    mode: translate
    strategy: null
  why_choose.total_link.text:
    mode: translate
    strategy: null
  why_choose.reasons.title:
    mode: translate
    strategy: null
  why_choose.reasons.points:
    mode: translate_list
    strategy: null
  draft:
    mode: passthrough
    strategy: null
  date:
    mode: passthrough
    strategy: null
  type:
    mode: passthrough
    strategy: null
  layout:
    mode: passthrough
    strategy: null
  url:
    mode: passthrough
    strategy: null
  slug:
    mode: passthrough
    strategy: null
body:
  translate_markdown: true
  preserve_blocks: []
  preserve_patterns: []
  placeholder_syntax:
  - \{\{<.*?>\}\}
  - \{\{%.*?%\}\}
  use_ast_body_reconstruction: true
  ast_segmentation_strategy: adaptive
  ast_batch_size: 50
output_layout:
  per_language_folders: false
  pattern: '{filename}.{lang}{ext}'
tm_prefs:
  use_semantic_tm: true
  fallback_exact_only: false
  min_similarity_score: 0.8
max_parallel_files: 2
