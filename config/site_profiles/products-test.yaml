# Targeted test profile: products.aspose.net with 2 languages only
# Purpose: Verify content worker on real production data (~10 untranslated files)
site_id: products-test
display_name: Landing Pages (2 lang test)
content_roots:
- ${ASPOSE_NET_CONTENT}/products.aspose.net
default_source_lang: en
target_langs:
  - fr
  - de

frontmatter:
  banner.title:
    mode: translate
    strategy: null
  banner.content:
    mode: translate
    strategy: null
  plugin_description:
    mode: translate
    strategy: null
  head_title:
    mode: translate
    strategy: null
  head_description:
    mode: translate
    strategy: null
  title:
    mode: translate
    strategy: null
  description:
    mode: translate
    strategy: null
  overview.title:
    mode: translate
    strategy: null
  overview.content:
    mode: translate
    strategy: null
  content.block.title_left:
    mode: translate
    strategy: null
  content.block.content_left:
    mode: translate
    strategy: null
  content.block.title_right:
    mode: translate
    strategy: null
  content.block.content_right:
    mode: translate
    strategy: null
  body.block.title_left:
    mode: translate
    strategy: null
  body.block.content_left:
    mode: translate
    strategy: null
  body.block.title_right:
    mode: translate
    strategy: null
  body.block.content_right:
    mode: translate
    strategy: null
  single.block.content:
    mode: translate
    strategy: null
  single.block.title:
    mode: translate
    strategy: null
  faq.list.question:
    mode: translate
    strategy: null
  faq.list.answer:
    mode: translate
    strategy: null
  testimonialswrapper.tmessage:
    mode: passthrough
    strategy: null
  testimonialswrapper.title:
    mode: translate
    strategy: null
  testimonialswrapper.subtitle:
    mode: translate
    strategy: null
  app.title:
    mode: translate
    strategy: null
  draft:
    mode: passthrough
    strategy: null
  date:
    mode: passthrough
    strategy: null
  type:
    mode: passthrough
    strategy: null
  layout:
    mode: passthrough
    strategy: null
  url:
    mode: passthrough
    strategy: null
  slug:
    mode: passthrough
    strategy: null
body:
  translate_markdown: true
  preserve_blocks: []
  preserve_patterns:
  - \[[^\]]+\]\([^)]+\)
  placeholder_syntax:
  - \{\{<.*?>\}\}
  - \{\{%.*?%\}\}
  use_ast_body_reconstruction: true
  ast_segmentation_strategy: adaptive
  ast_batch_size: 50
output_layout:
  per_language_folders: true
  pattern: '{lang}/{path}'
tm_prefs:
  use_semantic_tm: true
  fallback_exact_only: false
  min_similarity_score: 0.8
validation:
  enabled: true
  validation_mode: normal
  validators:
    completeness:
      enabled: true
    language_consistency:
      enabled: true
      confidence_threshold: 0.85
    shortcode_preservation:
      enabled: true
    frontmatter_protection:
      enabled: true
    terminology_preservation:
      enabled: true
      validation_mode: strict
    file_placement:
      enabled: true
  post_write_validation: true
terminology:
  enabled: true
  preserve_mode: BOTH
  inherit_global: true
autonomous_enabled: false  # excluded from autonomous worker
