site_id: docs.aspose.org
display_name: Documentation
# Multi-family: content is partitioned by product family under en/{family}/
family_scope: multi
content_roots:
- ${ASPOSE_ORG_CONTENT}/docs.aspose.org
default_source_lang: en
target_langs:
  - ar
  - cs
  - de
  - el
  - es
  - fa
  - fr
  - he
  - hi
  - hu
  - id
  - it
  - ja
  - ko
  - nl
  - pl
  - pt
  - ro
  - ru
  - sv
  - th
  - tr
  - uk
  - vi
  - zh
strict_locale_allowlist: true

frontmatter:
  title:
    mode: translate
    strategy: null
  description:
    mode: translate
    strategy: null
  subtitle:
    mode: translate
    strategy: null
  draft:
    mode: passthrough
    strategy: null
  date:
    mode: passthrough
    strategy: null
  type:
    mode: passthrough
    strategy: null
  layout:
    mode: passthrough
    strategy: null
  url:
    mode: passthrough
    strategy: null
  slug:
    mode: passthrough
    strategy: null
body:
  translate_markdown: true
  preserve_blocks:
  - block_code
  - codespan
  preserve_patterns:
  - ^\{\{<.*>\}\}
  - ^\{\{%.*?%\}\}
  - '\[([^\]]+)\]\(([^)]+)\)'
  - '`[^`]+`'
  # Protect Aspose brand/product names (Aspose.Cells, Aspose.PDF, Aspose.Font,
  # bare "Aspose", etc.) from being translated/corrupted -- was previously
  # missing entirely on this site (unlike kb/reference/blog profiles).
  - \bAspose(?:\.[A-Za-z0-9][A-Za-z0-9.]*)?\b
  # HT-QUALITY-GATES-001 Part 22 (plan 5.3, incremental scope): protect
  # hyphenated/slashed format & standard codes (UPC-E, EAN-13, PDF/A,
  # ISO-8859-1, UTF-8, AES-256) embedded in prose -- confirmed real
  # corruption: "UPC-E" became "U PC-E" mid-sentence because nothing
  # protected it before MT. Requiring a hyphen/slash suffix (not just bare
  # ALL-CAPS) keeps this from matching stylistic ALL-CAPS emphasis words.
  - \b[A-Z]{2,}(?:[-/][A-Z0-9]+)+\b
  placeholder_syntax:
  - \{\{<.*?>\}\}
  - \{\{%.*?%\}\}
  use_ast_body_reconstruction: true
  ast_segmentation_strategy: sentence_only
  ast_batch_size: 50
output_layout:
  per_language_folders: true
  pattern: '{lang}/{path}'
tm_prefs:
  use_semantic_tm: true
  fallback_exact_only: false
  min_similarity_score: 0.8
validation:
  enabled: true
  validation_mode: normal
  validators:
    completeness:
      enabled: true
    language_consistency:
      enabled: true
      confidence_threshold: 0.85
    shortcode_preservation:
      enabled: true
    frontmatter_protection:
      enabled: true
    terminology_preservation:
      enabled: true
      validation_mode: strict
    file_placement:
      enabled: true
  post_write_validation: true
terminology:
  enabled: true
  preserve_mode: BOTH
  inherit_global: true
  custom_terms:
  - term: Getting Started
    category: content_type
    case_sensitive: false
    preserve_mode: validate
    severity: warning
  - term: API
    category: technical_term
    case_sensitive: true
    preserve_mode: both
    severity: error
  - term: SDK
    category: technical_term
    case_sensitive: true
    preserve_mode: both
    severity: error
max_parallel_files: 2
translation_engine:
  # TC-TBL-012 / Layer 1: docs articles contain many API identifiers and code references
  # that models leave unchanged. Raise tolerance to prevent TC-SAS-01 → legacy fallback
  # → table/structure destruction on short technical articles.
  same_as_source_tolerance: 0.10
  same_as_source_min_length: 15
