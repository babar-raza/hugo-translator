# Worker Registry — Single source of truth for all worker configurations.
# Used by the orchestrator to decide when and how to launch workers.
#
# Trigger types:
#   queue_non_empty  — launch when a JSONL queue file has entries
#   file_change      — launch when files matching pattern have mtime > since
#   worker_completed — launch after another worker finishes successfully
#   multi            — any sub-condition fires

workers:
  content_worker:
    enabled: true
    mode: oneshot
    module: src.workers.autonomous_content_translation_worker
    cli_args: ["--mode", "oneshot"]
    trigger:
      type: multi
      conditions:
        - type: queue_non_empty
          queue_path: "data/retranslate_queue.jsonl"
        - type: file_change
          paths: ["${ASPOSE_NET_CONTENT}", "${ASPOSE_ORG_CONTENT}"]
          pattern: "*.md"
    input_queues:
      - "data/retranslate_queue.jsonl"
    output_artifacts:
      - "translated .md files in content repos"
      - "data/retranslate_queue.jsonl (CASE 4 entries)"
      - "data/tm/improvement_queue.jsonl (new TM candidates)"
      - "git commits"
    cooldown_seconds: 1800  # 30 min between launches
    max_runtime_seconds: 7200  # 2 hours max
    max_concurrent: 1
    dependencies: []
    campaign_sentinel: "data/logs/content_worker.campaign_disabled"
    safe_command: ".venv/Scripts/python.exe -m src.workers.autonomous_content_translation_worker --mode oneshot"
    useful_work_criteria: "translated_files > 0 OR retranslate_queue entries consumed"

  tm_improvement_worker:
    enabled: true
    mode: oneshot
    module: src.workers.tm_improvement_worker
    cli_args: ["--mode", "oneshot"]
    trigger:
      type: queue_non_empty
      queue_path: "data/tm/improvement_queue.jsonl"
    input_queues:
      - "data/tm/improvement_queue.jsonl"
    output_artifacts:
      - "improved TM entries in L2/L3"
    cooldown_seconds: 3600  # 1 hour between launches
    max_runtime_seconds: 3600  # 1 hour max
    max_concurrent: 1
    dependencies: []
    safe_command: ".venv/Scripts/python.exe -m src.workers.tm_improvement_worker --mode oneshot"
    useful_work_criteria: "improved_count > 0"

  verification_worker:
    enabled: true
    mode: oneshot
    module: src.workers.autonomous_verification_worker
    cli_args: ["--mode", "oneshot"]
    trigger:
      type: multi
      conditions:
        - type: file_change
          paths: ["config/"]
          pattern: "*.yaml"
        - type: worker_completed
          worker: content_worker
    input_queues: []
    output_artifacts:
      - "verification pass/fail telemetry"
      - "quality_check_results (post-translation)"
    cooldown_seconds: 7200  # 2 hours between launches
    max_runtime_seconds: 600  # 10 min max
    max_concurrent: 1
    dependencies: []
    safe_command: ".venv/Scripts/python.exe -m src.workers.autonomous_verification_worker --mode oneshot"
    useful_work_criteria: "config validated OR quality check produced actionable results"
