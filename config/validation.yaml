# Validation Engine Configuration
# This file defines validation rules, retry strategies, and validation modes
# for the Hugo Translation System validation pipeline.

version: "1.0"

# Decision Rules: Configure when to reject/retry translations
decision_rules:
  # Rejection thresholds - when to reject a translation outright
  reject_on_error_count: 2  # Reject if this many errors are detected (reduced from 3)
  reject_on_placeholder_error: true  # Reject if placeholder integrity fails
  reject_on_code_block_error: true  # Reject if code blocks are corrupted
  reject_on_link_error: true  # Reject if links are broken
  reject_on_repetition_error: true  # Hard-reject on repetition (7-12x word repetition detected in ES/CS/IT corrupted output)

  # Retry configuration - when to attempt re-translation
  max_retry_attempts: 2  # Maximum number of retry attempts
  retry_on_structure_error: true  # Retry if markdown structure is damaged
  retry_on_terminology_warning: true  # Retry if terminology violations found

  # Acceptance thresholds - when to accept despite issues
  accept_warnings: true  # Accept translation with warnings (non-critical issues)
  accept_after_max_retries: false  # Reject after max retries if quality errors remain (prevents publishing corrupted ES/CS/IT)

# Retry Strategy: How to modify retry attempts
retry_strategy:
  feedback_mode: "detailed"  # Feedback detail level: "brief", "detailed", "examples"
  vary_temperature: true  # Vary LLM temperature on retries
  temperature_increment: 0.1  # How much to increase temperature per retry
  max_temperature: 1.0  # Maximum temperature to use

# Validation Modes: Predefined validation mode profiles
# Users can select a mode via CLI or config to adjust validation strictness
validation_modes:
  # Strict mode: Zero tolerance for errors, minimal retries
  strict:
    accept_warnings: false  # Do not accept warnings
    reject_on_error_count: 1  # Reject on first error
    max_retry_attempts: 1  # Only one retry allowed

  # Normal mode: Balanced validation (default)
  normal:
    accept_warnings: true  # Accept warnings
    reject_on_error_count: 2  # Reject after 2 errors (reduced from 3)
    max_retry_attempts: 2  # Two retry attempts

  # Lenient mode: Tolerant of issues, more retries
  lenient:
    accept_warnings: true  # Accept warnings
    reject_on_error_count: 5  # Reject after 5 errors
    max_retry_attempts: 2  # Two retry attempts

# Validators: Enable/disable individual validators
# Each validator can be toggled on/off and configured
validators:
  # Legacy validators (pre-translation validation)
  yaml:
    enabled: true
    description: "Validates YAML frontmatter syntax"

  placeholder:
    enabled: true
    description: "Validates placeholder integrity"

  structure:
    enabled: true
    description: "Validates markdown structure preservation"

  link:
    enabled: true
    description: "Validates link integrity"

  # New post-translation validators (VAL-01 through VAL-06)
  completeness:
    enabled: true
    description: "Validates 100% segment coverage"

  language_consistency:
    enabled: true
    confidence_threshold: 0.85
    min_sentence_length: 8  # reduced from 15 — catches short bullets, headings, list items
    description: "Validates target language consistency using langdetect"
    # Per-language overrides for languages with known M2M100 corruption or high queue rates.
    # purity_threshold: min % of sentences that must be in target language (0-100).
    # confidence_threshold: min langdetect confidence at sentence level.
    per_language_overrides:
      es: {purity_threshold: 98.0, confidence_threshold: 0.90}
      it: {purity_threshold: 98.0, confidence_threshold: 0.90}
      cs: {purity_threshold: 97.0, confidence_threshold: 0.88}
      # Added 2026-04-20: high queue counts (th:25, ar/bg/hi: cluster) — non-Latin scripts
      # have low FP rates for English technical terms, can safely use strict thresholds
      th: {purity_threshold: 99.0, confidence_threshold: 0.88}
      ar: {purity_threshold: 97.0, confidence_threshold: 0.88}
      bg: {purity_threshold: 97.0, confidence_threshold: 0.88}
      hi: {purity_threshold: 97.0, confidence_threshold: 0.88}

  shortcode_preservation:
    enabled: true
    description: "Validates Hugo shortcode preservation"

  frontmatter_protection:
    enabled: true
    description: "Validates frontmatter field protection rules"

  terminology_preservation:
    enabled: true
    validation_mode: "strict"
    description: "Validates terminology preservation (Aspose, .NET, etc.)"

  file_placement:
    enabled: true
    description: "Validates file placement and directory structure"

  repetition_detector:
    enabled: true
    description: "Detects excessive word/phrase repetition (model hallucination guard)"
    ngram_threshold: 5          # Require 5+ occurrences (was 3) — reduces false positives on structured docs
    sentence_dup_threshold: 3   # Require 3 duplicates (was 2) — allows paired FAQ patterns
    word_freq_threshold: 0.35   # Allow slightly higher word frequency (was 0.30)

  # TC-17/TC-18: Semantic similarity validator.
  # Detects major semantic drift using cross-lingual sentence embeddings.
  # Disabled by default — enable via --validation-mode strict or by setting enabled: true.
  # Reuses the L3SemanticTM encoder; does NOT load a second SentenceTransformer model.
  semantic_similarity:
    enabled: true               # TC-MLD-05: enabled — detects semantic drift before write; warns at 0.55, blocks at 0.40
    min_body_chars: 200         # Skip documents shorter than this
    warn_threshold: 0.55        # Cosine similarity below this → WARNING
    error_threshold: 0.40       # Cosine similarity below this → ERROR
    description: "Validates cross-lingual semantic equivalence using sentence embeddings"
