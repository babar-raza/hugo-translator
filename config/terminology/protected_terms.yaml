# Protected terms for kb.aspose.net translations
# Terms matching these patterns will not be translated
# Compatible with TerminologyManager format

version: "1.0"

# Global rules for kb.aspose.net
global:
  # Exact term matches
  exact_matches:
    - term: "Aspose.Slides"
      category: brand
      case_sensitive: true
      preserve_mode: both
      severity: error
      description: "Primary product name"

    - term: "Aspose.Words"
      category: brand
      case_sensitive: true
      preserve_mode: both
      severity: error

    - term: "Aspose.Cells"
      category: brand
      case_sensitive: true
      preserve_mode: both
      severity: error

    - term: "Aspose.PDF"
      category: brand
      case_sensitive: true
      preserve_mode: both
      severity: error

    - term: "NuGet"
      category: technical
      case_sensitive: true
      preserve_mode: both
      severity: warning

    - term: "PowerPoint"
      category: technical
      case_sensitive: true
      preserve_mode: both
      severity: warning

    - term: "Visual Studio"
      category: technical
      case_sensitive: true
      preserve_mode: both
      severity: warning

    - term: "PdfOptions"
      category: code
      case_sensitive: true
      preserve_mode: protect
      severity: warning

    - term: "PPTX"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "POTX"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "ODP"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "PDF/A"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "TAR"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "GZ"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "BZ2"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "TGZ"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "XZ"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "7Z"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "BZIP2"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

  # Pattern-based matches
  patterns:
    - pattern: "Aspose\\.[A-Z][a-z]+"
      category: brand
      case_sensitive: true
      preserve_mode: both
      severity: error
      description: "Generic Aspose.* product pattern"

    - pattern: "\\.NET Framework"
      category: platform
      case_sensitive: false
      preserve_mode: both
      severity: error

    - pattern: "\\.NET Core"
      category: platform
      case_sensitive: false
      preserve_mode: both
      severity: error

    - pattern: "\\.NET Standard"
      category: platform
      case_sensitive: false
      preserve_mode: both
      severity: error

    - pattern: "\\.NET \\d+\\.\\d+"
      category: platform
      case_sensitive: false
      preserve_mode: both
      severity: error
      description: "Versioned .NET like .NET 6.0"

    - pattern: "API Reference"
      category: technical
      case_sensitive: false
      preserve_mode: protect
      severity: warning

    - pattern: "LowCode API"
      category: technical
      case_sensitive: false
      preserve_mode: protect
      severity: warning

    - pattern: "\\d+\\.\\d+\\.\\d+"
      category: version
      case_sensitive: false
      preserve_mode: protect
      severity: info
      description: "Semantic versions like 1.2.3"

    - pattern: "\\d+\\.\\d+\\+"
      category: version
      case_sensitive: false
      preserve_mode: protect
      severity: warning
      description: "Minimum versions like 6.0+"

    - pattern: "SaveFormat\\.[A-Za-z]+"
      category: code
      case_sensitive: true
      preserve_mode: protect
      severity: warning
      description: "SaveFormat enum values"

    - pattern: "Presentation class"
      category: code
      case_sensitive: false
      preserve_mode: protect
      severity: info
