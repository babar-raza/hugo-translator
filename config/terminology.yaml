# Terminology Protection Configuration
# This file defines terms and patterns that must be preserved during translation
# to maintain technical accuracy and brand consistency.

version: "1.0"

# Global terminology rules applied to all sites
global:
  # Exact matches: Terms that must match exactly (with case sensitivity)
  exact_matches:
    # Company name - must always remain "Aspose"
    - term: "Aspose"
      category: company_name
      case_sensitive: true
      preserve_mode: both  # Options: protect (prevent translation), validate (check after), both, none
      severity: error  # Options: error (critical), warning (alert), info (log only)

    # Platform/technology names
    - term: ".NET"
      category: platform
      case_sensitive: true
      preserve_mode: both
      severity: error

    - term: "Java"
      category: platform
      case_sensitive: true
      preserve_mode: both
      severity: error

    - term: "Python"
      category: platform
      case_sensitive: true
      preserve_mode: both
      severity: error

    # File/archive format acronyms — must never be transliterated (e.g. TAR→Тар is wrong)
    - term: "ZIP"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "TAR"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "RAR"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "GZ"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "XZ"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "BZ2"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "TGZ"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "BZIP2"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

    - term: "7Z"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: info

  # Pattern-based matches: Regular expressions for dynamic terminology
  patterns:
    # Aspose product families (e.g., Aspose.Words, Aspose.Cells, Aspose.PDF)
    - pattern: "Aspose\\.[A-Z][a-z]+"
      category: product_family
      description: "Aspose product families (Aspose.Words, Aspose.Cells, etc.)"
      preserve_mode: protect  # Prevent translation of product names
      severity: error

    # LINQ Engine plugin name
    - pattern: "\\bLINQ Engine\\b"
      category: plugin_name
      description: "LINQ Engine plugin"
      preserve_mode: both
      severity: error

# Site-specific terminology overrides
# These extend or override global rules for specific sites
site_overrides: {}

# Auto-discovery settings for terminology extraction
# (Disabled for initial phase - will be enabled in future iterations)
auto_discovery:
  enabled: false  # Enable automatic terminology discovery from source content
  min_frequency: 3  # Minimum occurrences to consider as terminology
  confidence_threshold: 0.8  # Minimum confidence score to auto-add term
