# Terminology Protection Configuration
# This file defines terms and patterns that must be preserved during translation
# to maintain technical accuracy and brand consistency.

version: "1.0"

# Global terminology rules applied to all sites
global:
  # Exact matches: Terms that must match exactly (with case sensitivity)
  exact_matches:
    # Company name - must always remain "Aspose"
    - term: "Aspose"
      category: company_name
      case_sensitive: true
      preserve_mode: both  # Options: protect (prevent translation), validate (check after), both, none
      severity: error  # Options: error (critical), warning (alert), info (log only)

    # Platform/technology names
    - term: ".NET"
      category: platform
      case_sensitive: true
      preserve_mode: both
      severity: error

    # TC-APT-069 / RB-006 (2026-09-05). Governed on published precedent: three
    # tracked, genuinely localized pages keep this term in English
    # (docs.aspose.org/ar, kb.aspose.org/nl, reference.aspose.org/de) against
    # zero counter-examples across 3771 tracked localized files.
    #
    # It is registered HERE in addition to blog.aspose.org.yaml's
    # preserve_patterns because the two mechanisms cover different paths and the
    # profile pattern alone demonstrably does not hold. Measured on
    # gate5-words-doc-r3, the first run to carry the mask: the BODY path
    # preserved the term 3/3 locales, but frontmatter `seoTitle` translated it
    # 0/3 -- because segment_translator._retry_original_frontmatter_value
    # DELIBERATELY bypasses placeholder-wrapped frontmatter on retry (and always
    # under the professionalize_llm escalation), to dodge a documented M2M100
    # failure where the model copies a placeholder-bearing value unchanged. That
    # docstring names the intended safety net: "let terminology/structure/
    # language/fidelity gates validate its returned bytes." The terminology gate
    # is enabled for this profile but read only this file, so it could not see a
    # term that lived solely in preserve_patterns. This entry closes that loop.
    #
    # preserve_mode: both -- protect where protection survives, and validate the
    # returned bytes where it does not. severity: error so a translated instance
    # is a RETRY rather than a silent accept; that is a control being ADDED, and
    # it will legitimately reject cells that currently translate the term.
    - term: "Document Object Model"
      category: standard_term
      case_sensitive: true
      preserve_mode: both
      severity: error
      # TC-APT-069: a partial loss (some occurrences translated, others kept)
      # is the defect that actually occurs here -- measured in 8 of 10 locales --
      # and it lands in the frequency-mismatch branch, which defaults to warning.
      # This term opts that branch up to error so the gate fires on the real
      # case. Deliberately NOT changed for other terms: a legitimate restructure
      # can alter their counts.
      frequency_severity: error

    - term: "Java"
      category: platform
      case_sensitive: true
      preserve_mode: both
      severity: error

    - term: "Python"
      category: platform
      case_sensitive: true
      preserve_mode: both
      severity: error

    # File/archive format acronyms — must never be transliterated (e.g. TAR→Тар is wrong)
    - term: "ZIP"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: error

    - term: "TAR"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: error

    - term: "RAR"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: error

    - term: "GZ"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: error

    - term: "XZ"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: error

    - term: "BZ2"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: error

    - term: "TGZ"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: error

    - term: "BZIP2"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: error

    - term: "7Z"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: error

    # Barcode symbology names — industry-standard identifiers, must never be transliterated
    # Evidence: "EIN 13" (de), "Эйн 13" (ru), "第128章" (zh), "伊恩13" (zh) found in production
    - term: "EAN-13"
      category: barcode_symbology
      case_sensitive: true
      preserve_mode: protect
      severity: error
    - term: "EAN-8"
      category: barcode_symbology
      case_sensitive: true
      preserve_mode: protect
      severity: error
    - term: "EAN-128"
      category: barcode_symbology
      case_sensitive: true
      preserve_mode: protect
      severity: error
    - term: "UPC-A"
      category: barcode_symbology
      case_sensitive: true
      preserve_mode: protect
      severity: error
    - term: "UPC-E"
      category: barcode_symbology
      case_sensitive: true
      preserve_mode: protect
      severity: error
    - term: "Code 128"
      category: barcode_symbology
      case_sensitive: false
      preserve_mode: protect
      severity: error
    - term: "Code 39"
      category: barcode_symbology
      case_sensitive: false
      preserve_mode: protect
      severity: error
    - term: "Code 93"
      category: barcode_symbology
      case_sensitive: false
      preserve_mode: protect
      severity: error
    - term: "Code 11"
      category: barcode_symbology
      case_sensitive: false
      preserve_mode: protect
      severity: error
    - term: "QR Code"
      category: barcode_symbology
      case_sensitive: false
      preserve_mode: protect
      severity: error
    - term: "QR"
      category: barcode_symbology
      case_sensitive: true
      preserve_mode: protect
      severity: warning
    - term: "Data Matrix"
      category: barcode_symbology
      case_sensitive: false
      preserve_mode: protect
      severity: error
    - term: "Aztec"
      category: barcode_symbology
      case_sensitive: true
      preserve_mode: protect
      severity: error
    - term: "PDF417"
      category: barcode_symbology
      case_sensitive: true
      preserve_mode: protect
      severity: error
    - term: "MaxiCode"
      category: barcode_symbology
      case_sensitive: true
      preserve_mode: protect
      severity: error
    - term: "ITF-14"
      category: barcode_symbology
      case_sensitive: true
      preserve_mode: protect
      severity: error
    - term: "GS1"
      category: barcode_symbology
      case_sensitive: true
      preserve_mode: protect
      severity: error
    - term: "POSTNET"
      category: barcode_symbology
      case_sensitive: true
      preserve_mode: protect
      severity: error
    - term: "DataBar"
      category: barcode_symbology
      case_sensitive: true
      preserve_mode: protect
      severity: error
    - term: "MicroQR"
      category: barcode_symbology
      case_sensitive: true
      preserve_mode: protect
      severity: error
    - term: "Han Xin"
      category: barcode_symbology
      case_sensitive: false
      preserve_mode: protect
      severity: error

    # Programming languages and SDK terms — must not be transliterated
    - term: "C#"
      category: programming_language
      case_sensitive: true
      preserve_mode: protect
      severity: warning
    - term: "VB.NET"
      category: programming_language
      case_sensitive: true
      preserve_mode: protect
      severity: warning
    - term: "ASP.NET"
      category: platform
      case_sensitive: true
      preserve_mode: protect
      severity: warning
    - term: "ASP.NET MVC"
      category: platform
      case_sensitive: true
      preserve_mode: protect
      severity: warning
    - term: "NuGet"
      category: package_manager
      case_sensitive: true
      preserve_mode: protect
      severity: warning
    - term: "JSON"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: warning
    - term: "XML"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: warning
    - term: "REST API"
      category: protocol
      case_sensitive: false
      preserve_mode: protect
      severity: warning
    - term: "HTTP"
      category: protocol
      case_sensitive: true
      preserve_mode: protect
      severity: info
    - term: "HTTPS"
      category: protocol
      case_sensitive: true
      preserve_mode: protect
      severity: info
    - term: "CSS"
      category: web
      case_sensitive: true
      preserve_mode: protect
      severity: info
    - term: "HTML"
      category: web
      case_sensitive: true
      preserve_mode: protect
      severity: info

    # API reference phrase protection — prevent hallucination ("API Usage" → "Use of fire" etc.)
    - term: "API Usage"
      category: api_phrase
      case_sensitive: false
      preserve_mode: protect
      severity: error
    - term: "API Reference"
      category: api_phrase
      case_sensitive: false
      preserve_mode: protect
      severity: error
    - term: "API Guide"
      category: api_phrase
      case_sensitive: false
      preserve_mode: protect
      severity: error
    - term: "API Reference Guide"
      category: api_phrase
      case_sensitive: false
      preserve_mode: protect
      severity: error
    - term: "Quick Reference"
      category: api_phrase
      case_sensitive: false
      preserve_mode: protect
      severity: warning

    # Brand-navigation-label suffixes (RB-002/RB-006, found 2026-09-09 reviewing
    # wave24-blog-lowdensity): the portfolio-wide "[Aspose.X for <platform> —
    # Enterprise <Suffix>]" footer link (products.aspose.com / reference.aspose.com
    # / blog.aspose.com CTAs) is meant to keep its "Enterprise ..." tail in
    # English by curated convention (config/review_rubric.yaml RB-002), same as
    # "API Reference" above. It was NOT previously governed here, and the
    # extractor's _link_text_is_brand_navigation_label only protects a link
    # text when EVERY word after the brand token is Title-Case/ALL-CAPS -- this
    # exact link shape fails that test because of the lowercase "for" in
    # "Aspose.Words for Python", so the whole link (including the Enterprise
    # suffix) falls through to ordinary translatable prose. Confirmed as a real,
    # recurring defect, not isolated variance: wave24-blog-lowdensity/words-python
    # mistranslated the "Enterprise Product" tail in 4/4 non-English-preserving
    # locales tried (ar, hu, ja, ro) while ~20 other locales got it right by
    # model judgment alone -- i.e. protection is currently down to luck, not a
    # guarantee. Confirmed present (grep, 2026-09-09) across blog.aspose.org
    # (Enterprise Blog / Enterprise Product / Enterprise Product Family),
    # docs.aspose.org (Enterprise Documentation), and reference.aspose.org
    # (Enterprise API Reference) -- portfolio-scale, not one site.
    - term: "Enterprise Product Family"
      category: brand_nav_phrase
      case_sensitive: false
      preserve_mode: protect
      severity: error
    - term: "Enterprise Product"
      category: brand_nav_phrase
      case_sensitive: false
      preserve_mode: protect
      severity: error
    - term: "Enterprise Blog"
      category: brand_nav_phrase
      case_sensitive: false
      preserve_mode: protect
      severity: error
    - term: "Enterprise Documentation"
      category: brand_nav_phrase
      case_sensitive: false
      preserve_mode: protect
      severity: error
    - term: "Enterprise API Reference"
      category: brand_nav_phrase
      case_sensitive: false
      preserve_mode: protect
      severity: error
    - term: "API"
      category: technical_term
      case_sensitive: true
      preserve_mode: protect
      severity: warning

    # glTF is a file-format identifier, not untranslated prose.  It occurs in
    # docs.aspose.org format-support tables, including legacy malformed rows
    # that the Markdown parser represents as text fragments.
    - term: "glTF"
      category: format
      case_sensitive: true
      preserve_mode: protect
      severity: error

  # Pattern-based matches: Regular expressions for dynamic terminology
  patterns:
    # FOSS edition compound names must be protected as ONE span, and must be
    # listed BEFORE the generic family pattern (protection consumes matches in
    # order): protected separately, SOV/postpositional languages (hi/ja/ko/zh)
    # interleave title text between the family name and FOSS, scrambling the
    # product name ("Aspose.PDF C++ 的 FOSS", TC-APT-040 title-template class).
    - pattern: "Aspose\\.\\S+ FOSS\\b"
      category: product_family
      description: "FOSS edition compound product names (Aspose.PDF FOSS, etc.)"
      preserve_mode: protect
      severity: error

    # Aspose product families (e.g., Aspose.Words, Aspose.Cells, Aspose.PDF, Aspose.3D)
    - pattern: "Aspose\\.\\S+"
      category: product_family
      description: "Aspose product families (Aspose.Words, Aspose.Cells, Aspose.3D, etc.)"
      preserve_mode: protect  # Prevent translation of product names
      severity: error

    # LINQ Engine plugin name
    - pattern: "\\bLINQ Engine\\b"
      category: plugin_name
      description: "LINQ Engine plugin"
      preserve_mode: both
      severity: error

# Site-specific terminology overrides
# These extend or override global rules for specific sites
site_overrides: {}

# Auto-discovery settings for terminology extraction
# (Disabled for initial phase - will be enabled in future iterations)
auto_discovery:
  enabled: true  # Auto-protect high-confidence (>=0.85) Pascal-case, dotted, and UPPER_CASE terms
  min_frequency: 3  # Minimum occurrences to consider as terminology
  confidence_threshold: 0.8  # Minimum confidence score to auto-add term
