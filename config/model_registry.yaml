# Translation Model Registry
#
# This file catalogs available translation models with their metadata
# and requirements. The system uses this to recommend and load appropriate
# models based on hardware capabilities and language pairs.

models:
  # Facebook M2M100 (418M parameters) - HuggingFace
  - model_id: m2m100_418m
    name: "Facebook M2M100 (418M)"
    backend: huggingface
    supported_pairs: all  # Multilingual model supporting 100 languages
    model_size_mb: 1600
    min_ram_gb: 4
    optimal_device: cuda
    parameters: 418000000
    license: MIT
    hf_model_id: facebook/m2m100_418M
    description: "Multilingual translation model from Facebook. Supports 100 languages with good quality."

  # Facebook M2M100 (418M) - CTranslate2 optimized
  - model_id: m2m100_418m_ct2
    name: "Facebook M2M100 (418M, CTranslate2)"
    backend: ctranslate2
    supported_pairs: all
    model_size_mb: 800
    min_ram_gb: 2
    optimal_device: cpu
    parameters: 418000000
    license: MIT
    description: "CTranslate2 optimized version of M2M100. 2x faster with 50% less memory."

  # Facebook M2M100 (1.2B parameters) - HuggingFace
  - model_id: m2m100_1.2b
    name: "Facebook M2M100 (1.2B)"
    backend: huggingface
    supported_pairs: all
    model_size_mb: 4800
    min_ram_gb: 8
    optimal_device: cuda
    parameters: 1200000000
    license: MIT
    local_path: models/m2m100_1.2b
    hf_model_id: facebook/m2m100_1.2B
    description: "Larger M2M100 model with higher quality. Requires good GPU."

  # NLLB-200 (600M parameters) - HuggingFace
  - model_id: nllb_200_600m
    name: "NLLB-200 (600M)"
    backend: huggingface
    supported_pairs: all  # 200 languages
    model_size_mb: 2400
    min_ram_gb: 6
    optimal_device: cuda
    parameters: 600000000
    license: CC-BY-NC-4.0
    local_path: models/nllb_200_600m
    hf_model_id: facebook/nllb-200-distilled-600M
    description: "No Language Left Behind - 200 languages. Best for low-resource languages."

  # NLLB-200 (1.3B parameters) - HuggingFace
  - model_id: nllb_200_1.3b
    name: "NLLB-200 (1.3B)"
    backend: huggingface
    supported_pairs: all
    model_size_mb: 5200
    min_ram_gb: 10
    optimal_device: cuda
    parameters: 1300000000
    license: CC-BY-NC-4.0
    local_path: models/nllb_200_1.3b
    hf_model_id: facebook/nllb-200-1.3B
    description: "Larger NLLB model. Excellent quality for 200 languages."

  # OpusMT English-French - Small specialized model
  - model_id: opus_en_fr
    name: "Opus-MT English-French"
    backend: huggingface
    supported_pairs:
      - ["en", "fr"]
      - ["fr", "en"]
    model_size_mb: 300
    min_ram_gb: 1
    optimal_device: cpu
    parameters: 77000000
    license: CC-BY-4.0
    hf_model_id: Helsinki-NLP/opus-mt-en-fr
    description: "Specialized English-French model. Fast and lightweight."

  # OpusMT English-Spanish
  - model_id: opus_en_es
    name: "Opus-MT English-Spanish"
    backend: huggingface
    supported_pairs:
      - ["en", "es"]
      - ["es", "en"]
    model_size_mb: 300
    min_ram_gb: 1
    optimal_device: cpu
    parameters: 77000000
    license: CC-BY-4.0
    hf_model_id: Helsinki-NLP/opus-mt-en-es
    description: "Specialized English-Spanish model. Fast and lightweight."

  # OpusMT English-German
  - model_id: opus_en_de
    name: "Opus-MT English-German"
    backend: huggingface
    supported_pairs:
      - ["en", "de"]
      - ["de", "en"]
    model_size_mb: 300
    min_ram_gb: 1
    optimal_device: cpu
    parameters: 77000000
    license: CC-BY-4.0
    hf_model_id: Helsinki-NLP/opus-mt-en-de
    description: "Specialized English-German model. Fast and lightweight."

  # Marian-MT English-Romance languages
  - model_id: marian_en_romance
    name: "Marian-MT English-Romance"
    backend: huggingface
    supported_pairs:
      - ["en", "fr"]
      - ["en", "es"]
      - ["en", "it"]
      - ["en", "pt"]
      - ["en", "ro"]
    model_size_mb: 300
    min_ram_gb: 1
    optimal_device: cpu
    parameters: 74000000
    license: Apache-2.0
    hf_model_id: Helsinki-NLP/opus-mt-en-ROMANCE
    description: "English to Romance languages. Covers French, Spanish, Italian, Portuguese, Romanian."

  # Small-100 (300M) - Compact multilingual
  - model_id: small100
    name: "Small-100 (300M)"
    backend: huggingface
    supported_pairs: all  # 100 languages
    model_size_mb: 1200
    min_ram_gb: 3
    optimal_device: cpu
    parameters: 300000000
    license: MIT
    hf_model_id: alirezamsh/small100
    description: "Compact multilingual model. Good balance of size and quality."
