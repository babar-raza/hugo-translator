# Translation Model Registry
#
# This file catalogs available translation models with their metadata
# and requirements. The system uses this to recommend and load appropriate
# models based on hardware capabilities and language pairs.

models:
  # Facebook M2M100 (418M parameters) - HuggingFace
  - model_id: m2m100_418m
    name: "Facebook M2M100 (418M)"
    backend: huggingface
    supported_pairs: all  # Multilingual model supporting 100 languages
    model_size_mb: 1600
    min_ram_gb: 4
    optimal_device: cuda
    parameters: 418000000
    license: MIT
    local_path: models/m2m100_418m
    hf_model_id: facebook/m2m100_418M
    description: "Multilingual translation model from Facebook. Supports 100 languages with good quality."

  # Facebook M2M100 (418M) - CTranslate2 optimized
  - model_id: m2m100_418m_ct2
    name: "Facebook M2M100 (418M, CTranslate2)"
    backend: ctranslate2
    supported_pairs: all
    model_size_mb: 800
    min_ram_gb: 2
    optimal_device: cpu
    parameters: 418000000
    license: MIT
    description: "CTranslate2 optimized version of M2M100. 2x faster with 50% less memory."

  # Facebook M2M100 (1.2B parameters) - HuggingFace
  - model_id: m2m100_1.2b
    name: "Facebook M2M100 (1.2B)"
    backend: huggingface
    supported_pairs: all
    model_size_mb: 4800
    min_ram_gb: 8
    optimal_device: cuda
    parameters: 1200000000
    license: MIT
    local_path: models/m2m100_1.2b
    hf_model_id: facebook/m2m100_1.2B
    description: "Larger M2M100 model with higher quality. Requires good GPU."

  # NLLB-200 (600M parameters) - HuggingFace
  - model_id: nllb_200_600m
    name: "NLLB-200 (600M)"
    backend: huggingface
    supported_pairs: all  # 200 languages
    model_size_mb: 2400
    min_ram_gb: 6
    optimal_device: cuda
    parameters: 600000000
    license: CC-BY-NC-4.0
    local_path: models/nllb_200_600m
    hf_model_id: facebook/nllb-200-distilled-600M
    description: "No Language Left Behind - 200 languages. Best for low-resource languages."

  # NLLB-200 (1.3B parameters) - HuggingFace
