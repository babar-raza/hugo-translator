[pytest]
testpaths = tests
python_files = test_*.py *_test.py
norecursedirs = .git .tox .venv venv build dist __pycache__ *.egg-info .pytest_cache tests/adhoc tests/logs tests/migration tests/verification tests/_archived reports archive scripts .phase* work hardware production
markers =
    contract: Contract tests that verify specifications (deselect with '-m "not contract"')
