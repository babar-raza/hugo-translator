      tests/unit/ and tests/unit/translation_engine/ -- there is no dedicated
      gate in the healing campaign's own launch path (e.g. a preflight check
      before scheduler.py dispatches) that would catch a future regression
      of this specific mechanism before it reaches production content.
    status: OPEN
