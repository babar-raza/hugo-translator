    description: >
      pytest tests/ (full tree, 64 min) reported 775 failed / 6299 passed.
      Rigorously triaged as NOT caused by this session's 2-file change (file
      provenance, isolation re-runs, neighborhood re-run all clean), but the
      underlying pre-existing cause (order-dependent / state-leaking tests)
      was not investigated further -- out of scope for this mission.
    status: OPEN
    evidence:
      - "git diff --stat shows only segment_extractor.py, segment_translator.py, 2 new test files, .local/scheduler.py touched"
      - "2 sampled failures pass in isolation"
      - "tests/unit/translation_engine/ tests/unit/tm/ tests/unit/model_runtime/ (1206 tests): 1202 pass, 4 fail, all 4 pre-existing/unrelated (torch API version mismatch, ctranslate2)"
    missing_evidence:
      - "Bisection identifying the specific state-leaking fixture(s) or ordering dependency"
    root_cause: NOT_YET_DETERMINED
    why_not_only_symptom: >
      Undermines confidence in any future "pytest tests/ full tree" claim
      project-wide, and could mask a real future regression inside the noise.
    affected_files: ["tests/ (broad, unidentified subset)"]
    affected_components: ["test suite infrastructure"]
    affected_connection_points: []
    severity: MEDIUM
    blocker: false
    recurrence_risk: MEDIUM
    required_fix_type: investigation_required
    requires_plan_update: true
    requires_taskcard: true
    requires_system_healing: false
    requires_reexecution: false
    requires_governance_change: false
    requires_evidence_repair: false
    recommended_next_stage: PROMPT_2_TASKCARD
    acceptance_impact: >
      Does not block accepting DELIVERABLE 53 -- the neighborhood-scoped
      verification for THIS change is clean and sufficient. Blocks trusting
      the full-suite command as a general-purpose gate until investigated.

