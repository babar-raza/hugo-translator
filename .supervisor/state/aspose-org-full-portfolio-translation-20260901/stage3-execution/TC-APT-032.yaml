taskcard: TC-APT-032
title: Campaign-path-scoped dirty-tree check (G-22; hard prerequisite for Gate 4)
status: DONE
executed_at: "2026-09-02"
wake: 1
design: "execution_policy.dirty_scope: campaign_paths (mission default in build_campaign_manifest.py) | frozen_baseline (the historical whole-tree frozen dirty baseline, kept for single-writer repos). Under campaign_paths verify_environment errors only if (a) a dirty path is one of the manifest's own outputs without a receipt (an unreceipted candidate) or (b) a manifest-listed English source is dirty; every other dirty path is ignored, never staged, never committed (session-ledger scoping on the commit side, plan 19.2). HEAD movement by other sessions is tolerated while the pinned content sha is an ancestor and neither a campaign source nor an unreceipted campaign output changed between pin and HEAD. tm_fingerprint_inputs is carried by the manifest so the runner hashes the same TM artifacts the builder did (the L3 FAISS index is absent on this host)."
changes:
  - "src/workers/campaign_manifest.py: DIRTY_SCOPES / DEFAULT_TM_FINGERPRINT_INPUTS; CampaignManifest.dirty_scope, tm_fingerprint_inputs; validate_schema rejects unknown scopes; verify_environment scoped branches (HEAD-movement rule, dirty rule) with the frozen_baseline branch byte-for-byte preserved"
  - "src/workers/campaign_runner.py: both require_clean=True call sites unchanged (the scope is a manifest policy, not a call-site flag)"
  - "scripts/campaign/build_campaign_manifest.py: --dirty-scope (default campaign_paths), tm_fingerprint_inputs emitted"
acceptance_tests: tests/unit/workers/test_campaign_replace_existing_and_dirty_scope.py
  - "unrelated dirty paths (untracked + modified) do not block under campaign_paths; the same repo blocks under frozen_baseline"
  - "an unreceipted candidate output still blocks; a dirty/changed source still blocks"
  - "HEAD moved by another session's unrelated commit -> passes; a committed source edit -> blocks"
  - "manifest tm_fingerprint_inputs honoured; unknown dirty_scope rejected"
