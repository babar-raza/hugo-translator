  - "gate 42 (whole-page language mismatch): first attempt used an accent-stripped fake-foreign string that classified at confidence 0.156 -- below the gate's own >=0.85 anti-false-positive guard, so it correctly stayed silent. Fixed with genuinely fluent French prose (0.985 confidence)."
  - "gate 43 (block-scalar key leak): first attempt ran generic yaml.dump() over a Python string with an embedded '\\n', which PyYAML rendered as double-quoted (not the folded/literal block-scalar shape _is_multiline_source_field's raw-physical-line-count check and the leak regex's embedded-actual-newline requirement both need). Fixed by hand-authoring raw YAML with a literal '|' block scalar for this one fixture pair only."
