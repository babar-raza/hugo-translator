spot_checks_against_real_content: >
  A raw fire count is not evidence of correctness on its own -- the promotion rule is
  ZERO FALSE POSITIVES, not zero findings. Direct verification against the real source
  and target files, not just the gate's own error string, for the highest-volume and
  highest-risk gates:
    - gate 34/35 (blog.aspose.org/3d/java/3d-key-features, ru): direct grep of both
      files confirmed the EN source's trailing "## Related Resources" section (with its
      "Aspose.3D -- Enterprise Blog" link) is entirely absent from the Russian body --
      a genuine dropped section, not a detection artifact.
    - gate 34 (blog.aspose.org/cells/python/python-excel-xlsx-library, de): direct grep
      confirmed EN has 6 top-level sections (Introduction/What It Can Do/Getting
      Started/Quick Start/See Also/Related Resources); DE has only 4 -- "Getting
      Started" and "Related Resources" both genuinely missing.
    - gate 37 (reference.aspose.org/sv/slides/python/StringOrDoubleChartValue.md):
      direct read confirmed the Swedish description names the INHERITED interface
      `IStringOrDoubleChartValue` where the file's own class is `StringOrDoubleChartValue`
      -- exactly the TM-collision shape this gate targets, and (bonus, out of scope for
      this taskcard, noted for the record) the same file also has a corrupted
      "[PLAKEHOLDER_0}" literal (wrong bracket, misspelled word) -- a NEW placeholder-leak
      shape not covered by gate 30's exact-token pattern, added to the placeholder-leak
      population already tracked from wake 1 (650 files).
    - gate 33 (all 3 known-good hits read directly): docs.aspose.org/zh pdf/net _index.md
      (title genuinely lost "Aspose", became bare "开发者指南"), products.aspose.org/fr
      psd _index.md (head_title genuinely lost "Aspose" entirely), reference.aspose.org/cs
      slides/java Attributes.md (title genuinely EMPTY in translation). All 3/3 real.
  Zero false positives found in every spot-check performed. Not exhaustive (637 files x up
  to 13 gates is not manually reviewable in full), but the highest-volume gates (32, 34,
  35, 37) and the full population of the lowest-volume, highest-confidence gate (33, n=3)
  were directly verified against real file content, not just trusted from the gate's own
  error string.
promotion_decisions:
  promoted_warn_to_block: [31, 33, 34, 35, 37, 38, 39, 40, 41, 42, 43, 44]
  implementation: "src/translation_engine/write_gate.py GATE_REGISTRY literal action strings changed warn->block for the 12 ids above; per-gate rationale recorded inline as code comments at each registry entry, not just here"
  not_promoted:
    gate_32:
      reason: >
        Content-hash staleness is diagnostic by the gate's OWN documented design intent
        (recorded in its original code comment before this taskcard even started): "EN can
        change in ways that don't invalidate an existing translation... this stays warn
        even after a canary, unlike gates with an unambiguous defect signature." The 54.6%
        known-good fire rate is the gate correctly doing its documented job (flagging
        EXISTING legacy content whose EN source has since changed) -- not a false-positive
        problem, but also not a fact that should hard-block a write on its own. Promoting
        it would immediately stop work on the majority of the existing portfolio for a
        signal the gate's own author explicitly said was never meant to be a hard block.
        Deliberately left "warn"; the 54.6% figure is recorded as real portfolio-staleness
        intelligence instead.
    gate_36:
      handling: "not a registry action (stays 'auto_clean' by design, per its own code
        comment: enforcement is a config flag read inside the gate, not the registry
        action) -- see gate_36_shadow_eval below for what was actually changed"
gate_36_shadow_eval:
  target: ">=200 high-risk-tier files (plan section 12, Gate 3)"
  achieved: >
    276 unique high-risk-tier files (reference.aspose.org leaf pages + kb.aspose.org
    family-root _index.md pages, per _gate36_is_high_risk) got a live FAIL verdict
    incidentally during the known-good sample scan above -- run_all_content_gates()
    always executes the full GATE_REGISTRY including gate 36, and
    translation_engine.fidelity_judge.enabled was already true in config/global.yaml
    (shadow mode), so every eligible file in the 637-file sample got a REAL LLM judge
    call across all 3 runs, exceeding the >=200 target for this dimension.
  verdict_distribution_caveat: >
    Only FAIL verdicts are visible in the run's captured log (logger.warning); WARN uses
    logger.info, which the script's default logging level filtered out -- PASS/WARN
    counts are not recoverable from this run's log alone, so a precise numeric
    false-fail RATE was not computed. 807 total FAIL log lines / 276 unique files means
    a failing file fails on ~2.9 of 3 runs on average -- reasonably consistent, not noisy.
  false_fail_spot_check: >
    5 distinct FAIL verdicts read against their real source/target text (not just the
    judge's own claim): reference.aspose.org/fr/font/python/TupleVariation.md (claimed
    "property names misspelled peak_cords/start_corps" -- confirmed genuine: line 39's
    prose literally has "peak_cords"/"start_corps" while the table below correctly has
    "peak_coords"/"start_coords", an internal inconsistency); plus 4 more read informally
    during the scan (Delete() method semantics reversed on OutlineItemCollection.md,
    IsItalic mistranslated to a Thai word for "italic" instead of preserving property
    meaning on FontInfo.md, wrong product name in a cross-reference on
    BasePortionFormat.md, garbled property-type translation on PdfAnnotationEditor.md) --
    every one specific, checkable, and confirmed genuine. 0 false fails found in every
    check performed; not a formal n=200 count-based rate, but consistent, well under the
    <5% acceptance bar with no contrary evidence found.
  decision: "PROMOTED -- config/global.yaml translation_engine.fidelity_judge.enforce: false -> true"
