honest_limits:
  - "lang_match uses langdetect on short segments, which is unreliable below ~20 words; the absolute rates (0.70 / 0.67) are therefore a comparison signal, not a quality score. The per-language verdict is a relative ranking between two models on identical inputs."
  - "40 of the 232 segments were used to keep the run inside one wake; the remaining segments stay available for TC-APT-004b's qualification sample."
  - "no BLEU/COMET reference scoring: the portfolio has no reference translations, so the plan's own content-free proxies are what can honestly be measured here."
