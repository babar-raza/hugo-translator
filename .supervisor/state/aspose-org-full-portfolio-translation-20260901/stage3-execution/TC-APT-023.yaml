contract_defined (src/workers/determinism.py):
  statement: "given an unchanged source, an unchanged profile_fingerprint, an unchanged protection_fingerprint and a verified-unchanged model identity (TC-APT-021), two independent runs of the same job must produce output that is BYTE_IDENTICAL, or SEMANTICALLY_EQUIVALENT (all 44 gates pass on BOTH runs AND token-level similarity >= threshold), else DIVERGENT -- a contract violation to investigate"
  precondition_is_explicit: "fingerprints_unchanged() -- the contract only binds while every fingerprint matches; a changed fingerprint is a re-baseline event, never reported as a determinism regression"
  similarity_threshold: "0.95 PROPOSAL (SequenceMatcher over word/punctuation tokens), to be calibrated -- see the measured distribution below"
  gate9_drift_check: "compare_with_baseline() reports drift only when fingerprints are unchanged and the semantic-equivalence rate fell more than the tolerance (default 0.05)"
