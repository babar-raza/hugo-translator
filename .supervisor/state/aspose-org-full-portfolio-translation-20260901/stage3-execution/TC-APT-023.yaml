findings (recorded honestly, not smoothed):
  - "professionalize_llm is NOT byte-deterministic on real content at temperature 0: only 75% of segment reruns are byte-identical. The TC-APT-028 preflight's 10/10 identical result came from a 12-word echo canary and does NOT generalise to production-length segments -- a measurement artifact worth stating rather than a contradiction."
  - "Nondeterminism is strongly language-dependent: fr 0/8 divergent, de and ar 1/8 each, ja 4/8 with one pair at 0.286 similarity. CJK is the risk class, consistent with the plan's tier-3 heuristic (TC-APT-024) arrived at independently."
  - "Implication for TC-APT-004b: the qualification's 'reproduced on a second independent run' criterion cannot mean byte-identical output for this provider. It must mean the SEMANTIC contract (all 44 gates pass on both runs and similarity >= threshold), and even then ~19% of segment pairs currently fall outside a 0.95 threshold. This is the honest limit plan 5.1 item 6 anticipated; the mission measures and bounds it rather than claiming reproducibility."
  - "Threshold calibration data: 24/32 pairs are exactly 1.0 and 2 more clear 0.95, so 0.95 separates 'trivial rewording' from 'materially different translation' for 81% of pairs. Lowering it to 0.85 would classify 30 of 32 as equivalent. The value stays at 0.95 pending Gate-4 file-level (not segment-level) data, where whole-page similarity is expected to be higher than per-segment."
