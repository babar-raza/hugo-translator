item_1_gate12_root_cause_fix:
  finding: "the phase-7 fix was symptom-only in BOTH directions. (a) The cleaner rewrote '..' -> '.' in every non-fenced segment, so it could corrupt legitimate content that must keep a double dot: relative links [x](../y.md), inline code `range(0..5)`, Hugo shortcode parameters {{< include path=\"../shared.md\" >}}, HTML attributes, bare URLs, reference-style definitions. (b) The source-side bail-out ('if \"..\" in source body: return') was body-wide, so any page whose source legitimately contains '..' anywhere (a code sample, a relative link) disabled the gate for the whole page. The cleaner's blast radius was wider than the defect and its coverage narrower -- exactly the recurrence risk the audit flagged."
  fix: "src/translation_engine/write_gate.py: _GATE12_PROTECTED_RE masks fenced code (FIRST -- masking inline code first ate the fence markers, a defect the new fixture caught), inline code, markdown link/image targets, HTML tags, Hugo shortcodes, bare URLs, reference definitions and ../ paths; the '..' -> '.' rewrite then runs once over prose only and the spans are restored verbatim. The source-side bail-out uses the same prose-scoped check (_gate12_has_prose_double_dot / _gate12_strip_protected)."
  regression_fixture: tests/regression/test_gate12_double_period_prose_only.py (10 tests: prose still cleaned; ellipsis untouched; relative links, inline code, shortcodes, HTML+URL, reference definitions and fenced code all survive byte-for-byte; the historical source-prose bail-out preserved; no-change identity)
  blast_radius_measured: "scripts/quality/scan_gate12_double_periods.py over the live content repo: 10 defective targets out of 112,584 existing targets (0.009%). Kinds: 10 prose, 3 list-item hits; languages ko 5, ro/ar/ru/sv/tr 1 each. Report: data/quality/gate12_double_period_scan.json. All 10 are UNKNOWN_PROVENANCE cells already scheduled for reprocessing by the ledger; no output patching was performed (plan 10 step 6)."
  separate_finding_recorded: "the Arabic sample is not a double-period defect but PLACEHOLDER CORRUPTION ('{ p.l.c.h.o.r.e.s}' from a mangled {PLACEHOLDER_n} token). Routed to TC-APT-010/011 as a gate-43 placeholder-leak fixture candidate, not silently fixed here."
