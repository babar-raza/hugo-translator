# Validation Engine Configuration
# This file defines validation rules, retry strategies, and validation modes
# for the Hugo Translation System validation pipeline.

version: "1.0"

# Decision Rules: Configure when to reject/retry translations
decision_rules:
  # Rejection thresholds - when to reject a translation outright
  reject_on_error_count: 3  # Reject if this many errors are detected
  reject_on_placeholder_error: true  # Reject if placeholder integrity fails
  reject_on_code_block_error: true  # Reject if code blocks are corrupted
  reject_on_link_error: true  # Reject if links are broken

  # Retry configuration - when to attempt re-translation
  max_retry_attempts: 2  # Maximum number of retry attempts
  retry_on_structure_error: true  # Retry if markdown structure is damaged
  retry_on_terminology_warning: true  # Retry if terminology violations found

  # Acceptance thresholds - when to accept despite issues
  accept_warnings: true  # Accept translation with warnings (non-critical issues)
  accept_after_max_retries: true  # Accept after max retries even if issues remain

# Retry Strategy: How to modify retry attempts
retry_strategy:
  feedback_mode: "detailed"  # Feedback detail level: "brief", "detailed", "examples"
  vary_temperature: true  # Vary LLM temperature on retries
  temperature_increment: 0.1  # How much to increase temperature per retry
  max_temperature: 1.0  # Maximum temperature to use

# Validation Modes: Predefined validation mode profiles
# Users can select a mode via CLI or config to adjust validation strictness
validation_modes:
  # Strict mode: Zero tolerance for errors, minimal retries
  strict:
    accept_warnings: false  # Do not accept warnings
    reject_on_error_count: 1  # Reject on first error
    max_retry_attempts: 1  # Only one retry allowed

  # Normal mode: Balanced validation (default)
  normal:
    accept_warnings: true  # Accept warnings
    reject_on_error_count: 3  # Reject after 3 errors
    max_retry_attempts: 2  # Two retry attempts

  # Lenient mode: Tolerant of issues, more retries
  lenient:
    accept_warnings: true  # Accept warnings
    reject_on_error_count: 5  # Reject after 5 errors
    max_retry_attempts: 2  # Two retry attempts

# Validators: Enable/disable individual validators
# Each validator can be toggled on/off and configured
validators:
  # Legacy validators (pre-translation validation)
  yaml:
    enabled: true
    description: "Validates YAML frontmatter syntax"

  placeholder:
    enabled: true
    description: "Validates placeholder integrity"

  structure:
    enabled: true
    description: "Validates markdown structure preservation"

  link:
    enabled: true
    description: "Validates link integrity"

  # New post-translation validators (VAL-01 through VAL-06)
  completeness:
    enabled: true
    description: "Validates 100% segment coverage"

  language_consistency:
    enabled: true
    confidence_threshold: 0.85
    description: "Validates target language consistency using langdetect"

  shortcode_preservation:
    enabled: true
    description: "Validates Hugo shortcode preservation"

  frontmatter_protection:
    enabled: true
    description: "Validates frontmatter field protection rules"

  terminology_preservation:
    enabled: true
    validation_mode: "strict"
    description: "Validates terminology preservation (Aspose, .NET, etc.)"

  file_placement:
    enabled: true
    description: "Validates file placement and directory structure"
