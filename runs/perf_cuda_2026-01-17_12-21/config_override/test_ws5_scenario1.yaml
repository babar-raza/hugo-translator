# WS5 Test Scenario 1: All Systems Enabled
# Used for Test 5.1 (OOM Recovery), Test 5.2 (Learning Persistence), Test 5.3 (Observability)

# Model configuration
model_defaults:
  default_model: "m2m100_418m"
  fallback_model: "m2m100_418m"
  cache_dir: "./models"

# Autonomous Recovery Configuration
autonomous_recovery:
  # OOM Retry Handler (WS1)
  oom_retry:
    enabled: true
    max_retries: 3
    batch_reduction_factor: 0.5
    min_batch_size: 1

# Adaptive Batch Translation (WS2, WS3)
adaptive:
  enabled: true
  fallback_rate_threshold: 0.05  # 5% threshold
  state_file: ".translation_progress/batch_stats.json"

# Language Detection
language_detection:
  provider: "fasttext"
  fasttext:
    model_path: "./models/fasttext/lid.176.bin"
  adaptive_similarity:
    enabled: true
    state_file: ".translation_progress/similarity_thresholds.json"

# Telemetry (optional, can disable for testing)
telemetry:
  enabled: false
  sentry:
    dsn: ""

# Commit Configuration (for git integration)
commit:
  enabled: false  # Disable auto-commit during testing
  commit_per_language: false
  message_style: "standard"

# Translation Engine
engine:
  batch_size: 20  # Default, will be overridden by --batch-size CLI flag
  parallel_files: false  # Sequential processing for clearer test logs
  skip_existing: false  # Always re-translate for testing
